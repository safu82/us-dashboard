<script>
// ── Supabase + helpers ────────────────────────────────────────────────────
const SB_URL='https://jblrurlpyplbquqibphh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpibHJ1cmxweXBsYnF1cWlicGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNDY1NzAsImV4cCI6MjA5NDkyMjU3MH0.oYZarIlHqxpZY6ZWA0KRD9HoxYyv80otXKVNkpuNLRo';
const sb = supabase.createClient(SB_URL, SB_KEY);

const N = (v, d=2) => v == null ? null : +Number(v).toFixed(d);
const fmt = (v, d=2) => v == null ? '<span class="na">—</span>' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtUsd = (v, d=0) => v == null ? '<span class="na">—</span>' : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtBn = (v) => {
    if (v == null) return '<span class="na">—</span>';
    const n = Math.abs(Number(v));
    if (n >= 1e12) return '$' + (Number(v)/1e12).toFixed(2) + 'T';
    if (n >= 1e9)  return '$' + (Number(v)/1e9).toFixed(2)  + 'B';
    if (n >= 1e6)  return '$' + (Number(v)/1e6).toFixed(2)  + 'M';
    return '$' + Number(v).toFixed(0);
};
const col = (v) => v == null ? '' : v >= 0 ? 'green' : 'red';
const getTicker = () => {
    const p = new URLSearchParams(location.search);
    return (p.get('symbol') || p.get('ticker') || p.get('t') || '').toUpperCase();
};

Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';
Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
Chart.defaults.font.size = 11;

// ── Data fetch (parallel) ────────────────────────────────────────────────
async function fetchAll(ticker) {
    const safe = async (p, label) => {
        try { const r = await p; if (r.error) { console.error(label, r.error); return null; } return r; }
        catch (e) { console.error(label, e); return null; }
    };
    const [lR, sR, fR, sigR, presR, hR, ahR, srR, secR, indR, ptR, alR, cvR] = await Promise.all([
        safe(sb.from('live_prices').select('*').eq('ticker', ticker).maybeSingle(), 'live_prices'),
        safe(sb.from('daily_stock_snapshots')
            .select('snapshot_date,open,high,low,close,volume,ema_9,ema_20,ema_50,ema_200,atr_14,rsi_14,rsi_ema_9,weekly_rsi_14,weekly_rsi_ema_9,high_52w,alkalyme_rs,rs_rank,vol_ratio,sector_percentile,sector_composite_pct,peer_percentile,peer_composite_pct,peer_group,bz_streak,gc_crossover_date,macd_line,macd_signal,macd_hist,adx_14')
            .eq('ticker', ticker).order('snapshot_date', { ascending: false }).limit(380), 'snapshots'),
        safe(sb.from('stock_fundamentals').select('*').eq('ticker', ticker).maybeSingle(), 'fundamentals'),
        safe(sb.from('entry_signals').select('pattern,signal_strength,alert_date,close,metadata').eq('ticker', ticker).order('alert_date', { ascending: false }).limit(40), 'entry_signals'),
        safe(sb.from('presignal_scores').select('rule,snapshot_date,score,metadata').eq('ticker', ticker).order('snapshot_date', { ascending: false }).limit(30), 'presignal_scores'),
        safe(sb.from('holdings').select('name,quantity,avg_cost,sector,market_cap_usd').eq('ticker', ticker).maybeSingle(), 'holdings'),
        safe(sb.from('holdings').select('ticker,quantity,avg_cost'), 'all_holdings'),
        // Latest sector_rankings row for this ticker's peer_group (joined via daily_stock_snapshots.peer_group)
        safe(sb.from('us_stock_sectors').select('sector,industry,company_name').eq('ticker', ticker).maybeSingle(), 'us_stock_sectors'),
        safe(sb.from('sector_rankings').select('peer_group,composite,composite_rank,breadth,n_tickers,avg_alkalyme_rs,rs_slope,rrg_quadrant,parent_sector,peer_group_type,snapshot_date').order('snapshot_date', { ascending: false }).limit(120), 'sector_rankings'),
        safe(sb.from('analyst_ratings').select('*').eq('ticker', ticker).maybeSingle(), 'analyst_ratings'),
        safe(sb.from('paper_trades').select('*').eq('ticker', ticker).order('entry_date', { ascending: false }).limit(10), 'paper_trades'),
        safe(sb.from('alerts').select('alert_type,alert_date,direction,close,metadata').eq('ticker', ticker).order('alert_date', { ascending: false }).limit(20), 'alerts'),
        safe(sb.from('conviction_scores').select('score, grade, breakdown, snapshot_date, last_updated').eq('ticker', ticker).maybeSingle(), 'conviction_scores'),
    ]);
    return {
        live: lR?.data, snaps: sR?.data || [], fund: fR?.data,
        signals: sigR?.data || [], presignals: presR?.data || [],
        holding: hR?.data, allHoldings: ahR?.data || [],
        meta: srR?.data,
        sectorRankings: secR?.data || [],
        analyst: indR?.data, paperTrades: ptR?.data || [],
        alerts: alR?.data || [],
        conviction: cvR?.data,
    };
}

function computeReturns(snaps, cmp) {
    if (!snaps?.length || !cmp) return {};
    const s = n => snaps[Math.min(n, snaps.length - 1)]?.close;
    const r = n => s(n) ? N((cmp - s(n)) / s(n) * 100, 1) : null;
    const ys = new Date().getFullYear() + '-01-01';
    const ytdRow = [...snaps].reverse().find(x => x.snapshot_date < ys);
    return {
        '1W':  r(5),  '1M':  r(21), '3M':  r(63),
        '6M':  r(126), 'YTD': ytdRow?.close ? N((cmp - ytdRow.close) / ytdRow.close * 100, 1) : null,
        '1Y':  r(252),
    };
}

// US session phase for AH/PM display in the price block
function sessionPhaseFromLive(live) {
    const yahoo = live?.market_state;
    if (yahoo) {
        const s = String(yahoo).toUpperCase();
        if (s === 'REGULAR') return 'REGULAR';
        if (s.startsWith('PRE')) return 'PRE';
        if (s.startsWith('POST')) return 'POST';
        if (s === 'CLOSED') return 'CLOSED';
    }
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date()).map(p => [p.type, p.value]));
    if (parts.weekday === 'Sat' || parts.weekday === 'Sun') return 'CLOSED';
    const mins = parseInt(parts.hour) * 60 + parseInt(parts.minute);
    if (mins >= 9*60+30 && mins < 16*60) return 'REGULAR';
    if (mins >= 4*60 && mins < 9*60+30) return 'PRE';
    if (mins >= 16*60 && mins < 20*60) return 'POST';
    return 'CLOSED';
}

// ── Render ───────────────────────────────────────────────────────────────
async function render(ticker, d) {
    const { live, snaps, fund, signals, presignals, holding, allHoldings, meta, sectorRankings, analyst, paperTrades, alerts } = d;
    const latest = snaps[0] || {};
    // The live worker only streams holdings + paper-trade tickers, so live_prices
    // is frozen for everything else. Trust the live tick only if it's at least as
    // recent as the latest EOD close; otherwise fall back to that close (which the
    // daily job keeps current for the whole universe).
    const latestSnapDate = latest.snapshot_date;
    const liveTs = live?.updated_at ? new Date(live.updated_at) : null;
    const liveFresh = !!(live?.price && liveTs && (!latestSnapDate ||
        liveTs >= new Date(latestSnapDate + 'T00:00:00Z')));
    const cmp = liveFresh ? live.price : (latest.close ?? live?.price ?? 0);
    const sessionPhase = sessionPhaseFromLive(live);

    // Pick effective price for display (mirrors index.html effectivePrice logic)
    let displayPrice = cmp, displayChange = liveFresh ? live?.day_change_pct : null, displayTag = null;
    if (!liveFresh) {
        // EOD fallback — show the last close and its day's change, clearly tagged.
        if (snaps[1]?.close) displayChange = N((cmp - snaps[1].close) / snaps[1].close * 100, 2);
        displayTag = latestSnapDate ? `CLOSE ${latestSnapDate.slice(5)}` : 'CLOSE';
    } else if (sessionPhase === 'PRE' && live?.pre_market_price) { displayPrice = live.pre_market_price; displayChange = live.pre_market_change_pct; displayTag = 'PM'; }
    else if (sessionPhase === 'POST' && live?.post_market_price) { displayPrice = live.post_market_price; displayChange = live.post_market_change_pct; displayTag = 'AH'; }

    // 52W high distance + ATH distance
    const high52w = latest.high_52w;
    const dist52w = high52w && cmp ? N((cmp - high52w) / high52w * 100, 1) : null;
    const ath = fund?.ath_price;
    const athDist = ath && cmp ? N((cmp - ath) / ath * 100, 1) : null;

    // Blue Zone — same rules as scanner
    const rsD = latest.rsi_ema_9 || latest.alkalyme_rs;
    const rsW = latest.weekly_rsi_ema_9 || latest.weekly_rsi_14;
    const aboveEma20 = cmp && latest.ema_20 && cmp > latest.ema_20;
    const within52w = cmp && high52w && cmp >= high52w * 0.90;
    const rsRankOk = latest.rs_rank && latest.rs_rank <= 125;
    const bzStrong = rsRankOk && rsD >= 72 && rsW >= 65 && aboveEma20 && within52w && (latest.vol_ratio == null || latest.vol_ratio >= 1.5);
    const bzBuy = rsRankOk && rsD >= 65 && rsW >= 55 && aboveEma20 && within52w;
    const bzSignal = bzStrong ? 'STRONG BUY' : bzBuy ? 'BUY' : null;

    const emaBull = cmp && latest.ema_20 && latest.ema_50 && latest.ema_200 && cmp > latest.ema_20 && latest.ema_20 > latest.ema_50 && latest.ema_50 > latest.ema_200;
    const emaBear = cmp && latest.ema_20 && latest.ema_50 && latest.ema_200 && cmp < latest.ema_20 && latest.ema_20 < latest.ema_50 && latest.ema_50 < latest.ema_200;

    // Returns
    const snapR = computeReturns(snaps, cmp);
    const returns = {
        '1W':  fund?.return_1w  ?? snapR['1W'],
        '1M':  fund?.return_1m  ?? snapR['1M'],
        '3M':  fund?.return_3m  ?? snapR['3M'],
        '6M':  fund?.return_6m  ?? snapR['6M'],
        'YTD': fund?.return_ytd ?? snapR['YTD'],
        '1Y':  fund?.return_1y  ?? snapR['1Y'],
    };

    // Portfolio block (if held)
    let portfolioWeight = null, portfolioValue = null, portfolioCost = null, portfolioPnl = null;
    if (holding && cmp && allHoldings.length) {
        const thisValue = holding.quantity * cmp;
        const thisCost  = holding.quantity * holding.avg_cost;
        const tickers = allHoldings.map(h => h.ticker);
        const { data: livePrices } = await sb.from('live_prices').select('ticker, price').in('ticker', tickers);
        const priceMap = {}; (livePrices || []).forEach(r => { priceMap[r.ticker] = r.price; });
        const totalValue = allHoldings.reduce((sum, h) => sum + (h.quantity * (priceMap[h.ticker] || h.avg_cost)), 0);
        portfolioValue = thisValue; portfolioCost = thisCost; portfolioPnl = thisValue - thisCost;
        portfolioWeight = totalValue > 0 ? (thisValue / totalValue * 100) : null;
    }

    // Sector / peer-group context — find latest snapshot row for this ticker's peer_group
    const peerGroup = latest.peer_group || (meta?.industry);
    const latestSecDate = sectorRankings[0]?.snapshot_date;
    const sec = sectorRankings.find(s => s.peer_group === peerGroup && s.snapshot_date === latestSecDate)
             || sectorRankings.find(s => s.peer_group === peerGroup)
             || null;

    // Build header badges
    const badges = [];
    if (emaBull) badges.push('<span class="badge badge-green">STRONG UPTREND</span>');
    else if (emaBear) badges.push('<span class="badge badge-red">DOWNTREND</span>');
    if (bzSignal) badges.push(`<span class="badge badge-blue">BZ: ${bzSignal}</span>`);
    if (latest.rs_rank) badges.push(`<span class="badge badge-orange">Rank #${latest.rs_rank}</span>`);
    if (holding) badges.push('<span class="badge badge-yellow">★ PORTFOLIO</span>');
    if (paperTrades.length) {
        const openPaper = paperTrades.find(t => t.status === 'open');
        if (openPaper) badges.push(`<span class="badge badge-purple">🤖 PAPER (${openPaper.strategy_tier})</span>`);
    }
    if (sec?.rrg_quadrant) {
        const colMap = { Leading: 'badge-green', Improving: 'badge-blue', Weakening: 'badge-yellow', Lagging: 'badge-red' };
        badges.push(`<span class="badge ${colMap[sec.rrg_quadrant] || 'badge-blue'}">${sec.rrg_quadrant} · ${peerGroup}</span>`);
    }

    // Quarterly financials
    let quarterly = [];
    try { quarterly = typeof fund?.quarterly_financials === 'string' ? JSON.parse(fund.quarterly_financials) : (fund?.quarterly_financials || []); }
    catch (e) {}

    document.title = `${ticker} — Deep Dive`;

    // ── HTML ────────────────────────────────────────────────────────────
    const html = `
    <div class="header">
        <div>
            <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
                <span class="ticker-big">${ticker}</span>
                <span style="color:var(--text2);font-size:13px">${meta?.company_name || holding?.name || fund?.stock_name || ''}</span>
                ${meta?.industry ? `<span class="badge badge-blue" style="font-size:11px">${meta.industry}</span>` : ''}
                ${fund?.market_cap_usd ? `<span style="color:var(--text2);font-size:12px">Mcap ${fmtBn(fund.market_cap_usd)}</span>` : ''}
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${badges.join('')}</div>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
            <div style="text-align:right">

// ── Analyst panel — large, dedicated section ────────────────────────────
function renderAnalystPanel(a, cmp) {
    const consensus = (a.consensus || '').toLowerCase();
    const sMap = {
        'strong_buy':    { label: 'STRONG BUY', color: '#10b981', emoji: '🟢' },
        'buy':           { label: 'BUY',        color: '#22c55e', emoji: '🟢' },
        'hold':          { label: 'HOLD',       color: '#f59e0b', emoji: '🟡' },
        'underperform':  { label: 'UNDERPERFORM', color: '#ef4444', emoji: '🔴' },
        'sell':          { label: 'SELL',       color: '#ef4444', emoji: '🔴' },
        'strong_sell':   { label: 'STRONG SELL', color: '#dc2626', emoji: '🔴' },
    };
    const s = sMap[consensus] || { label: (a.consensus || '?').toUpperCase(), color: '#94a3b8', emoji: '⚪' };
    const tgt = Number(a.target_mean) || null;
    const low = Number(a.target_low) || null;
    const high = Number(a.target_high) || null;
    const upside = (tgt && cmp) ? (tgt / cmp - 1) * 100 : null;

    // Position markers on a 0–100% scale from low to high target.
    // Map a price to a percentage along the bar (low=0%, high=100%).
    const span = (high && low) ? (high - low) : 0;
    const pctAt = (v) => v == null || !span ? null : Math.max(0, Math.min(100, ((v - low) / span) * 100));
    const cmpPct = pctAt(cmp);
    const meanPct = pctAt(tgt);

    const counts = a.rating_counts || {};
    const totalCounts = (counts.strongBuy || 0) + (counts.buy || 0) + (counts.hold || 0) + (counts.sell || 0) + (counts.strongSell || 0);

    return `
    <div class="card">
        <div class="card-title">🎯 Analyst Coverage</div>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-bottom:8px">
            <div style="text-align:center">
                <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:14px;background:${s.color}18;color:${s.color};border:1px solid ${s.color}40;font-size:14px;font-weight:700">
                    ${s.emoji} ${s.label}
                </div>
                <div style="margin-top:8px;font-size:22px;font-weight:700;color:${upside == null ? 'var(--text2)' : upside >= 0 ? 'var(--green)' : 'var(--red)'}">
                    ${upside != null ? (upside >= 0 ? '+' : '') + upside.toFixed(1) + '%' : '—'}
                </div>
                <div class="card-sub">avg target ${fmtUsd(tgt, 0)}</div>
                <div class="card-sub" style="margin-top:8px">${a.num_analysts || 0} analyst${(a.num_analysts || 0) === 1 ? '' : 's'}</div>
            </div>
            <div>
                <div style="font-size:11px;color:var(--text2);margin-bottom:4px">Target Range</div>
                ${low != null && high != null ? `
                <div class="target-bar">
                    ${meanPct != null ? `<div class="target-marker" style="left:${meanPct}%;border-color:${s.color}"><b>Avg</b> ${fmtUsd(tgt, 0)}</div>` : ''}
                    ${cmpPct != null ? `<div class="target-marker" style="left:${cmpPct}%;border-color:var(--blue);top:34px"><b>CMP</b> ${fmtUsd(cmp, 0)}</div>` : ''}
                </div>
                <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:30px">
                    <span>Low ${fmtUsd(low, 0)}</span>
                    <span>High ${fmtUsd(high, 0)}</span>
                </div>` : '<div class="text2">No target range</div>'}
            </div>
        </div>

        ${totalCounts > 0 ? `
        <div style="margin-top:14px">
            <div style="font-size:11px;color:var(--text2);margin-bottom:6px">Current Month Ratings Mix (${totalCounts} ratings)</div>
            <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg3)">
                <div style="background:#10b981;width:${(counts.strongBuy || 0) / totalCounts * 100}%" title="Strong Buy: ${counts.strongBuy || 0}"></div>
                <div style="background:#22c55e;width:${(counts.buy || 0) / totalCounts * 100}%" title="Buy: ${counts.buy || 0}"></div>
                <div style="background:#f59e0b;width:${(counts.hold || 0) / totalCounts * 100}%" title="Hold: ${counts.hold || 0}"></div>
                <div style="background:#ef4444;width:${(counts.sell || 0) / totalCounts * 100}%" title="Sell: ${counts.sell || 0}"></div>
                <div style="background:#dc2626;width:${(counts.strongSell || 0) / totalCounts * 100}%" title="Strong Sell: ${counts.strongSell || 0}"></div>
            </div>
            <div style="display:flex;gap:14px;font-size:11px;margin-top:6px;color:var(--text2);flex-wrap:wrap">
                <span><span style="color:#10b981">●</span> Strong Buy ${counts.strongBuy || 0}</span>
                <span><span style="color:#22c55e">●</span> Buy ${counts.buy || 0}</span>
                <span><span style="color:#f59e0b">●</span> Hold ${counts.hold || 0}</span>
                <span><span style="color:#ef4444">●</span> Sell ${counts.sell || 0}</span>
                <span><span style="color:#dc2626">●</span> Strong Sell ${counts.strongSell || 0}</span>
            </div>
        </div>` : ''}

        ${a.smart_score != null || a.best_consensus || a.hedge_fund_rating || a.insider_rating ? renderTipRanksBlock(a, cmp) : ''}

        ${a.recent_actions && a.recent_actions.length ? `
        <div style="margin-top:18px">
            <div style="font-size:11px;color:var(--text2);margin-bottom:8px">Recent Rating Actions (last ${a.recent_actions.length})</div>
            <div style="display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto">
                ${a.recent_actions.slice(0, 15).map(act => {
                    const actColor = act.action === 'up' ? '#10b981' : act.action === 'down' ? '#ef4444' : '#94a3b8';
                    return `<div style="display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;padding:6px 10px;background:var(--bg3);border-radius:5px;font-size:12px">
                        <span style="color:var(--text2);font-size:11px">${(act.date || '').slice(0, 10)}</span>
                        <span><b>${act.firm}</b>: ${act.from_grade || '—'} → ${act.to_grade}</span>
                        <span style="font-size:10px;padding:1px 6px;border-radius:4px;background:${actColor}18;color:${actColor};font-weight:700">${(act.action || '').toUpperCase()}</span>
                    </div>`;
                }).join('')}
            </div>
        </div>` : ''}

        <div style="font-size:10px;color:var(--text2);margin-top:14px">Source: yfinance${a.tipranks_last_updated ? ' + TipRanks' : ''} · Last updated: ${a.last_updated ? new Date(a.last_updated).toLocaleString() : '—'}</div>
    </div>`;
}

// Conviction Score panel — big A-D grade + per-component breakdown bar.
// Rendered at the top of the deep dive page (right under the header) so
// the user sees the headline conviction read immediately.
function renderConvictionPanel(c) {
    if (!c) return '';
    const score = Number(c.score) || 0;
    const grade = c.grade || '?';
    const gColor = grade === 'A' ? '#3fb950' : grade === 'B' ? '#58a6ff' : grade === 'C' ? '#e3b341' : '#f85149';
    const bd = Array.isArray(c.breakdown) ? c.breakdown : [];
    return `
    <div class="card" style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
        <div style="text-align:center;min-width:130px">
            <div class="card-title" style="margin-bottom:6px">Conviction Score</div>
            <div style="display:flex;align-items:center;gap:10px;justify-content:center">
                <div style="font-size:36px;font-weight:800;color:${gColor};line-height:1">${grade}</div>
                <div>
                    <div style="font-size:16px;font-weight:700">${score.toFixed(0)}/100</div>
                    <div style="width:120px;height:5px;background:var(--border);border-radius:3px;margin-top:4px;overflow:hidden">
                        <div style="width:${Math.min(100, Math.max(0, score))}%;height:100%;background:${gColor}"></div>
                    </div>
                </div>
            </div>
            <div class="card-sub" style="margin-top:8px">A≥80 · B≥65 · C≥45</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;flex:1">
            ${bd.map(b => `
            <div style="text-align:center;padding:8px 10px;background:var(--bg3);border-radius:6px;min-width:84px">
                <div style="font-size:10px;color:var(--text2);margin-bottom:3px;white-space:nowrap">${b.label}</div>
                <div style="font-size:14px;font-weight:700;color:${b.pts === b.max ? 'var(--green)' : b.pts > 0 ? 'var(--blue)' : 'var(--text2)'}">${b.pts}/${b.max}</div>
                <div style="font-size:10px;color:var(--text2);margin-top:2px;white-space:nowrap">${b.detail || ''}</div>
            </div>`).join('')}
        </div>
    </div>`;
}

// TipRanks-specific signals block. Inserted in the middle of the Analyst Coverage
// panel so the yfinance broad consensus + TipRanks top-analyst view sit next to
// each other for direct comparison.
function renderTipRanksBlock(a, cmp) {
    const ss = a.smart_score != null ? Number(a.smart_score) : null;
    const ssColor = ss == null ? '#94a3b8'
                  : ss >= 8 ? '#10b981'
                  : ss >= 6 ? '#22c55e'
                  : ss >= 4 ? '#f59e0b'
                  : ss >= 2 ? '#f97316' : '#ef4444';

    const ratingColor = (r) => {
        const rl = (r || '').toLowerCase();
        if (rl === 'buy') return '#10b981';
        if (rl === 'sell') return '#ef4444';
        if (rl === 'hold') return '#f59e0b';
        return '#94a3b8';
    };

    const bestCon = (a.best_consensus || '').toLowerCase();
    const bestConDisplay = a.best_consensus
        ? a.best_consensus.replace(/([A-Z])/g, ' $1').trim().toUpperCase()
        : '—';
    const bestConColor = bestCon.includes('strongbuy') ? '#10b981'
                       : bestCon.includes('buy') ? '#22c55e'
                       : bestCon.includes('hold') ? '#f59e0b'
                       : bestCon.includes('sell') ? '#ef4444' : '#94a3b8';
    const bestUp = a.best_target_upside_pct;
    const bestUpColor = bestUp == null ? '#94a3b8' : bestUp >= 0 ? '#10b981' : '#ef4444';

    return `
    <div style="margin-top:18px;padding-top:14px;border-top:1px dashed var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="font-size:11px;color:var(--text2);font-weight:600;letter-spacing:0.5px">TIPRANKS SIGNALS</div>
            <span style="font-size:10px;color:var(--text2)">Smart Score, Top-Analyst, Sentiment</span>
        </div>

        <div style="display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-bottom:14px">
            <!-- Smart Score big number -->
            <div style="text-align:center;min-width:120px">
                <div style="font-size:10px;color:var(--text2);margin-bottom:4px">Smart Score</div>
                <div style="font-size:38px;font-weight:800;color:${ssColor};line-height:1">${ss != null ? ss.toFixed(0) : '—'}</div>
                <div style="font-size:10px;color:var(--text2)">of 10</div>
            </div>
            <!-- Consensus comparison: TipRanks broad vs Top-Analyst -->
            <div style="display:flex;flex-direction:column;gap:10px">
                ${(() => {
                    const broadCon = (a.tipranks_broad_consensus || '').toLowerCase();
                    const broadConDisplay = a.tipranks_broad_consensus
                        ? a.tipranks_broad_consensus.replace(/([A-Z])/g, ' $1').trim().toUpperCase()
                        : '—';
                    const broadConColor = broadCon.includes('strongbuy') ? '#10b981'
                                       : broadCon.includes('buy') ? '#22c55e'
                                       : broadCon.includes('hold') ? '#f59e0b'
                                       : broadCon.includes('sell') ? '#ef4444' : '#94a3b8';
                    const broadTarget = a.tipranks_broad_target != null ? Number(a.tipranks_broad_target) : null;
                    const broadUp = (broadTarget && cmp) ? (broadTarget / cmp - 1) * 100 : null;
                    const broadUpColor = broadUp == null ? '#94a3b8' : broadUp >= 0 ? '#10b981' : '#ef4444';
                    const broadDist = a.tipranks_broad_distribution;
                    return a.tipranks_broad_consensus ? `
                    <div>
                        <div style="font-size:10px;color:var(--text2);margin-bottom:4px">Broad Consensus (all TipRanks-covered analysts)</div>
                        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                            <span style="display:inline-flex;padding:3px 11px;border-radius:11px;background:${broadConColor}18;color:${broadConColor};border:1px solid ${broadConColor}40;font-weight:700;font-size:12px">${broadConDisplay}</span>
                            ${broadTarget != null ? `<span style="font-size:12px"><span style="color:var(--text2)">avg target</span> <b>${fmtUsd(broadTarget, 0)}</b></span>` : ''}
                            ${broadUp != null ? `<span style="font-size:12px;color:${broadUpColor};font-weight:600">${broadUp >= 0 ? '+' : ''}${broadUp.toFixed(1)}%</span>` : ''}
                        </div>
                        ${broadDist ? `
                        <div style="font-size:11px;color:var(--text2);margin-top:4px">
                            ${broadDist.buy || 0} Buy · ${broadDist.hold || 0} Hold · ${broadDist.sell || 0} Sell
                        </div>` : ''}
                    </div>` : '';
                })()}
                <div>
                    <div style="font-size:10px;color:var(--text2);margin-bottom:4px">Top-Analyst Consensus (best-performing analysts only)</div>
                    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                        <span style="display:inline-flex;padding:4px 12px;border-radius:12px;background:${bestConColor}18;color:${bestConColor};border:1px solid ${bestConColor}40;font-weight:700;font-size:13px">${bestConDisplay}</span>
                        ${a.best_target_mean != null ? `<span style="font-size:13px"><span style="color:var(--text2)">avg target</span> <b>${fmtUsd(a.best_target_mean, 0)}</b></span>` : ''}
                        ${bestUp != null ? `<span style="font-size:13px;color:${bestUpColor};font-weight:600">${bestUp >= 0 ? '+' : ''}${bestUp.toFixed(1)}%</span>` : ''}
                    </div>
                    ${a.best_distribution ? `
                    <div style="font-size:11px;color:var(--text2);margin-top:4px">
                        ${a.best_distribution.buy || 0} Buy · ${a.best_distribution.hold || 0} Hold · ${a.best_distribution.sell || 0} Sell
                    </div>` : ''}
                </div>
            </div>
        </div>

        <!-- Sentiment row -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px">
            ${a.hedge_fund_rating ? `
            <div style="padding:8px 10px;background:var(--bg3);border-radius:6px">
                <div style="font-size:10px;color:var(--text2)">Hedge Fund Trend</div>
                <div style="font-size:13px;font-weight:700;color:${ratingColor(a.hedge_fund_rating)};margin-top:2px">${a.hedge_fund_rating.toUpperCase()}</div>
                ${a.hedge_fund_score != null ? `<div style="font-size:10px;color:var(--text2)">score ${(Number(a.hedge_fund_score) * 100).toFixed(0)}/100</div>` : ''}
            </div>` : ''}
            ${a.insider_rating ? `
            <div style="padding:8px 10px;background:var(--bg3);border-radius:6px">
                <div style="font-size:10px;color:var(--text2)">Insider Sentiment</div>
                <div style="font-size:13px;font-weight:700;color:${ratingColor(a.insider_rating)};margin-top:2px">${a.insider_rating.toUpperCase()}</div>
                ${a.insider_score != null ? `<div style="font-size:10px;color:var(--text2)">score ${(Number(a.insider_score) * 100).toFixed(0)}/100</div>` : ''}
            </div>` : ''}
            ${a.blogger_rating ? `
            <div style="padding:8px 10px;background:var(--bg3);border-radius:6px">
                <div style="font-size:10px;color:var(--text2)">Blogger Sentiment</div>
                <div style="font-size:13px;font-weight:700;color:${ratingColor(a.blogger_rating)};margin-top:2px">${a.blogger_rating.toUpperCase()}</div>
                ${(a.blogger_bullish_count != null && a.blogger_bearish_count != null) ? `<div style="font-size:10px;color:var(--text2)">${a.blogger_bullish_count} bull · ${a.blogger_bearish_count} bear</div>` : ''}
            </div>` : ''}
            ${a.news_sentiment != null ? `
            <div style="padding:8px 10px;background:var(--bg3);border-radius:6px">
                <div style="font-size:10px;color:var(--text2)">News Sentiment</div>
                <div style="font-size:13px;font-weight:700;color:${Number(a.news_sentiment) >= 0.6 ? '#10b981' : Number(a.news_sentiment) <= 0.4 ? '#ef4444' : '#f59e0b'};margin-top:2px">${(Number(a.news_sentiment) * 100).toFixed(0)}/100</div>
                <div style="font-size:10px;color:var(--text2)">${Number(a.news_sentiment) >= 0.6 ? 'Positive' : Number(a.news_sentiment) <= 0.4 ? 'Negative' : 'Neutral'}</div>
            </div>` : ''}
            ${a.next_earnings_date ? `
            <div style="padding:8px 10px;background:var(--bg3);border-radius:6px">
                <div style="font-size:10px;color:var(--text2)">Next Earnings</div>
                <div style="font-size:13px;font-weight:700;color:var(--text);margin-top:2px">${a.next_earnings_date}</div>
                ${a.last_earnings_date ? `<div style="font-size:10px;color:var(--text2)">last ${a.last_earnings_date}</div>` : ''}
            </div>` : ''}
        </div>
    </div>`;
}

// ── Main ─────────────────────────────────────────────────────────────────
(async function main() {
    const ticker = getTicker();
    if (!ticker) {
        document.getElementById('root').innerHTML = '<div class="loading"><div style="font-size:24px">⚠️</div><div>No ticker specified.<br>Try <code>?symbol=NVDA</code></div></div>';
        return;
    }
    try {
        const d = await fetchAll(ticker);
        if (!d.snaps.length && !d.live) {
            document.getElementById('root').innerHTML = `<div class="loading"><div style="font-size:24px">❌</div><div>No data found for <b>${ticker}</b>.</div></div>`;
            return;
        }
        await render(ticker, d);
    } catch (e) {
        console.error(e);
        document.getElementById('root').innerHTML = `<div class="loading"><div style="font-size:24px">❌</div><div>Error loading deep dive.<br><code>${e.message}</code></div></div>`;
    }
})();
</script>

<!-- ── Floating Stock Search → Deep Dive (shared with index.html) ─── -->
<div id="stockSearchBtn" onclick="openStockSearch()" title="Search stocks (Ctrl+K)"
    style="position:fixed;bottom:28px;right:28px;width:52px;height:52px;border-radius:50%;
           background:#667eea;color:white;display:flex;align-items:center;
           justify-content:center;font-size:22px;cursor:pointer;z-index:9999;
           box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:transform 0.15s">
    🔍
</div>
<div id="stockSearchOverlay" onclick="closeStockSearch()"
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000"></div>
<div id="stockSearchModal"
    style="display:none;position:fixed;top:15%;left:50%;transform:translateX(-50%);
           width:min(580px,92vw);background:var(--bg2);border:1px solid var(--border);
           border-radius:14px;z-index:10001;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:13px;color:var(--text2);font-weight:600;letter-spacing:0.5px">STOCK DEEP DIVE SEARCH</div>
        <span style="font-size:10px;color:var(--text2)">Esc · ↑↓ · Enter</span>
    </div>
    <input id="stockSearchInput" type="text" placeholder="Type ticker or company name…"
        oninput="handleStockSearch(this.value)" onkeydown="handleStockSearchKey(event)"
        style="width:100%;padding:12px 16px;border-radius:8px;border:1px solid var(--border);
               background:var(--bg);color:var(--text);font-size:15px;outline:none;box-sizing:border-box"/>
    <div id="stockSearchResults" style="margin-top:8px;max-height:360px;overflow-y:auto"></div>
</div>
<script>
let _searchData = null, _searchIdx = -1;
async function openStockSearch() {
    document.getElementById('stockSearchOverlay').style.display = 'block';
    document.getElementById('stockSearchModal').style.display = 'block';
    const inp = document.getElementById('stockSearchInput');
    inp.value = ''; document.getElementById('stockSearchResults').innerHTML = ''; inp.focus();
    if (!_searchData) {
        let rows = [], frm = 0, page = 1000;
        while (true) {
            const { data } = await sb.from('us_stock_sectors').select('ticker, company_name, sector, industry').order('ticker').range(frm, frm + page - 1);
            if (!data || !data.length) break;
            rows = rows.concat(data);
            if (data.length < page) break;
            frm += page;
        }
        _searchData = rows;
    }
}
function closeStockSearch() {
    document.getElementById('stockSearchOverlay').style.display = 'none';
    document.getElementById('stockSearchModal').style.display = 'none';
    _searchIdx = -1;
}
function handleStockSearch(q) {
    _searchIdx = -1;
    const box = document.getElementById('stockSearchResults');
    if (!q) { box.innerHTML = ''; return; }
    const ql = q.toLowerCase();
    const results = (_searchData || []).filter(s => s.ticker?.toLowerCase().includes(ql) || s.company_name?.toLowerCase().includes(ql)).slice(0, 12);
    if (!results.length) { box.innerHTML = '<div style="padding:12px;color:var(--text2);font-size:13px">No results found</div>'; return; }
    const escRe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const hl = (txt) => (txt || '').replace(new RegExp(`(${escRe})`, 'gi'), '<mark style="background:#667eea30;color:#667eea;border-radius:2px;padding:0 2px">$1</mark>');
    box.innerHTML = results.map((s, i) => `
        <div class="search-result-item" data-ticker="${s.ticker}" data-idx="${i}"
            onclick="goToDeepDive('${s.ticker}')" onmouseenter="setSearchIdx(${i})"
            style="padding:10px 14px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;transition:background 0.1s">
            <div style="min-width:0;flex:1">
                <span style="font-weight:700;font-size:14px">${hl(s.ticker)}</span>
                <span style="color:var(--text2);font-size:12px;margin-left:8px">${hl(s.company_name || '')}</span>
            </div>
            <span style="font-size:10px;color:var(--text2);white-space:nowrap;background:var(--bg);padding:2px 8px;border-radius:10px">${s.industry || s.sector || ''}</span>
        </div>`).join('');
}
function setSearchIdx(i) {
    _searchIdx = i;
    document.querySelectorAll('.search-result-item').forEach((el, j) => { el.style.background = j === i ? 'var(--border)' : ''; });
}
function handleStockSearchKey(e) {
    const items = document.querySelectorAll('.search-result-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); setSearchIdx(Math.min(_searchIdx + 1, items.length - 1)); items[_searchIdx]?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSearchIdx(Math.max(_searchIdx - 1, 0)); items[_searchIdx]?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter') { if (_searchIdx >= 0 && items[_searchIdx]) goToDeepDive(items[_searchIdx].dataset.ticker); else if (items.length) goToDeepDive(items[0].dataset.ticker); }
    else if (e.key === 'Escape') closeStockSearch();
}
function goToDeepDive(ticker) { window.location.href = `deep_dive.html?symbol=${encodeURIComponent(ticker)}`; }
document.getElementById('stockSearchBtn').addEventListener('mouseenter', function () { this.style.transform = 'scale(1.1)'; });
document.getElementById('stockSearchBtn').addEventListener('mouseleave', function () { this.style.transform = 'scale(1)'; });
document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        if (document.getElementById('stockSearchModal').style.display === 'block') closeStockSearch();
        else openStockSearch();
    }
});
</script>

</body>
</html>
