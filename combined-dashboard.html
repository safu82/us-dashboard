    async function loadCashFlows(client, portfolio) {
        try {
            let allData = [];

            const batchSize = 1000;

            while (true) {
                let query = client
                    .from('cash_flows')
                    .select('*')
                    .order('date', { ascending: true })
                    .range(start, start + batchSize - 1);
                if (portfolio) query = query.eq('portfolio', portfolio);
                const { data, error } = await query;

                if (error) throw error;
                if (!data || data.length === 0) break;
                
                allData = allData.concat(data);
                if (data.length < batchSize) break;
                
                start += batchSize;
            }
            
            const cashFlows = allData.map(cf => ({
                date: cf.date,
                type: cf.description,
                amount: Math.abs(cf.amount)

    // ============ CALCULATION FUNCTIONS ============
    function calculateYTDGains(snapshots, cashFlows, transactions, year, currentValue = null) {
        const yearStart = `${year}-01-01`;
        const yearEnd = `${year}-12-31`;
        const currentYear = new Date().getFullYear();
        
        // Get start value (ALWAYS use previous year's end, never current year's Jan 1)
        const startValue = snapshots[`${year - 1}-12-31`] || 0;
        
        // Get end value (use current value for current year, snapshot for past years)
        const endValue = year < currentYear 
            ? (snapshots[yearEnd] || 0) 
            : (currentValue || 0);
        
        // Get cash flows for the year
        const yearCashFlows = cashFlows.filter(cf => cf.date >= yearStart && cf.date <= yearEnd);
        const withdrawals = yearCashFlows
            .filter(cf => cf.type === 'Withdrawl' || cf.type === 'Withdrawal')
            .reduce((sum, cf) => sum + cf.amount, 0);
        const deposits = yearCashFlows
            .filter(cf => cf.type === 'Deposit')
            .reduce((sum, cf) => sum + cf.amount, 0);
        
        // Get transactions for the year (BUY = deposit, SELL = withdrawal)
        // Only include Oct 2025 onwards - pre-Oct 2025 already covered by cash_flows
        const yearTransactions = transactions.filter(t => t.date >= yearStart && t.date <= yearEnd && t.date >= '2025-10-01');
        const soldValue = yearTransactions
            .filter(t => t.type === 'SELL')
            .reduce((sum, t) => sum + (t.quantity * t.price), 0);
        const purchasedValue = yearTransactions
            .filter(t => t.type === 'BUY')
            .reduce((sum, t) => sum + (t.quantity * t.price), 0);
        
        // Calculate gains: End Value + Withdrawals + Sold - Deposits - Purchased - Start Value
        const gains = endValue + withdrawals + soldValue - deposits - purchasedValue - startValue;
        
        console.log(`YTD ${year} Gains Calculation:`);
        console.log(`  Start: ${startValue.toFixed(2)}, End: ${endValue.toFixed(2)}`);
        console.log(`  Withdrawals: ${withdrawals.toFixed(2)}, Deposits: ${deposits.toFixed(2)}`);
        console.log(`  Sold (from transactions): ${soldValue.toFixed(2)}, Purchased (from transactions): ${purchasedValue.toFixed(2)}`);
        console.log(`  Gains: ${gains.toFixed(2)}`);
        
        return gains;
    }

    // Helper function to find closest snapshot before or on a given date
    function getClosestSnapshot(snapshots, targetDate) {
        const dates = Object.keys(snapshots)
            .filter(d => d <= targetDate)
            .sort()
            .reverse();
        return dates.length > 0 ? snapshots[dates[0]] : 0;
    }

    function calculatePeriodGains(snapshots, cashFlows, transactions, year, month, currentValue = null) {
        const currentDate = new Date();
        const currentYear = currentDate.getFullYear();
        const currentMonth = currentDate.getMonth() + 1;
        
        const periodStart = `${year}-${String(month).padStart(2, '0')}-01`;
        const lastDayOfMonth = new Date(year, month, 0).getDate();
        const periodEnd = `${year}-${String(month).padStart(2, '0')}-${String(lastDayOfMonth).padStart(2, '0')}`;
        
        // Get start value (end of previous month)
        const prevMonth = month === 1 ? 12 : month - 1;
        const prevYear = month === 1 ? year - 1 : year;
        const lastDayOfPrevMonth = new Date(prevYear, prevMonth, 0).getDate();
        const prevMonthEnd = `${prevYear}-${String(prevMonth).padStart(2, '0')}-${String(lastDayOfPrevMonth).padStart(2, '0')}`;
        const startValue = getClosestSnapshot(snapshots, prevMonthEnd);
        
        // Get end value (use closest snapshot for past months, current value for current month)
        const endValue = (year === currentYear && month === currentMonth) 
            ? (currentValue || 0)
            : getClosestSnapshot(snapshots, periodEnd);
        
        // Get cash flows for the period
        const periodCashFlows = cashFlows.filter(cf => cf.date >= periodStart && cf.date <= periodEnd);
        const withdrawals = periodCashFlows
            .filter(cf => cf.type === 'Withdrawl' || cf.type === 'Withdrawal')
            .reduce((sum, cf) => sum + cf.amount, 0);
        const deposits = periodCashFlows
            .filter(cf => cf.type === 'Deposit')
            .reduce((sum, cf) => sum + cf.amount, 0);
        
        // Get transactions for the period
        // Only include Oct 2025 onwards - pre-Oct 2025 already covered by cash_flows
        const periodTransactions = transactions.filter(t => t.date >= periodStart && t.date <= periodEnd && t.date >= '2025-10-01');
        const soldValue = periodTransactions
            .filter(t => t.type === 'SELL')
            .reduce((sum, t) => sum + (t.quantity * t.price), 0);
        const purchasedValue = periodTransactions
            .filter(t => t.type === 'BUY')
            .reduce((sum, t) => sum + (t.quantity * t.price), 0);
        
        // Calculate gains
        const gains = endValue + withdrawals + soldValue - deposits - purchasedValue - startValue;
        
        console.log(`Period ${year}-${month} Gains Calculation:`);
        console.log(`  Start: ${startValue.toFixed(2)}, End: ${endValue.toFixed(2)}`);
        console.log(`  Withdrawals: ${withdrawals.toFixed(2)}, Deposits: ${deposits.toFixed(2)}`);
        console.log(`  Sold (from transactions): ${soldValue.toFixed(2)}, Purchased (from transactions): ${purchasedValue.toFixed(2)}`);
        console.log(`  Gains: ${gains.toFixed(2)}`);
        
        return gains;
    }

    // Rebuilds the combined (INR) cumulative-gains curve since Jan 2023 on the union of
    // US + Indian snapshot dates, so we can show how far current gains sit below their peak.
    // Flow convention matches calculateYTDGains(): cash_flows for the whole period, plus
    // transactions only from 2025-10-01 (pre-Oct 2025 is already covered by cash_flows).
    // US values/flows are converted at the CURRENT exchange rate, same as the card itself.
    function buildGainsCurve() {
        const START = '2023-01-01';
        const TXN_START = '2025-10-01';

        // External flow events — positive = money added to the portfolio (INR)
        const flowEvents = [];
        const addFlows = (cashFlows, transactions, fx) => {
            cashFlows.forEach(cf => {
                if (cf.date < START) return;
                if (cf.type === 'Deposit') flowEvents.push({ date: cf.date, amount: cf.amount * fx });
                else if (cf.type === 'Withdrawl' || cf.type === 'Withdrawal') flowEvents.push({ date: cf.date, amount: -cf.amount * fx });
            });
            transactions.forEach(t => {
                if (t.date < TXN_START) return;
                const value = t.quantity * t.price * fx;
                if (t.type === 'BUY') flowEvents.push({ date: t.date, amount: value });
                else if (t.type === 'SELL') flowEvents.push({ date: t.date, amount: -value });
            });
        };
        addFlows(usCashFlows, usTransactions, exchangeRate);
        addFlows(indianCashFlows, indianTransactions, 1);
        flowEvents.sort((a, b) => a.date.localeCompare(b.date));

        const usDates = Object.keys(usSnapshots).sort();
        const indianDates = Object.keys(indianSnapshots).sort();
        const curveDates = [...new Set([...usDates, ...indianDates])].filter(d => d >= START).sort();
        if (curveDates.length === 0) return [];

        const baseValue = (usSnapshots['2023-01-01'] || usSnapshots['2022-12-31'] || 0) * exchangeRate
                        + (indianSnapshots['2023-01-01'] || indianSnapshots['2022-12-31'] || 0);

        // Walk snapshots + flows in date order, carrying forward the last known value on each side
        const curve = [];
        let ui = 0, ii = 0, fi = 0;
        let usValue = 0, indianValue = 0, netInflow = 0;
        curveDates.forEach(date => {
            while (ui < usDates.length && usDates[ui] <= date) { usValue = usSnapshots[usDates[ui]]; ui++; }
            while (ii < indianDates.length && indianDates[ii] <= date) { indianValue = indianSnapshots[indianDates[ii]]; ii++; }
            while (fi < flowEvents.length && flowEvents[fi].date <= date) { netInflow += flowEvents[fi].amount; fi++; }
            curve.push({ date, gains: (usValue * exchangeRate + indianValue) - baseValue - netInflow });
        });
        return curve;
    }

    function calculateXIRR(cashFlows, startValue, startDate, currentValue) {
        const flows = [];
        const dates = [];
        
        console.log(`\n=== XIRR Calculation Debug ===`);
        console.log(`Start Date: ${startDate}, Start Value: ${startValue.toFixed(2)}`);
        console.log(`Current Value: ${currentValue.toFixed(2)}`);
        console.log(`Total Cash Flows in database: ${cashFlows.length}`);
        
        // Initial investment
        flows.push(-startValue);
        dates.push(new Date(startDate));
        
        // Add cash flows ONLY from start date onwards
        const filteredCashFlows = cashFlows.filter(cf => cf.date >= startDate);
        console.log(`Filtered Cash Flows (from ${startDate} onwards): ${filteredCashFlows.length}`);
        
        let totalDeposits = 0;
        let totalWithdrawals = 0;
        filteredCashFlows.forEach(cf => {
            const amount = cf.type === 'Withdrawl' || cf.type === 'Withdrawal' 
                ? cf.amount 
                : -cf.amount;
            flows.push(amount);
            dates.push(new Date(cf.date));
            
            if (amount > 0) totalWithdrawals += amount;
            else totalDeposits += Math.abs(amount);
        });
        
        console.log(`Total Deposits (negative flows): ${totalDeposits.toFixed(2)}`);
        console.log(`Total Withdrawals (positive flows): ${totalWithdrawals.toFixed(2)}`);
        
        // Current value
        flows.push(currentValue);
        dates.push(new Date());
        
        console.log(`Total flows: ${flows.length}`);
        console.log(`First flow: ${flows[0].toFixed(2)} on ${dates[0].toISOString().split('T')[0]}`);
        console.log(`Last flow: ${flows[flows.length-1].toFixed(2)} on ${dates[dates.length-1].toISOString().split('T')[0]}`);
        
        // Newton-Raphson method
        let guess = 0.1;
        const maxIterations = 1000;
        const tolerance = 0.000001;
        
        for (let i = 0; i < maxIterations; i++) {
            let npv = 0;
            let dnpv = 0;
            
            for (let j = 0; j < flows.length; j++) {
                const daysDiff = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24);
                const yearFrac = daysDiff / 365.25;
                const factor = Math.pow(1 + guess, yearFrac);
                
                npv += flows[j] / factor;
                dnpv += -yearFrac * flows[j] / factor / (1 + guess);
            }
            
            if (Math.abs(npv) < tolerance) {
                const xirrResult = guess * 100;
                console.log(`✅ XIRR Result: ${xirrResult.toFixed(2)}%`);
                return xirrResult;
            }
            
            if (Math.abs(dnpv) < 1e-10) {
                guess = guess * 0.5;
                continue;
            }
            
            const newGuess = guess - npv / dnpv;
            const maxChange = 0.5;
            
            if (Math.abs(newGuess - guess) > maxChange) {
                guess = guess + Math.sign(newGuess - guess) * maxChange;
            } else {
                guess = newGuess;
            }
        }
        
        console.log(`❌ XIRR did not converge`);
        return null;
    }

    function calculateYTDXIRR(snapshots, cashFlows, transactions, year, currentValue) {
        const yearStartDate = `${year}-01-01`;
        const yearEndDate = `${year}-12-31`;
        const currentYear = new Date().getFullYear();
        
        const flows = [];
        const dates = [];
        
        // Get start value
        const yearStartValue = snapshots[yearStartDate] || snapshots[`${year - 1}-12-31`];
        
        if (!yearStartValue) {
            console.log(`⚠️ No start value for YTD XIRR ${year}`);
            return null;
        }
        
        flows.push(-yearStartValue);
        dates.push(new Date(yearStartDate));
        
        // Add cash flows for the year
        cashFlows.forEach(cf => {
            if (cf.date >= yearStartDate && cf.date <= yearEndDate) {
                const amount = (cf.type === 'Deposit') ? -cf.amount : (cf.type === 'Withdrawl' || cf.type === 'Withdrawal') ? cf.amount : 0;
                flows.push(amount);
                dates.push(new Date(cf.date));
            }
        });
        
        // Add transactions for the year
        // Only include Oct 2025 onwards - pre-Oct 2025 already covered by cash_flows
        const yearTransactions = transactions.filter(t => t.date >= yearStartDate && t.date <= yearEndDate && t.date >= '2025-10-01');
        yearTransactions.forEach(txn => {
            const amount = txn.quantity * txn.price;
            flows.push(txn.type === 'BUY' ? -amount : amount);
            dates.push(new Date(txn.date));
        });
        
        // Get end value
        const endValue = year < currentYear ? (snapshots[yearEndDate] || 0) : currentValue;
        if (!endValue) {
            console.log(`⚠️ No end value for YTD XIRR ${year}`);
            return null;
        }
        
        flows.push(endValue);
        dates.push(new Date(year < currentYear ? yearEndDate : Date.now()));
        
        // Newton-Raphson method
        let guess = 0.1;
        const maxIterations = 1000;
        const tolerance = 0.000001;
        
        for (let i = 0; i < maxIterations; i++) {
            let npv = 0;
            let dnpv = 0;
            
            for (let j = 0; j < flows.length; j++) {
                const daysDiff = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24);
                const yearFrac = daysDiff / 365.25;
                const factor = Math.pow(1 + guess, yearFrac);
                
                npv += flows[j] / factor;
                dnpv += -yearFrac * flows[j] / factor / (1 + guess);
            }
            
            if (Math.abs(npv) < tolerance) {
                return guess * 100;
            }
            
            if (Math.abs(dnpv) < 1e-10) {
                guess = guess * 0.5;
                continue;
            }
            
            const newGuess = guess - npv / dnpv;
            const maxChange = 0.5;
            
            if (Math.abs(newGuess - guess) > maxChange) {
                guess = guess + Math.sign(newGuess - guess) * maxChange;
            } else {
                guess = newGuess;
            }
        }
        
        return null;
    }

function formatAlertDate(dateStr) {
    const alertDate = new Date(dateStr + 'T00:00:00'); // Parse as midnight
    const today = new Date();
    today.setHours(0, 0, 0, 0); // Reset to midnight for comparison
    
    const diffTime = today - alertDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    
    if (diffDays === 0) return 'Today';
    if (diffDays === 1) return 'Yesterday';
    if (diffDays > 0 && diffDays < 7) return `${diffDays} days ago`;
    
    return alertDate.toLocaleDateString('en-IN', { 
        month: 'short', 
        day: 'numeric', 
        year: 'numeric' 
    });
}

// Dismiss alert
async function archiveAlert(alertId) {
    console.log('🔍 Archive called with ID:', alertId);
    console.log('🔍 Supabase client:', supabase);
    console.log('🔍 Supabase client type:', typeof supabase);
    try {
        const { error} = await supabase
            .from('alerts')
            .update({ status: 'ARCHIVED' })  // Changed from 'DISMISSED'
            .eq('id', alertId);
        
        if (error) throw error;
        
        await loadAlerts();
        render();
    } catch (error) {
        console.error('Error archiving alert:', error);
    }
}

// Toggle alert details
function toggleDetails(alertId) {
    const detailsDiv = document.getElementById(`details-${alertId}`);
    const toggleText = document.getElementById(`details-toggle-${alertId}`);
    
    if (detailsDiv.classList.contains('hidden')) {
        detailsDiv.classList.remove('hidden');
        toggleText.textContent = '▼ Hide Details';
    } else {
        detailsDiv.classList.add('hidden');
        toggleText.textContent = '▶ Show Details';
    }
}

    // ============ AUTO-REFRESH AT 7 AM IST ============
    function scheduleNextRefresh() {
        const now = new Date();
        const istOffset = 5.5 * 60 * 60 * 1000; // IST is UTC+5:30
        const nowIST = new Date(now.getTime() + istOffset);
        
        // Set target to 7:00 AM IST today
        let targetIST = new Date(nowIST);
        targetIST.setHours(7, 0, 0, 0);
        
        // If we've already passed 7 AM today, schedule for tomorrow
        if (nowIST >= targetIST) {
            targetIST.setDate(targetIST.getDate() + 1);
        }
        
        // Convert back to local time
        const targetLocal = new Date(targetIST.getTime() - istOffset);
        const msUntilRefresh = targetLocal - now;
        
        console.log(`⏰ Next auto-refresh scheduled for: ${targetIST.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })} IST`);
        console.log(`⏰ Time until refresh: ${Math.floor(msUntilRefresh / 1000 / 60 / 60)} hours ${Math.floor((msUntilRefresh / 1000 / 60) % 60)} minutes`);
        
        // Set timeout to refresh at 7 AM IST
        setTimeout(() => {
            console.log('🔄 Auto-refreshing dashboard at 7:00 AM IST...');
            location.reload();
        }, msUntilRefresh);
    }
