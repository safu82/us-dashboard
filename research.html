<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function() {
    var PASS_KEY = 'dashboard_auth_v2';
    var CORRECT  = 'khimani2026';
    if (localStorage.getItem(PASS_KEY) === CORRECT) return;
    document.addEventListener('DOMContentLoaded', function() {
        document.body.style.display = 'none';
        var gate = document.createElement('div');
        gate.style.cssText = 'position:fixed;inset:0;background:#0d1117;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
        gate.innerHTML = '<div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:40px 48px;width:320px;text-align:center">'
            + '<div style="font-size:28px;margin-bottom:8px">🧭</div>'
            + '<div style="font-size:20px;font-weight:700;color:#e6edf3">Sector Research</div>'
            + '<div style="font-size:13px;color:#8b949e;margin:6px 0 28px">Enter password to continue</div>'
            + '<input id="pw-input" type="password" placeholder="Password" style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;outline:none;margin-bottom:12px">'
            + '<button id="pw-btn" style="width:100%;padding:10px;border-radius:8px;border:none;background:#238636;color:white;font-weight:600;cursor:pointer">Unlock</button>'
            + '<div id="pw-err" style="display:none;margin-top:12px;font-size:13px;color:#f85149">Incorrect password</div>'
            + '</div>';
        document.body.parentNode.insertBefore(gate, document.body);
        function attempt() {
            var v = document.getElementById('pw-input').value;
            if (v === CORRECT) { localStorage.setItem(PASS_KEY, CORRECT); gate.remove(); document.body.style.display = ''; }
            else { document.getElementById('pw-err').style.display = 'block'; document.getElementById('pw-input').value = ''; }
        }
        document.getElementById('pw-btn').onclick = attempt;
        document.getElementById('pw-input').onkeydown = function(e){ if(e.key==='Enter') attempt(); };
        setTimeout(function(){ document.getElementById('pw-input').focus(); }, 100);
    });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sector Research — Themes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0d1117;--bg2:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--green:#3fb950;--orange:#f0883e;--accent:#1f6feb;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}
  a{color:inherit;text-decoration:none;}
  .header{background:var(--bg2);border-bottom:1px solid var(--border);padding:20px 24px;}
  .h-title{font-size:26px;font-weight:800;letter-spacing:-0.5px;}
  .h-desc{font-size:13px;color:var(--text2);margin-top:6px;max-width:820px;line-height:1.55;}
  .page{max-width:1100px;margin:0 auto;padding:24px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .tcard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .1s;min-height:170px;}
  .tcard:hover{border-color:var(--accent);transform:translateY(-2px);}
  .tname{font-size:18px;font-weight:800;}
  .tdesc{font-size:12.5px;color:var(--text2);line-height:1.5;flex:1;}
  .tstat{font-size:12px;color:var(--text2);}
  .tstat b{color:var(--text);}
  .texp{color:var(--accent);font-weight:700;font-size:13px;margin-top:2px;}
  .foot{color:var(--text2);font-size:11px;margin-top:24px;line-height:1.6;}
</style>
</head>
<body>
<div class="header">
  <div class="h-title">🧭 Sector Research</div>
  <div class="h-desc">Pick a theme to see its whole value chain as a map — the companies in each link, how their momentum is trending, and who looks cheap or pricey versus their peers. Built for first-time investors. Educational, not advice.</div>
</div>
<div class="page">
  <div class="grid" id="grid">Loading…</div>
  <div class="foot" id="foot"></div>
</div>
<script>
const SB_URL='https://jblrurlpyplbquqibphh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpibHJ1cmxweXBsYnF1cWlicGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNDY1NzAsImV4cCI6MjA5NDkyMjU3MH0.oYZarIlHqxpZY6ZWA0KRD9HoxYyv80otXKVNkpuNLRo';
const sb = supabase.createClient(SB_URL, SB_KEY);

async function load(){
  const themes  = (await sb.from('themes').select('*').order('display_order')).data || [];
  const nodes   = (await sb.from('theme_nodes').select('theme_slug')).data || [];
  const members = (await sb.from('theme_members').select('theme_slug,is_context')).data || [];
  const nNodes={}, nMembers={};
  nodes.forEach(n=>nNodes[n.theme_slug]=(nNodes[n.theme_slug]||0)+1);
  members.forEach(m=>{ if(!m.is_context) nMembers[m.theme_slug]=(nMembers[m.theme_slug]||0)+1; });
  if(!themes.length){ document.getElementById('grid').textContent='No themes yet.'; return; }
  document.getElementById('grid').innerHTML = themes.map(t=>`
    <a class="tcard" href="theme.html?theme=${t.slug}">
      <div class="tname">${t.name}</div>
      <div class="tdesc">${t.description||''}</div>
      <div class="tstat"><b>${nNodes[t.slug]||0}</b> links · <b>${nMembers[t.slug]||0}</b> companies</div>
      <div class="texp">Explore the map →</div>
    </a>`).join('');
  document.getElementById('foot').innerHTML =
    'Each theme maps a real-world value chain to public US-listed companies from our ~1,900-stock universe. '
    + 'Valuation and momentum are relative, educational screens — not investment advice.';
}
load().catch(e=>{ document.getElementById('grid').textContent='Failed to load: '+e.message; });
</script>
</body>
</html>
