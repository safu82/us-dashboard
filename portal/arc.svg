<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Overnight Arc">
  <!-- The same arc as the @overnightarc avatar, drawn rather than rasterised so
       it stays sharp as a 16px favicon and as a 400px tile. Control points match
       brand/make_brand_images.py exactly: 0.14,0.78 -> 0.42,0.06 -> 0.88,0.30.
       Cool at the start, dawn at the end: the night the market trades through. -->
  <defs>
    <linearGradient id="arcGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4aa8"/>
      <stop offset="0.55" stop-color="#8a6ebe"/>
      <stop offset="1" stop-color="#f2a44c"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0b0e14"/>
  <path d="M14 78 Q42 6 88 30" fill="none" stroke="url(#arcGrad)"
        stroke-width="7.5" stroke-linecap="round"/>
  <circle cx="88" cy="30" r="6.5" fill="#ffe2ba"/>
  <circle cx="88" cy="30" r="2.6" fill="#ffffff"/>
</svg>
