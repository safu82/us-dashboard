                    const pat = ALERT_PATTERNS.find(p => p.slug === s.pattern);
                    const tier = s.signal_strength === 'Strong' ? { bg: '#10b981', label: 'STRONG' } : { bg: '#3b82f6', label: 'BUY' };
                    html += `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0">
                        <span><span style="font-weight:600">${s.ticker}</span> <span style="color:var(--text-secondary)">· ${pat?.emoji || ''} ${pat?.label || s.pattern}</span></span>
                        <span style="background:${tier.bg};color:white;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700">${tier.label}</span>
                    </div>`;
                });
                if (peerSignals.length > 8) html += `<div style="font-size:11px;color:var(--text-secondary);text-align:center;margin-top:4px">+ ${peerSignals.length - 8} more</div>`;
                html += `</div>`;
            }

            // ── 5. Your holdings in this peer group ─────────────────────────
            const peerHoldings = portfolio.filter(p => tickerClassifications[p.ticker]?.peer_group === peerGroup);
            if (peerHoldings.length > 0) {
                html += `<div style="font-weight:600;font-size:13px;margin-bottom:8px;color:#f59e0b">★ YOUR HOLDINGS (${peerHoldings.length})</div>`;
                html += `<div style="background:#f59e0b08;border:1px solid #f59e0b30;padding:12px;border-radius:8px;margin-bottom:24px;display:flex;flex-direction:column;gap:6px">`;
                peerHoldings.forEach(h => {
                    const cmp = prices[h.ticker]?.price || h.avgCost;
                    const value = h.quantity * cmp;
                    const cost  = h.quantity * h.avgCost;
                    const pnl   = value - cost;
                    const pnlPct = cost > 0 ? (pnl / cost * 100) : 0;
                    html += `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px">
                        <span><span style="font-weight:600">${h.ticker}</span> <span style="color:var(--text-secondary)">${h.quantity} qty · CMP $${formatNumber(cmp)}</span></span>
                        <span style="color:${pnl >= 0 ? '#10b981' : '#ef4444'};font-weight:600">${pnl >= 0 ? '+' : ''}$${formatNumber(pnl)} (${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(1)}%)</span>
                    </div>`;
                });
                html += `</div>`;
            }

            // ── 6. Stocks in this peer group, ranked by RS ──────────────────
            if (drill && drill.rows && drill.rows.length > 0) {
                const showAll = !!sectorDrawerShowAll[peerGroup];
                const visible = showAll ? drill.rows : drill.rows.slice(0, 5);
                html += `<div style="font-weight:600;font-size:13px;margin-bottom:8px;color:var(--text-secondary)">${showAll ? 'ALL STOCKS' : 'TOP 5 BY RS'} <span style="font-weight:400;color:var(--text-secondary)">· ${drill.rows.length} total</span></div>`;
                html += `<div style="background:var(--bg-secondary);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px">`;
                const myTickers = new Set(portfolio.map(p => p.ticker));
                visible.forEach(r => {
                    const held = myTickers.has(r.ticker);
                    const heldBadge = held ? ' <span style="font-size:10px;color:#f59e0b">★</span>' : '';
                    const rs = r.alkalyme_rs ? Number(r.alkalyme_rs).toFixed(1) : '—';
                    const rsColor = (r.alkalyme_rs||0) >= 65 ? '#10b981' : (r.alkalyme_rs||0) >= 50 ? '#3b82f6' : '#ef4444';
                    const d52 = r.high_52w && r.close ? ((r.close - r.high_52w) / r.high_52w * 100).toFixed(1) : null;
                    html += `<div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--border-color);align-items:center">
                        <a href="https://www.tradingview.com/chart/?symbol=${r.ticker}" target="_blank" style="font-weight:600;color:var(--text-primary);text-decoration:none">${r.ticker}${heldBadge}</a>
                        <span style="color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.name || ''}</span>
                        <span style="color:${rsColor};font-weight:600">RS ${rs}</span>
                        <span style="color:var(--text-secondary)">${d52 != null ? d52 + '%' : '—'}</span>
                    </div>`;
                });
                html += `</div>`;
                if (drill.rows.length > 5) {
                    html += `<div style="text-align:center;margin-bottom:24px">
                        <button onclick="toggleSectorDrawerShowAll()" style="padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border-color)">
                            ${showAll ? 'Show top 5 ▲' : 'Show all ' + drill.rows.length + ' stocks ▼'}
                        </button>
                    </div>`;
                }
            } else if (drill === undefined) {
                html += `<div style="background:var(--bg-secondary);padding:14px;border-radius:8px;color:var(--text-secondary);font-size:12px;margin-bottom:24px;text-align:center">Loading stocks…</div>`;
            }

            html += `</div>`;  // close padding wrapper
            el.innerHTML = html;

            // RS trend line chart
            if (rsHist.length >= 2) {
                const ctx = document.getElementById('drawerRsChart');
                if (ctx) {
                    const existing = Chart.getChart('drawerRsChart');
                    if (existing) existing.destroy();
                    const labels = rsHist.map(p => {
                        const d = new Date(p.date);
                        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    });
                    const values = rsHist.map(p => p.value);
                    new Chart(ctx, {
                        type: 'line',
                        data: { labels, datasets: [{
                            label: 'Avg RS', data: values,
                            borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.10)',
                            borderWidth: 2, fill: true, tension: 0.25, pointRadius: 0, pointHoverRadius: 4
                        }]},
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { ticks: { color: '#94a3b8', maxTicksLimit: 8 }, grid: { color: 'rgba(148,163,184,0.06)' } },
                                y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148,163,184,0.06)' } }
                            }
                        }
                    });
                }
            }
        }

        // ============ PAPER ALGO TAB ============
        const TIER_CONFIG = {
            'T1_MULTI_STRONG': { label: 'T1 Multi-Strong', color: '#7c3aed', cap: 6000, risk: '1.5%' },
            'T2_STRONG_REG':   { label: 'T2 Strong+Reg',   color: '#2563eb', cap: 5000, risk: '1.0%' },
            'T3_MULTI_REG':    { label: 'T3 Multi-Reg',    color: '#0891b2', cap: 3000, risk: '0.66%' },
            'T4_RS_ACCEL':     { label: 'T4 RS Accel',     color: '#0d9488', cap: 2000, risk: '0.5%' },
        };
        const SLEEVE_USD = 50000;

        async function loadPaperDataFromSupabase() {
            try {
                const [tradesRes, equityRes, runRes] = await Promise.all([
                    supabase.from('paper_trades').select('*').order('entry_date', { ascending: false }).limit(500),
                    supabase.from('paper_equity').select('*').order('snapshot_date', { ascending: false }).limit(180),
                    supabase.from('paper_run_log').select('*').order('run_at', { ascending: false }).limit(30),
                ]);
                if (tradesRes.error) throw tradesRes.error;
                if (equityRes.error) throw equityRes.error;
                if (runRes.error)    throw runRes.error;

                // Latest EOD close per open/pending paper-trade ticker. Used as a
                // fallback for unrealised P&L when live_prices is empty
                // (market closed or ticker not yet streaming).
                const tickers = [...new Set(
                    (tradesRes.data || []).filter(t => t.status === 'open' || t.status === 'pending').map(t => t.ticker)
                )];
                const closes = {};
                if (tickers.length) {
                    const latestSnap = await supabase.from('daily_stock_snapshots')
                        .select('snapshot_date').order('snapshot_date', { ascending: false }).limit(1);
                    const d = latestSnap.data?.[0]?.snapshot_date;
                    if (d) {
                        const { data } = await supabase.from('daily_stock_snapshots')
                            .select('ticker, close').in('ticker', tickers).eq('snapshot_date', d);
                        (data || []).forEach(r => { closes[r.ticker] = Number(r.close); });
                    }
                }

                console.log(`✅ Loaded ${tradesRes.data?.length || 0} paper_trades, ${equityRes.data?.length || 0} paper_equity, ${runRes.data?.length || 0} run_log, ${Object.keys(closes).length} ticker closes`);
                return {
                    trades: tradesRes.data || [],
                    equity: equityRes.data || [],
                    runLog: runRes.data || [],
                    closes,
                };
            } catch (e) {
                console.error('❌ Error loading paper trading data:', e);
                return { trades: [], equity: [], runLog: [], closes: {} };
            }
        }

        function setPaperTierFilter(tier) {
            paperTierFilter = tier;
            render();
            setTimeout(drawAlgoEquityChart, 80);
        }

        function tierBadge(tier) {
            const cfg = TIER_CONFIG[tier];
            if (!cfg) return tier || '—';
            return `<span style="padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:${cfg.color}18;color:${cfg.color};border:1px solid ${cfg.color}40;">${cfg.label}</span>`;
        }

        function statusBadge(s) {
            const map = {
                pending: { color: '#f59e0b', label: 'PENDING' },
                open:    { color: '#3b82f6', label: 'OPEN' },
                closed:  { color: '#94a3b8', label: 'CLOSED' },
            };
            const c = map[s] || { color: '#94a3b8', label: (s || '?').toUpperCase() };
            return `<span style="padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:${c.color}18;color:${c.color};">${c.label}</span>`;
        }

        function fmtUsd(v) {
            if (v == null || isNaN(v)) return '—';
            const n = Number(v);
            const sign = n < 0 ? '-' : '';
            const abs = Math.abs(n);
            if (abs >= 1000) return sign + '$' + abs.toLocaleString('en-US', { maximumFractionDigits: 0 });
            return sign + '$' + abs.toFixed(2);
        }

        function renderAlgoTab() {
            if (paperEquity.length === 0 && paperTrades.length === 0) {
                return `<div class="card p-8 text-center">
                    <div class="text-6xl mb-4">🤖</div>
                    <h3 class="text-xl font-semibold mb-2">Algo (Paper Trading)</h3>
                    <p style="color: var(--text-secondary);max-width:540px;margin:0 auto 12px;">
                        Multi-signal conviction strategy dry-run. Sleeve: $50,000. No real orders are placed — every trade simulates into <code>paper_trades</code>.
                    </p>
                    <p style="color: var(--text-secondary);font-size:13px;">Daily scan + fill runs are scheduled — once the first run lands, this tab will populate.</p>
                </div>`;
            }

            // Latest equity snapshot
            const latest = paperEquity[0] || {};
            const prev = paperEquity[1] || {};
            const totalValue = Number(latest.total_value) || SLEEVE_USD;
            const cash = Number(latest.cash) || 0;
            const positionsValue = Number(latest.positions_value) || 0;
            const dd = Number(latest.drawdown_pct) || 0;
            const realisedToday = Number(latest.realised_today) || 0;
            const totalReturnPct = (totalValue / SLEEVE_USD - 1) * 100;
            const dayPnl = totalValue - (Number(prev.total_value) || SLEEVE_USD);

            // Tier filtering
            const tradesFiltered = paperTierFilter === 'ALL'
                ? paperTrades
                : paperTrades.filter(t => t.strategy_tier === paperTierFilter);

            const openTrades    = tradesFiltered.filter(t => t.status === 'open');
            const pendingTrades = tradesFiltered.filter(t => t.status === 'pending');
            const closedTrades  = tradesFiltered.filter(t => t.status === 'closed').slice(0, 50);

            const tierPill = (key, label, color) => {
                const active = paperTierFilter === key;
                return `<button onclick="setPaperTierFilter('${key}')" style="padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:${active ? color : 'var(--bg-card)'};color:${active ? 'white' : 'var(--text-secondary)'};border:1px solid var(--border-color);">${label}</button>`;
            };

            // ── 1. Header card with sleeve stats + tier filter ─────────────
            const header = `
            <div class="card p-4 mb-4">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
                    <div>
                        <h2 style="font-size:18px;font-weight:700;margin:0 0 4px 0;">🤖 Algo (Paper Trading)</h2>
                        <p style="color:var(--text-secondary);font-size:12px;margin:0;">Multi-signal conviction strategy. Sleeve $50k, 5 entries/day cap. Simulation only — no real orders.</p>
                    </div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        ${tierPill('ALL',              'All',              '#667eea')}
                        ${tierPill('T1_MULTI_STRONG',  'T1 Multi-Strong',  '#7c3aed')}
                        ${tierPill('T2_STRONG_REG',    'T2 Strong+Reg',    '#2563eb')}
                        ${tierPill('T3_MULTI_REG',     'T3 Multi-Reg',     '#0891b2')}
                        ${tierPill('T4_RS_ACCEL',      'T4 RS Accel',      '#0d9488')}
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                    <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center;">
                        <div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;">Sleeve Value</div>
                        <div style="font-size:22px;font-weight:700;margin-top:4px;">${fmtUsd(totalValue)}</div>
                        <div style="font-size:11px;color:${totalReturnPct >= 0 ? '#10b981' : '#ef4444'};margin-top:2px;">${totalReturnPct >= 0 ? '+' : ''}${totalReturnPct.toFixed(2)}% total</div>
                    </div>
                    <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center;">
                        <div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;">Cash</div>
                        <div style="font-size:22px;font-weight:700;margin-top:4px;">${fmtUsd(cash)}</div>
                        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${((cash / SLEEVE_USD) * 100).toFixed(0)}% of sleeve</div>
                    </div>
                    <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center;">
                        <div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;">Positions Value</div>
                        <div style="font-size:22px;font-weight:700;margin-top:4px;">${fmtUsd(positionsValue)}</div>
                        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${openTrades.length} open</div>
                    </div>
                    <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center;">
                        <div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;">Drawdown</div>
                        <div style="font-size:22px;font-weight:700;margin-top:4px;color:${dd <= -5 ? '#ef4444' : dd <= -2 ? '#f59e0b' : 'var(--text-primary)'};">${dd.toFixed(2)}%</div>
                        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">from peak</div>
                    </div>
                    <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center;">
                        <div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;">Day P&L</div>
                        <div style="font-size:22px;font-weight:700;margin-top:4px;color:${dayPnl >= 0 ? '#10b981' : '#ef4444'};">${dayPnl >= 0 ? '+' : ''}${fmtUsd(dayPnl)}</div>
                        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">Realised today ${realisedToday >= 0 ? '+' : ''}${fmtUsd(realisedToday)}</div>
                    </div>
                </div>
            </div>`;

            // ── 2. Equity curve ────────────────────────────────────────────
            const equityCard = paperEquity.length > 1 ? `
            <div class="card p-4 mb-4">
                <h3 style="font-size:15px;font-weight:700;margin:0 0 8px;">📈 Equity Curve — Sleeve vs Benchmarks</h3>
                <div style="position:relative;height:320px;"><canvas id="algoEquityChart"></canvas></div>
            </div>` : '';

            // ── 3. Position tables ─────────────────────────────────────────
            const tableHeader = `<thead><tr style="border-bottom:1px solid var(--border-color);color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">
                <th style="text-align:left;padding:8px 6px;">Ticker</th>
                <th style="text-align:left;padding:8px 6px;">Tier</th>
                <th style="text-align:left;padding:8px 6px;">Peer Group</th>
                <th style="text-align:left;padding:8px 6px;">Families</th>
                <th style="text-align:right;padding:8px 6px;">Entry</th>
                <th style="text-align:right;padding:8px 6px;">Qty</th>
                <th style="text-align:right;padding:8px 6px;">Stop</th>
                <th style="text-align:right;padding:8px 6px;">Notional</th>
                <th style="text-align:right;padding:8px 6px;">Unrealised P&L</th>
                <th style="text-align:center;padding:8px 6px;">Status</th>
            </tr></thead>`;

            // CMP source: live_prices first (intraday), latest EOD close as fallback
            // when market is closed or live_prices doesn't have the ticker yet.
            const tickerCmp = (t) => {
                const live = Number(prices[t]?.price);
                if (live) return { value: live, source: 'live' };
                const eod = Number(paperTickerCloses[t]);
                if (eod) return { value: eod, source: 'eod' };
                return null;
            };

            const renderPositionRow = (tr) => {
                const cmpObj = tickerCmp(tr.ticker);
                const cmp = cmpObj?.value || null;
                const entry = Number(tr.entry_price) || 0;
                const qty = Number(tr.current_quantity) || 0;
                const unr = (cmp && entry) ? (cmp - entry) * qty : null;
                const unrPct = (cmp && entry) ? (cmp / entry - 1) * 100 : null;
                const unrColor = unr == null ? 'var(--text-secondary)' : unr >= 0 ? '#10b981' : '#ef4444';
                const sourceTag = cmpObj?.source === 'eod' ? ' <span style="font-size:9px;color:var(--text-secondary);font-weight:400;">EOD</span>' : '';
                const families = (tr.signal_families || []).join(' · ');
                return `<tr style="border-bottom:1px solid var(--border-color);">
                    <td style="padding:7px 6px;"><a href="https://www.tradingview.com/chart/?symbol=${tr.ticker}" target="_blank" style="font-weight:600;color:var(--text-primary);text-decoration:none;">${tr.ticker}</a></td>
                    <td style="padding:7px 6px;">${tierBadge(tr.strategy_tier)}</td>
                    <td style="padding:7px 6px;color:var(--text-secondary);font-size:12px;">${tr.sector || '—'}</td>
                    <td style="padding:7px 6px;color:var(--text-secondary);font-size:11px;">${families}</td>
                    <td style="padding:7px 6px;text-align:right;">${fmtUsd(tr.entry_price)}</td>
                    <td style="padding:7px 6px;text-align:right;color:var(--text-secondary);">${qty}</td>
                    <td style="padding:7px 6px;text-align:right;color:#ef4444;">${fmtUsd(tr.current_stop)}</td>
                    <td style="padding:7px 6px;text-align:right;">${fmtUsd(tr.entry_value)}</td>
                    <td style="padding:7px 6px;text-align:right;color:${unrColor};font-weight:600;">${unr == null ? '—' : (unr >= 0 ? '+' : '') + fmtUsd(unr) + (unrPct != null ? ` (${unrPct >= 0 ? '+' : ''}${unrPct.toFixed(1)}%)` : '') + sourceTag}</td>
                    <td style="padding:7px 6px;text-align:center;">${statusBadge(tr.status)}</td>
                </tr>`;
            };

            const openCard = `
            <div class="card p-4 mb-4">
                <h3 style="font-size:15px;font-weight:700;margin:0 0 12px;">🟢 Open Positions (${openTrades.length})</h3>
                ${openTrades.length === 0 ? `<div style="color:var(--text-secondary);font-size:13px;text-align:center;padding:20px;">No open positions${paperTierFilter !== 'ALL' ? ' in ' + (TIER_CONFIG[paperTierFilter]?.label || paperTierFilter) : ''}</div>` : `
                <div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
                    ${tableHeader}
                    <tbody>${openTrades.map(renderPositionRow).join('')}</tbody>
                </table></div>`}
            </div>`;

            const pendingCard = pendingTrades.length > 0 ? `
            <div class="card p-4 mb-4">
                <h3 style="font-size:15px;font-weight:700;margin:0 0 12px;">⏳ Pending Fills (${pendingTrades.length})</h3>
                <div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;">Approved at D0 close; fill at D1 open + 15 bps slippage.</div>
                <div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
                    ${tableHeader}
                    <tbody>${pendingTrades.map(renderPositionRow).join('')}</tbody>
                </table></div>
            </div>` : '';

            // ── 4. Closed trades ───────────────────────────────────────────
            const closedRow = (tr) => {
                const pnl = Number(tr.total_pnl) || 0;
                const pnlPct = Number(tr.total_pnl_pct);
                const r = Number(tr.r_multiple);
                const pnlColor = pnl >= 0 ? '#10b981' : '#ef4444';
                const rColor = (isNaN(r) || r == null) ? 'var(--text-secondary)' : r >= 1 ? '#10b981' : r <= -1 ? '#ef4444' : '#f59e0b';
                return `<tr style="border-bottom:1px solid var(--border-color);">
                    <td style="padding:6px;font-weight:600;">${tr.ticker}</td>
                    <td style="padding:6px;">${tierBadge(tr.strategy_tier)}</td>
                    <td style="padding:6px;color:var(--text-secondary);font-size:11px;">${tr.entry_date || '—'} → ${tr.exit_date || '—'}</td>
                    <td style="padding:6px;color:var(--text-secondary);font-size:11px;">${tr.exit_reason || '—'}</td>
                    <td style="padding:6px;text-align:right;">${fmtUsd(tr.entry_price)}</td>
                    <td style="padding:6px;text-align:right;">${fmtUsd(tr.exit_price)}</td>
                    <td style="padding:6px;text-align:right;color:${pnlColor};font-weight:600;">${pnl >= 0 ? '+' : ''}${fmtUsd(pnl)}</td>
                    <td style="padding:6px;text-align:right;color:${pnlColor};">${isNaN(pnlPct) ? '—' : (pnlPct >= 0 ? '+' : '') + pnlPct.toFixed(2) + '%'}</td>
                    <td style="padding:6px;text-align:right;color:${rColor};font-weight:600;">${isNaN(r) || r == null ? '—' : (r >= 0 ? '+' : '') + r.toFixed(2) + 'R'}</td>
                    <td style="padding:6px;text-align:right;color:var(--text-secondary);">${tr.holding_days != null ? tr.holding_days + 'd' : '—'}</td>
                </tr>`;
            };
            const closedCard = `
            <div class="card p-4 mb-4">
                <h3 style="font-size:15px;font-weight:700;margin:0 0 12px;">📕 Closed Trades (${closedTrades.length}${tradesFiltered.filter(t => t.status === 'closed').length > 50 ? ' of ' + tradesFiltered.filter(t => t.status === 'closed').length : ''})</h3>
                ${closedTrades.length === 0 ? `<div style="color:var(--text-secondary);font-size:13px;text-align:center;padding:20px;">No closed trades yet</div>` : `
                <div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
                    <thead><tr style="border-bottom:1px solid var(--border-color);color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">
                        <th style="text-align:left;padding:8px 6px;">Ticker</th>
                        <th style="text-align:left;padding:8px 6px;">Tier</th>
                        <th style="text-align:left;padding:8px 6px;">In → Out</th>
                        <th style="text-align:left;padding:8px 6px;">Reason</th>
                        <th style="text-align:right;padding:8px 6px;">Entry</th>
                        <th style="text-align:right;padding:8px 6px;">Exit</th>
                        <th style="text-align:right;padding:8px 6px;">P&L</th>
                        <th style="text-align:right;padding:8px 6px;">%</th>
                        <th style="text-align:right;padding:8px 6px;">R</th>
                        <th style="text-align:right;padding:8px 6px;">Held</th>
                    </tr></thead>
                    <tbody>${closedTrades.map(closedRow).join('')}</tbody>
                </table></div>`}
            </div>`;

            // ── 5. Run log ─────────────────────────────────────────────────
            const runLogCard = paperRunLog.length > 0 ? `
            <div class="card p-4 mb-4">
                <h3 style="font-size:15px;font-weight:700;margin:0 0 12px;">📋 Recent Runs</h3>
                <div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;">
                    <thead><tr style="border-bottom:1px solid var(--border-color);color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">
                        <th style="text-align:left;padding:6px;">Run</th>
                        <th style="text-align:left;padding:6px;">Phase</th>
                        <th style="text-align:right;padding:6px;">Seen</th>
                        <th style="text-align:right;padding:6px;">Passed</th>
                        <th style="text-align:right;padding:6px;">Taken</th>
                        <th style="text-align:right;padding:6px;">Exits</th>
                        <th style="text-align:right;padding:6px;">Deployed</th>
                        <th style="text-align:left;padding:6px;">Kill</th>
                    </tr></thead>
                    <tbody>
                    ${paperRunLog.slice(0, 14).map(r => {
                        const date = r.run_date || (r.run_at ? r.run_at.slice(0, 10) : '—');
                        return `<tr style="border-bottom:1px solid var(--border-color);">
                            <td style="padding:6px;color:var(--text-secondary);">${date}</td>
                            <td style="padding:6px;color:var(--text-secondary);">${r.phase || '—'}</td>
                            <td style="padding:6px;text-align:right;">${r.signals_seen ?? '—'}</td>
                            <td style="padding:6px;text-align:right;">${r.signals_passed ?? '—'}</td>
                            <td style="padding:6px;text-align:right;font-weight:600;">${r.signals_taken ?? '—'}</td>
                            <td style="padding:6px;text-align:right;">${r.exits_processed ?? '—'}</td>
                            <td style="padding:6px;text-align:right;">${r.deployed_pct != null ? r.deployed_pct.toFixed(1) + '%' : '—'}</td>
                            <td style="padding:6px;color:${r.kill_switch_active ? '#ef4444' : 'var(--text-secondary)'};">${r.kill_switch_active ? '🛑 ' + (r.kill_switch_reason || 'active') : '—'}</td>
                        </tr>`;
                    }).join('')}
                    </tbody>
                </table></div>
            </div>` : '';

            return header + equityCard + openCard + pendingCard + closedCard + runLogCard;
        }

        function drawAlgoEquityChart() {
            const canvas = document.getElementById('algoEquityChart');
            if (!canvas || paperEquity.length < 2) return;
            if (algoCharts.equity) { algoCharts.equity.destroy(); algoCharts.equity = null; }

            const rows = [...paperEquity].reverse();  // oldest -> newest
            const labels = rows.map(r => new Date(r.snapshot_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
            const sleeve = rows.map(r => Number(r.total_value));

            // Normalize benchmarks to start at sleeve_USD (visual comparison)
            const sp = rows.map(r => Number(r.bench_sp500)).filter(x => !isNaN(x));
            const qqq = rows.map(r => Number(r.bench_qqq)).filter(x => !isNaN(x));
            const spBase = sp[0] || null;
            const qqqBase = qqq[0] || null;
            const spLine = rows.map(r => spBase && r.bench_sp500 != null ? SLEEVE_USD * (r.bench_sp500 / spBase) : null);
            const qqqLine = rows.map(r => qqqBase && r.bench_qqq != null ? SLEEVE_USD * (r.bench_qqq / qqqBase) : null);

            algoCharts.equity = new Chart(canvas, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Sleeve', data: sleeve, borderColor: '#667eea', backgroundColor: '#667eea22', borderWidth: 2.5, fill: true, tension: 0.2, pointRadius: 0 },
                        { label: 'S&P 500 (norm)', data: spLine, borderColor: '#10b981', borderWidth: 1.5, borderDash: [4, 4], fill: false, tension: 0.2, pointRadius: 0 },
                        { label: 'QQQ (norm)', data: qqqLine, borderColor: '#f59e0b', borderWidth: 1.5, borderDash: [4, 4], fill: false, tension: 0.2, pointRadius: 0 },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
                        tooltip: { callbacks: {
                            label: ctx => `${ctx.dataset.label}: $${Number(ctx.parsed.y).toLocaleString('en-US', { maximumFractionDigits: 0 })}`,
                        } },
                    },
                    scales: {
                        x: { ticks: { maxTicksLimit: 8, color: '#94a3b8' }, grid: { color: 'rgba(148,163,184,0.06)' } },
                        y: { ticks: { callback: v => '$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 0 }), color: '#94a3b8' }, grid: { color: 'rgba(148,163,184,0.06)' } },
                    },
                },
            });
        }

        function renderTechnicalAlerts() {
            if (entrySignalsData.length === 0 && presignalScoresData.length === 0) {
                return `
                <div class="card p-6">
                    <h2 class="text-xl font-bold mb-2">Technical Alerts</h2>
                    <p style="color: var(--text-secondary);">No signals or pre-signals loaded. Run <code>entry_signals_scanner.py</code> + <code>score_presignals.py</code>.</p>
                </div>`;
            }
            let body = '';
            if (alertsSubTab === 'summary')         body = renderAlertsSummary();
            else if (alertsSubTab === 'by_sector')  body = renderAlertsBySector();
            else if (alertsSubTab === 'presignal')  body = renderAlertsPresignal();
            else if (ALERT_PATTERNS.find(p => p.slug === alertsSubTab))
                body = renderAlertsPattern(alertsSubTab);
            return `${renderAlertsSubNav()}${body}`;
        }

        function renderAlertsSummary() {
            // India parity: filter is GLOBAL. The 5-card values, breakdown grid,
            // and every per-pattern tab all read from this filtered set.
            const filtered = applySummaryFilter(entrySignalsData);
            const fStrong  = filtered.filter(s => s.signal_strength === 'Strong');
            const fBuy     = filtered.filter(s => s.signal_strength === 'Buy');
            const fCounts  = {};
            filtered.forEach(s => { fCounts[s.ticker] = (fCounts[s.ticker] || 0) + 1; });
            const fMultipleTickers = Object.entries(fCounts).filter(([_, c]) => c > 1).map(([t]) => t);
            const fStrongCounts = {};
            fStrong.forEach(s => { fStrongCounts[s.ticker] = (fStrongCounts[s.ticker] || 0) + 1; });
            const fMultiStrongTickers = Object.entries(fStrongCounts).filter(([_, c]) => c > 1).map(([t]) => t);

            const filterCard = (val, num, emoji, label, color) => {
                const active = summaryFilter === val;
                return `
                <div onclick="summaryFilter = summaryFilter === '${val}' ? 'all' : '${val}'; render()"
                     class="p-4 rounded-lg text-center"
                     style="background: var(--bg-secondary); border: ${active ? `2px solid ${color}` : '1px solid var(--border-color)'}; cursor: pointer; transition: all 0.2s;">
                    <div class="text-3xl font-bold mb-1" style="color: ${color};">${num}</div>
                    <div class="text-sm" style="color: var(--text-secondary);">${emoji} ${label}</div>
                </div>`;
            };

            return `
            <div class="card p-6 mb-6">
                <h2 class="text-2xl font-bold mb-6">📊 Entry Signals Summary</h2>

                <!-- 5-card top row — values reflect the filtered set (India parity) -->
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-6">
                    ${filterCard('multiple',     fMultipleTickers.length,    '🔥',   'Multiple Signals', '#667eea')}
                    ${filterCard('strong_buy',   fStrong.length,             '🟢🟢', 'Strong Buy',       '#10b981')}
                    ${filterCard('multi_strong', fMultiStrongTickers.length, '🔥🔥', 'Multi-Strong',     '#f59e0b')}
                    ${filterCard('buy',          fBuy.length,                '🟢',   'Buy',              '#3b82f6')}
                    ${filterCard('all',          filtered.length,            '',     'Total Signals',    '#667eea')}
                </div>

                ${summaryFilter !== 'all' ? `
                <div class="mb-4 p-3 rounded-lg" style="background: var(--bg-secondary); border: 1px solid #667eea;">
                    <span style="color: var(--text-secondary);">Showing: </span>
                    <span style="color: #667eea; font-weight: bold;">
                        ${summaryFilter === 'multiple'     ? '🔥 Stocks with Multiple Signals'
                          : summaryFilter === 'multi_strong' ? '🔥🔥 Multi-Strong Buy Only'
                          : summaryFilter === 'strong_buy' ? '🟢🟢 Strong Buy Only'
                          : '🟢 Buy Only'}
                    </span>
                    <button onclick="summaryFilter='all'; render()"
                            style="margin-left: 10px; padding: 4px 12px; border-radius: 4px; border: none; background: var(--border-color); color: var(--text-primary); cursor: pointer; font-size: 12px;">
                        Clear Filter
                    </button>
                </div>` : ''}

                <!-- Breakdown by Signal Type — same filtered set as 5-card row. Patterns with zero hits hide. -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${ALERT_PATTERNS.map(p => {
                        const hits = filtered.filter(s => s.pattern === p.slug);
                        if (hits.length === 0) return '';
                        const s = hits.filter(h => h.signal_strength === 'Strong').length;
                        const b = hits.filter(h => h.signal_strength === 'Buy').length;
                        return `
                        <div class="p-4 rounded-lg" style="background: var(--bg-secondary); border: 1px solid var(--border-color);">
                            <div class="text-lg font-semibold mb-2">${p.emoji} ${p.label} (${hits.length})</div>
                            <div class="text-sm mb-2" style="color: var(--text-secondary);">${p.desc}</div>
                            ${s + b > 0 ? `<div class="text-xs mb-3" style="color: var(--text-secondary);">${s ? `<span style="color:#10b981; font-weight:600;">🟢🟢 ${s} Strong</span>` : ''}${s && b ? ' · ' : ''}${b ? `<span style="color:#3b82f6; font-weight:600;">🟢 ${b} Buy</span>` : ''}</div>` : ''}
                            <button onclick="alertsSubTab='${p.slug}'; render()"
                                    style="padding: 6px 12px; border-radius: 4px; cursor: pointer; border: none; background: #667eea; color: white; font-size: 12px;">
                                View →
                            </button>
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
        }

        function renderAlertsPattern(slug) {
            const meta = ALERT_PATTERNS.find(p => p.slug === slug);
            // India parity: per-pattern tab also respects the global summaryFilter
            const filtered = applySummaryFilter(entrySignalsData);
            const all = filtered.filter(s => s.pattern === slug);
            const sorted = all.slice().sort((a, b) => {
                if (a.signal_strength !== b.signal_strength) return a.signal_strength === 'Strong' ? -1 : 1;
                return (a.rs_rank ?? 9999) - (b.rs_rank ?? 9999);
            });

            const activeFilterBanner = summaryFilter !== 'all' ? `
                <div class="mb-4 p-3 rounded-lg" style="background: var(--bg-secondary); border: 1px solid #667eea;">
                    <span style="color: var(--text-secondary);">Filter active: </span>
                    <span style="color: #667eea; font-weight: bold;">
                        ${summaryFilter === 'multiple'     ? '🔥 Multiple Signals'
                          : summaryFilter === 'multi_strong' ? '🔥🔥 Multi-Strong Buy'
                          : summaryFilter === 'strong_buy' ? '🟢🟢 Strong Buy'
                          : '🟢 Buy'}
                    </span>
                    <button onclick="summaryFilter='all'; render()"
                            style="margin-left: 10px; padding: 4px 12px; border-radius: 4px; border: none; background: var(--border-color); color: var(--text-primary); cursor: pointer; font-size: 12px;">
                        Clear Filter
                    </button>
                </div>` : '';

            if (sorted.length === 0) {
                return `
                ${activeFilterBanner}
                <div class="card p-8 text-center">
                    <div class="text-6xl mb-4">🔍</div>
                    <h3 class="text-xl font-semibold mb-2">No ${meta?.label || slug} signals${summaryFilter !== 'all' ? ' match the current filter' : ' today'}</h3>
                    <p style="color: var(--text-secondary);">${meta?.desc || ''}</p>
                </div>`;
            }

            return `
            ${activeFilterBanner}
            <div class="card p-6 mb-4">
                <h2 class="text-2xl font-bold mb-2">${meta?.emoji || ''} ${meta?.label || slug}</h2>
                <p class="text-sm" style="color: var(--text-secondary);">${meta?.desc || ''} · ${sorted.length} signals${summaryFilter !== 'all' ? ' matching filter' : ' today'}</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                ${sorted.map(renderSignalCard).join('')}
            </div>`;
        }

        // Single signal card — India parity. Renders ticker / price / RS / sector
        // / signal-specific details / Chart button. Skips dismiss + Deep Dive
        // (no deep_dive.html yet) + conviction badge + VIX banner.
        function renderSignalCard(signal) {
            const ticker = signal.ticker;
            const tvUrl = `https://www.tradingview.com/chart/?symbol=${ticker}`;
            const isStrong = signal.signal_strength === 'Strong';
            const tierBg = isStrong ? '#10b981' : '#3b82f6';
            const tierLabel = isStrong ? '🟢🟢 STRONG BUY' : '🟢 BUY';
            const rsRank = signal.rs_rank;
            const rsColor = rsRank == null ? '#94a3b8' : rsRank <= 50 ? '#10b981' : rsRank <= 125 ? '#3b82f6' : '#94a3b8';
            const rsBg    = rsRank == null ? '#94a3b820' : rsRank <= 50 ? '#10b98120' : rsRank <= 125 ? '#3b82f620' : '#94a3b820';
            const rsBorder= rsRank == null ? '#94a3b840' : rsRank <= 50 ? '#10b98140' : rsRank <= 125 ? '#3b82f640' : '#94a3b840';

            // Multi-Strong banner (when this stock has 2+ Strong signals)
            const strongCount = entrySignalsData.filter(s => s.ticker === ticker && s.signal_strength === 'Strong').length;
            const isMultiStrong = isStrong && strongCount > 1;
            const multiStrongBanner = isMultiStrong ? `
                <div class="mb-3 px-3 py-2 rounded" style="background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%); color: white; font-weight: bold; font-size: 13px; letter-spacing: 0.5px;">
                    🔥🔥 MULTI-STRONG BUY 🔥🔥
                </div>` : '';

            // "Also has" chips when Multiple Signals / Multi-Strong filter is active
            let otherChips = '';
            if (summaryFilter === 'multiple' || summaryFilter === 'multi_strong') {
                const others = entrySignalsData.filter(s => s.ticker === ticker && s.pattern !== signal.pattern);
                if (others.length) {
                    otherChips = `
                    <div class="mt-3 pt-3" style="border-top: 1px solid var(--border-color);">
                        <div class="text-xs mb-2" style="color: var(--text-secondary);">Also has:</div>
                        <div style="display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;">
                            ${others.map(o => {
                                const op = ALERT_PATTERNS.find(p => p.slug === o.pattern);
                                return `<span class="px-2 py-1 rounded text-xs" style="background: var(--bg-secondary); border: 1px solid var(--border-color);">${op?.emoji || ''} ${op?.label || o.pattern}</span>`;
                            }).join('')}
                        </div>
                    </div>`;
                }
            }

            const cardGlow = isMultiStrong ? 'border: 2px solid #f59e0b; box-shadow: 0 0 24px #f59e0b50;' : '';

            return `
            <div class="card p-4" style="position: relative; text-align: center; ${cardGlow}">
                ${multiStrongBanner}
                <div class="mb-3">
                    <div class="text-lg font-bold mb-1">${tvLink(ticker, ticker)}</div>
                    <div class="text-2xl font-bold" style="color: #667eea;">$${formatNumber(signal.close)}</div>
                    ${rsRank != null ? `
                    <div class="mt-2">
                        <span style="display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
                                     background: ${rsBg}; color: ${rsColor}; border: 1px solid ${rsBorder};"
                              title="Alkalyme RS rank — top ${Math.round(rsRank / 5.18)}% of universe">
                            RS #${rsRank}
                        </span>
                    </div>` : ''}
                    ${renderPeerContext(ticker, signal.sector)}
                </div>

                <div class="mb-3" style="display: inline-block;">
                    <div class="text-sm">
                        <div class="px-2 py-1 rounded mb-3" style="background: ${tierBg}; color: white; font-weight: bold; text-align: center;">
                            ${tierLabel}
                        </div>
                        ${renderSignalDetails(signal)}
                    </div>
                </div>

                ${otherChips}

                <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
                    <a href="${tvUrl}" target="_blank"
                       style="display: inline-block; padding: 8px 16px; border-radius: 4px; background: #667eea; color: white; text-decoration: none; font-size: 14px;">
                        📊 Chart
                    </a>
                </div>
            </div>`;
        }

        // Pattern-specific detail grid (India parity, US data fields).
        function renderSignalDetails(signal) {
            const m = signal.metadata || {};
            const row = (label, val) => `
                <span style="color: var(--text-secondary); text-align: right; padding-right: 4px;">${label}:</span>
                <span class="font-semibold">${val}</span>`;
            const wrap = inner => `
                <div style="display: grid; grid-template-columns: auto auto; gap: 4px 2px; align-items: center;">${inner}</div>`;
            switch (signal.pattern) {
                case 'narrow_cpr':
                    return wrap(
                        row('CPR Width', (m.cpr_width_pct ?? '—') + '%') +
                        row('TC',        '$' + formatNumber(m.tc ?? 0)) +
                        row('Volume',    (m.vol_ratio ?? '—') + 'x')
                    );
                case 'blue_zone':
                    return wrap(
                        row('Daily RSI EMA', m.rsi_d != null ? formatNumber(m.rsi_d) : '—') +
                        row('Weekly RSI EMA', m.rsi_w != null ? formatNumber(m.rsi_w) : '—') +
                        row('From 52W High', (m.pct_from_52wh ?? '—') + '%') +
                        row('Volume', (m.vol_ratio ?? '—') + 'x')
                    );
                case 'golden_cross':
                    return wrap(
                        row('Days Since Cross', m.days_since_cross ?? '—') +
                        row('Volume', (m.vol_ratio ?? '—') + 'x') +
                        row('RSI(14)', m.rsi_14 != null ? formatNumber(m.rsi_14) : '—') +
                        row('ADX(14)', m.adx_14 != null ? formatNumber(m.adx_14) : '—')
                    );
                case 'macd':
                    return wrap(
                        row('Days Since Cross', m.days_since_cross ?? '—') +
                        row('Histogram', m.macd_hist != null ? formatNumber(m.macd_hist) : '—') +
                        row('ADX(14)', m.adx_14 != null ? formatNumber(m.adx_14) : '—')
                    );
                case 'darvas':
                    return wrap(
                        row('Box Top',    '$' + formatNumber(m.box_top ?? 0)) +
                        row('Box Bottom', '$' + formatNumber(m.box_bottom ?? 0)) +
                        row('Box Depth',  (m.depth_pct ?? '—') + '%') +
                        row('Window',     (m.window ?? '—') + 'd') +
                        row('Volume',     (m.vol_ratio ?? '—') + 'x')
                    );
                case 'pullback_bounce':
                    return wrap(
                        row('EMA20',     '$' + formatNumber(m.ema20 ?? 0)) +
                        row('Day Low',   '$' + formatNumber(m.low ?? 0)) +
                        row('Volume',    (m.vol_ratio ?? '—') + 'x')
                    );
                case 'bull_flag':
                    return wrap(
                        row('Pole',        (m.pole_len ?? '—') + 'd, +' + (m.pole_gain_pct ?? '—') + '%') +
                        row('Flag',        (m.flag_len ?? '—') + 'd') +
                        row('Retrace',     (m.retrace_pct ?? '—') + '%') +
                        row('Pole Vol',    (m.pole_vol_mult ?? '—') + 'x avg')
                    );
                case 'vcp':
                    return wrap(
                        row('Contractions', m.n_contractions ?? '—') +
                        row('Latest Depth', (m.latest_depth_pct ?? '—') + '%') +
                        row('Vol Dry-up',   (m.vol_dryup_pct ?? '—') + '% of 50d')
                    );
                default:
                    return '';
            }
        }

        // ── Pre-Signal config: tier colors per rule (India parity) ─────────
        const PRE_SIGNAL_CONFIG = {
            bz_buy:          { label: '🔵 BZ Buy',         color: '#3b82f6', bg: '#3b82f620', border: '#3b82f640' },
            bz_strong:       { label: '🔵 BZ Strong',      color: '#10b981', bg: '#10b98120', border: '#10b98140' },
            golden_cross:    { label: '⚡ Golden Cross',   color: '#f59e0b', bg: '#f59e0b20', border: '#f59e0b40' },
            macd:            { label: '📊 MACD',           color: '#8b5cf6', bg: '#8b5cf620', border: '#8b5cf640' },
            pullback_bounce: { label: '🔄 Pullback',       color: '#ec4899', bg: '#ec489920', border: '#ec489940' },
            rs_acceleration: { label: '🚀 RS Accel',       color: '#06b6d4', bg: '#06b6d420', border: '#06b6d440' },
        };
        const PRE_SIGNAL_RULES = Object.keys(PRE_SIGNAL_CONFIG);

        window.setPreSignalFilter = function(val) { preSignalFilter = val; render(); };
        window.toggleBySectorExpand = function(sector) {
            bySectorExpanded[sector] = !bySectorExpanded[sector]; render();
        };
        window.setAllBySectorExpanded = function(open) {
            const sectors = new Set();
            entrySignalsData.forEach(s => s.sector && sectors.add(s.sector));
            presignalScoresData.forEach(s => s.sector && sectors.add(s.sector));
            sectors.forEach(s => { bySectorExpanded[s] = open; });
            render();
        };

        // Single pre-signal card. Tier color comes from the rule; score gauge
        // shows the 0-100 proximity score. Skips Deep Dive (no page) + Conviction.
        function renderPreSignalCard(p) {
            const cfg = PRE_SIGNAL_CONFIG[p.rule] || { label: p.rule, color: '#94a3b8', bg: '#94a3b820', border: '#94a3b840' };
            const tvUrl = `https://www.tradingview.com/chart/?symbol=${p.ticker}`;
            const score = Number(p.score) || 0;
            const gaugeColor = score >= 90 ? '#10b981' : score >= 75 ? '#f59e0b' : '#3b82f6';
            const rsRank = p.rs_rank;
            const rsColor  = rsRank == null ? '#94a3b8' : rsRank <= 50 ? '#10b981' : rsRank <= 125 ? '#3b82f6' : '#94a3b8';
            const rsBg     = rsRank == null ? '#94a3b820' : rsRank <= 50 ? '#10b98120' : rsRank <= 125 ? '#3b82f620' : '#94a3b820';

            // Per-rule condition chips, sourced from metadata.
            const m = p.metadata || {};
            const chip = (passing, label) => `<span style="font-size:11px;padding:3px 8px;border-radius:8px;background:${passing ? '#10b98118' : '#ef444418'};color:${passing ? '#10b981' : '#ef4444'};border:1px solid ${passing ? '#10b98140' : '#ef444440'};font-weight:500;">${passing ? '✓' : '✗'} ${label}</span>`;
            let chips = '';
            if (p.rule === 'bz_buy' || p.rule === 'bz_strong') {
                const tD = p.rule === 'bz_strong' ? 72 : 65;
                const tW = p.rule === 'bz_strong' ? 65 : 55;
                const c = [];
                c.push(chip((m.rsi_d || 0) >= tD, `D-RSI ${m.rsi_d != null ? Number(m.rsi_d).toFixed(1) : '—'}`));
                c.push(chip((m.rsi_w || 0) >= tW, `W-RSI ${m.rsi_w != null ? Number(m.rsi_w).toFixed(1) : '—'}`));
                if (p.rule === 'bz_strong') c.push(chip(!!m.gt_ema50, 'EMA50'));
                else                        c.push(chip(!!m.gt_ema20, 'EMA20'));
                c.push(chip((m.pct_from_52wh ?? -100) >= -10, `52W ${m.pct_from_52wh != null ? m.pct_from_52wh.toFixed(1) + '%' : '—'}`));
                if (p.rule === 'bz_strong' && m.vol_ratio != null)
                    c.push(chip(m.vol_ratio >= 1.5, `Vol ${Number(m.vol_ratio).toFixed(1)}x`));
                chips = c.join('');
            } else if (p.rule === 'golden_cross') {
                if (m.gap_pct != null) chips = `<span style="font-size:11px;padding:3px 8px;border-radius:8px;background:#f59e0b20;color:#d97706;">Gap ${m.gap_pct}% to GC</span>`;
            } else if (p.rule === 'macd') {
                if (m.hist_improving_days != null) chips = `<span style="font-size:11px;padding:3px 8px;border-radius:8px;background:#8b5cf620;color:#7c3aed;">↑ ${m.hist_improving_days}d hist</span>`;
            } else if (p.rule === 'pullback_bounce') {
                if (m.pct_above_ema20 != null) chips = `<span style="font-size:11px;padding:3px 8px;border-radius:8px;background:#ec489920;color:#ec4899;">${m.pct_above_ema20}% above EMA20</span>`;
            } else if (p.rule === 'rs_acceleration') {
                const c = [];
                if (m.rank_slope != null) {
                    const speed = Math.abs(Number(m.rank_slope));
                    const col = speed >= 8 ? '#10b981' : speed >= 5 ? '#f59e0b' : '#3b82f6';
                    c.push(`<span style="font-size:11px;padding:3px 8px;border-radius:8px;background:${col}18;color:${col};border:1px solid ${col}40;font-weight:600;" title="Rank improving ${speed.toFixed(1)} positions/day">↑ ${speed.toFixed(1)}/d</span>`);
                }
                if (m.alkalyme_rs != null) c.push(chip(Number(m.alkalyme_rs) >= 65, `RS ${Number(m.alkalyme_rs).toFixed(1)}`));
                c.push(chip(!!m.gt_ema50, 'EMA50'));
                chips = c.join('');
            }

            return `
            <div class="card p-4" style="text-align: center; position: relative;">
                <div style="margin: -16px -16px 12px -16px; padding: 6px 16px; border-radius: 12px 12px 0 0;
                            background: ${cfg.bg}; color: ${cfg.color}; font-size: 12px; font-weight: 700;
                            border-bottom: 1px solid ${cfg.border};
                            display: flex; align-items: center; justify-content: center; gap: 6px;">
                    ${cfg.label}
                </div>
                <div style="font-size: 17px; font-weight: 700; margin-bottom: 2px;">${tvLink(p.ticker, p.ticker)}</div>
                ${rsRank != null ? `
                <div style="margin: 4px 0;">
                    <span style="padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: ${rsBg}; color: ${rsColor};">
                        RS #${rsRank}
                    </span>
                </div>` : ''}
                ${renderPeerContext(p.ticker, p.sector)}
                <div style="margin: 10px 0 4px;">
                    <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px;">
                        <span>Proximity Score</span>
                        <span style="font-weight: 700; color: ${gaugeColor};">${score.toFixed(1)}</span>
                    </div>
                    <div style="height: 6px; border-radius: 3px; background: var(--border-color);">
                        <div style="height: 6px; border-radius: 3px; width: ${score}%; background: ${gaugeColor}; transition: width 0.3s;"></div>
                    </div>
                </div>
                ${chips ? `<div style="display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin: 8px 0;">${chips}</div>` : ''}
                ${p._otherRules && p._otherRules.length ? `
                <div style="margin: 6px 0; font-size: 10px; color: var(--text-secondary);">
                    ${p._otherRules.map(o => `${(PRE_SIGNAL_CONFIG[o.rule] || {}).label || o.rule}: ${Number(o.score).toFixed(0)}`).join(' · ')}
                </div>` : ''}
                ${p.close ? `<div style="font-size: 13px; color: var(--text-secondary); margin: 6px 0;">CMP $${formatNumber(p.close)}</div>` : ''}
                <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
                    <a href="${tvUrl}" target="_blank" style="padding: 7px 14px; border-radius: 4px; background: #667eea; color: white; text-decoration: none; font-size: 13px;">📊 Chart</a>
                </div>
            </div>`;
        }

        function renderAlertsPresignal() {
            const all = presignalScoresData;
            if (all.length === 0) {
                return `<div class="card p-6 text-center" style="color: var(--text-secondary);">
                    <div style="font-size: 32px; margin-bottom: 12px;">🔮</div>
                    <div style="font-weight: 600; margin-bottom: 6px;">No pre-signals scored today</div>
                    <div style="font-size: 13px;">Runs nightly after the entry signals scanner</div>
                </div>`;
            }

            // Multi-detection: tickers with 2+ distinct rules scoring ≥70
            const rulesByTicker = {};
            all.forEach(p => { (rulesByTicker[p.ticker] = rulesByTicker[p.ticker] || new Set()).add(p.rule); });
            const multiTickers = new Set(Object.entries(rulesByTicker).filter(([_, s]) => s.size >= 2).map(([t]) => t));

            // Per-rule counts
            const countByRule = {};
            PRE_SIGNAL_RULES.forEach(r => {
                countByRule[r] = all.filter(p => p.rule === r).length;
            });

            // Apply filter
            const filter = preSignalFilter;
            const isMultiFilter = filter === 'multi';
            const isFilterActive = filter !== 'all';

            let sorted;
            if (isMultiFilter) {
                // Group by ticker → one card per stock, displaying the top-score rule
                // and listing the other rules (with scores) inline at the bottom.
                const byTicker = {};
                all.filter(p => multiTickers.has(p.ticker)).forEach(p => {
                    (byTicker[p.ticker] = byTicker[p.ticker] || []).push(p);
                });
                sorted = Object.values(byTicker).map(rows => {
                    rows.sort((a, b) => Number(b.score) - Number(a.score));
                    const top = rows[0];
                    const others = rows.slice(1).map(r => ({ rule: r.rule, score: Number(r.score) }));
                    return { ...top, _otherRules: others };
                }).sort((a, b) => Number(b.score) - Number(a.score));
            } else {
                const displayed = isFilterActive
                    ? all.filter(p => p.rule === filter)
                    : all;
                sorted = displayed.slice().sort((a, b) => Number(b.score) - Number(a.score));
            }

            // Top strip: 🔥 Multi chip + per-rule pills
            const multiChip = multiTickers.size > 0 ? `
                <button onclick="setPreSignalFilter('${isMultiFilter ? 'all' : 'multi'}')"
                        style="padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
                               background: ${isMultiFilter ? '#ef4444' : '#ef444420'}; color: ${isMultiFilter ? 'white' : '#ef4444'};
                               border: 1px solid #ef444440;"
                        title="${isMultiFilter ? 'Click to clear filter' : 'Show only stocks with 2+ rules scoring 70+'}">
                    🔥 Multi &nbsp;${multiTickers.size}
                </button>` : '';

            const rulePills = PRE_SIGNAL_RULES
                .filter(r => countByRule[r] > 0)
                .sort((a, b) => countByRule[b] - countByRule[a])
                .map(r => {
                    const cfg = PRE_SIGNAL_CONFIG[r];
                    const active = filter === r;
                    const next = active ? 'all' : r;
                    return `<button onclick="setPreSignalFilter('${next}')"
                                    style="padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
                                           background: ${active ? cfg.color : cfg.bg};
                                           color: ${active ? 'white' : cfg.color};
                                           border: 1px solid ${cfg.border};">
                        ${cfg.label} &nbsp;${countByRule[r]}
                    </button>`;
                }).join('');

            const activeBar = isFilterActive ? (() => {
                let label, color;
                if (isMultiFilter) {
                    label = '🔥 Stocks with Multiple Pre-Signals (2+ rules ≥70)';
                    color = '#ef4444';
                } else {
                    const cfgF = PRE_SIGNAL_CONFIG[filter];
                    label = cfgF ? `${cfgF.label} only` : `${filter} only`;
                    color = cfgF ? cfgF.color : '#ef4444';
                }
                return `<div class="mb-4 p-3 rounded-lg" style="background: var(--bg-secondary); border: 1px solid ${color};">
                    <span style="color: var(--text-secondary);">Showing: </span>
                    <span style="color: ${color}; font-weight: bold;">${label}</span>
                    <button onclick="setPreSignalFilter('all')" style="margin-left: 10px; padding: 4px 12px; border-radius: 4px; border: none; background: var(--border-color); color: var(--text-primary); cursor: pointer; font-size: 12px;">Clear Filter</button>
                </div>`;
            })() : '';

            const emptyFiltered = (isFilterActive && sorted.length === 0) ? `
                <div class="card p-6 text-center" style="color: var(--text-secondary);">
                    <div style="font-size: 32px; margin-bottom: 12px;">${isMultiFilter ? '🔥' : '🔮'}</div>
                    <div style="font-weight: 600; margin-bottom: 6px;">No stocks match the current filter</div>
                    <div style="font-size: 13px;">Click "Clear Filter" to see all pre-signals</div>
                </div>` : '';

            return `
            <div class="card p-4 mb-4">
                <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
                    <div>
                        <div style="font-size: 16px; font-weight: 700;">🔮 Pre-Signal Watchlist</div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">
                            ${sorted.length}${isFilterActive ? ` of ${all.length}` : ''} entries approaching a signal (score ≥ 70)
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">${multiChip}${rulePills}</div>
                </div>
            </div>
            ${activeBar}
            ${sorted.length > 0 ? `
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;">
                ${sorted.map(renderPreSignalCard).join('')}
            </div>` : emptyFiltered}`;
        }

        function renderAlertsBySector() {
            const portfolioSectors = new Set(portfolio.map(p => stockMeta[p.ticker]?.sector || p.sector).filter(Boolean));

            // Combined entries + pre-signals, grouped by sector
            const items = [];
            entrySignalsData.forEach(s => items.push({ kind: 'entry', sector: s.sector || 'Other', data: s }));
            presignalScoresData.forEach(p => items.push({ kind: 'pre', sector: p.sector || 'Other', data: p }));

            if (items.length === 0) {
                return `<div class="card p-8 text-center">
                    <div class="text-6xl mb-4">🌐</div>
                    <h3 class="text-xl font-semibold mb-2">No signals or pre-signals today</h3>
                    <p style="color: var(--text-secondary);">Try the per-indicator tabs or wait for the next scan</p>
                </div>`;
            }

            const bySector = {};
            items.forEach(it => { (bySector[it.sector] = bySector[it.sector] || []).push(it); });

            // Sort: portfolio sectors first, then by total count desc
            const sectorEntries = Object.entries(bySector).sort((a, b) => {
                const aP = portfolioSectors.has(a[0]), bP = portfolioSectors.has(b[0]);
                if (aP && !bP) return -1;
                if (!aP && bP) return 1;
                return b[1].length - a[1].length;
            });

            const totalActive = items.filter(x => x.kind === 'entry').length;
            const totalPre    = items.filter(x => x.kind === 'pre').length;

            // Header strip
            let html = `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 10px 14px; background: var(--bg-secondary); border-radius: 8px; font-size: 13px;">
                <div style="color: var(--text-secondary);">
                    <strong style="color: var(--text-primary);">${sectorEntries.length}</strong> sector${sectorEntries.length === 1 ? '' : 's'} ·
                    <span style="color: #10b981; font-weight: 600;">${totalActive} active</span> ·
                    <span style="color: #3b82f6; font-weight: 600;">${totalPre} approaching</span>
                </div>
                <div style="display: flex; gap: 6px;">
                    <button onclick="setAllBySectorExpanded(true)"  style="padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color);">Expand all</button>
                    <button onclick="setAllBySectorExpanded(false)" style="padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color);">Collapse all</button>
                </div>
            </div>`;

            html += '<div style="display: flex; flex-direction: column; gap: 10px;">';

            sectorEntries.forEach(([sector, sigs]) => {
                const isPort   = portfolioSectors.has(sector);
                const expanded = !!bySectorExpanded[sector];
                const activeN  = sigs.filter(x => x.kind === 'entry').length;
                const preN     = sigs.filter(x => x.kind === 'pre').length;
                const safe     = sector.replace(/'/g, "\\'");

                html += `<div class="card" style="overflow: hidden;">
                    <div onclick="toggleBySectorExpand('${safe}')"
                         style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; cursor: pointer;">
                        <div style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700;">
                            <span style="font-size: 11px; color: var(--text-secondary); width: 14px; display: inline-block;">${expanded ? '▼' : '▶'}</span>
                            ${isPort ? '<span style="color: #f59e0b;">★</span>' : ''}
                            <span>${sector}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-secondary);">
                            ${activeN > 0 ? `<span style="color: #10b981; font-weight: 600;">${activeN} active</span>` : ''}
                            ${activeN > 0 && preN > 0 ? '<span>·</span>' : ''}
                            ${preN > 0 ? `<span style="color: #3b82f6; font-weight: 600;">${preN} approaching</span>` : ''}
                        </div>
                    </div>`;

                if (expanded) {
                    // Sub-group by peer_group (industry) within the sector — gives industry-level RRG context
                    const byPeer = {};
                    sigs.forEach(it => {
                        const pg = tickerClassifications[it.data.ticker]?.peer_group || sector;
                        (byPeer[pg] = byPeer[pg] || []).push(it);
                    });
                    const peerEntries = Object.entries(byPeer).sort((a, b) => {
                        const ra = peerGroupRankings[a[0]]?.composite_rank ?? 9999;
                        const rb = peerGroupRankings[b[0]]?.composite_rank ?? 9999;
                        return ra - rb;  // strongest peer group first
                    });

                    const tier = (label, color, arr, isPre) => {
                        if (arr.length === 0) return '';
                        return `<div style="margin-top: 10px;">
                            <div style="font-size: 11px; font-weight: 700; color: ${color}; letter-spacing: 0.5px; margin-bottom: 8px; padding-left: 2px;">${label} (${arr.length})</div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${arr.map(x => isPre ? renderPreSignalCard(x.data) : renderSignalCard(x.data)).join('')}
                            </div>
                        </div>`;
                    };

                    let peerHtml = '';
                    peerEntries.forEach(([peerGroup, peerSigs]) => {
                        const rank = peerGroupRankings[peerGroup];
                        const st = rank && RRG_STYLE[rank.rrg_quadrant] || null;
                        const rankN = rank?.composite_rank;
                        const isRollup = !rank || rank.peer_group_type === 'sector';
                        // Subtle header for sector-rollup buckets, RRG header for true industry peer groups.
                        const headerChip = rank && st && rank.peer_group_type === 'industry' ? `
                            <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:${st.bg};color:${st.color};border:1px solid ${st.border};">
                                ${st.emoji} ${rank.rrg_quadrant}${rankN ? ' · #' + rankN : ''}
                            </span>
                            <span style="font-size:11px;color:var(--text-secondary);">${rank.n_tickers || '?'} peers · breadth ${rank.breadth?.toFixed?.(0) ?? '?'}%</span>
                        ` : '';
                        const strongs = peerSigs.filter(x => x.kind === 'entry' && x.data.signal_strength === 'Strong')
                                                .sort((a, b) => (a.data.rs_rank ?? 9999) - (b.data.rs_rank ?? 9999));
                        const buys    = peerSigs.filter(x => x.kind === 'entry' && x.data.signal_strength === 'Buy')
                                                .sort((a, b) => (a.data.rs_rank ?? 9999) - (b.data.rs_rank ?? 9999));
                        const pres    = peerSigs.filter(x => x.kind === 'pre')
                                                .sort((a, b) => Number(b.data.score) - Number(a.data.score));

                        peerHtml += `<div style="margin-top: 18px;">
                            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding: 6px 0 8px; border-bottom: 1px dashed var(--border-color); margin-bottom: 4px;">
                                <span style="font-size: 13px; font-weight: 700; color: var(--text-primary);">${isRollup ? '• Other ' + sector : '› ' + peerGroup}</span>
                                ${headerChip}
                            </div>
                            ${tier('🟢🟢 STRONG BUY', '#10b981', strongs, false)}
                            ${tier('🟢 BUY',          '#22c55e', buys,    false)}
                            ${tier('🔮 PRE-SIGNAL',   '#94a3b8', pres,    true )}
                        </div>`;
                    });

                    html += `<div style="padding: 0 16px 16px 16px; border-top: 1px solid var(--border-color);">${peerHtml}</div>`;
                }

                html += '</div>';
            });
            html += '</div>';
            return html;
        }

        function renderPerformanceCharts() {
            if (activeTab !== 'overview' || overviewSubTab !== 'performance') return;
            const PALETTE = ['#667eea','#10b981','#f59e0b','#ef4444','#8b5cf6','#3b82f6','#ec4899','#14b8a6','#f97316','#84cc16','#06b6d4','#a855f7'];
            const fmtY = v => '$' + (Math.abs(v) >= 1e6 ? (v/1e6).toFixed(1)+'M' : Math.abs(v) >= 1e3 ? (v/1e3).toFixed(0)+'K' : v.toFixed(0));

            const draw = (id, config) => {
                const canvas = document.getElementById(id);
                if (!canvas) return;
                const existing = Chart.getChart(canvas);
                if (existing) existing.destroy();
                perfCharts[id] = new Chart(canvas, config);
            };

            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const mg = monthlyGainsForYear(selectedChartYear);
            draw('overviewMonthlyChart', {
                type: 'bar',
                data: { labels: months, datasets: [{
                    data: mg.map(d => d.gain),
                    backgroundColor: mg.map(d => d.gain == null ? '#e5e7eb' : d.gain >= 0 ? '#10b981' : '#ef4444')
                }]},
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => '$' + (c.parsed.y || 0).toLocaleString('en-US', { maximumFractionDigits: 0 }) } } },
                    scales: { y: { ticks: { callback: fmtY } } }
                }
            });

            const cumLabels = [], cumValues = [];
            let cumul = 0;
            const endYear = new Date().getFullYear();
            for (let y = 2021; y <= endYear; y++) {
                const yearMG = monthlyGainsForYear(y);
                yearMG.forEach(d => {
                    if (y === 2021 && d.month < 11) return;
                    if (d.gain == null) return;
                    cumul += d.gain;
                    cumLabels.push(`${months[d.month-1]} ${y}`);
                    cumValues.push(cumul);
                });
            }
            draw('overviewCumulativeChart', {
                type: 'line',
                data: { labels: cumLabels, datasets: [{
                    data: cumValues, borderColor: '#667eea', backgroundColor: 'rgba(102,126,234,0.1)',
                    fill: true, tension: 0.3, pointRadius: 2
                }]},
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => '$' + (c.parsed.y || 0).toLocaleString('en-US', { maximumFractionDigits: 0 }) } } },
                    scales: { y: { ticks: { callback: fmtY } } }
                }
            });

            const sec = sectorAggregation();
            const secLabels = Object.keys(sec);
            draw('overviewSectorPie', {
                type: 'pie',
