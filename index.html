    // Load portfolio holdings from Supabase
    async function loadPortfolioFromSupabase() {
        try {
            const { data, error } = await supabase
                .from('holdings')
                .select('*');

            // Convert Supabase format to dashboard format

async function loadCashFlowsFromSupabase() {

// Load the FIFO lot ledger (frozen seed) from Supabase
async function loadLotsFromSupabase() {
    try {
        const { data, error } = await supabase
            .from('holding_lots')
            .select('ticker, acquisition_date, original_quantity, cost_per_share')
            .order('acquisition_date', { ascending: true });
        if (error) throw error;
        const lots = {};
        data.forEach(r => {
            (lots[r.ticker] = lots[r.ticker] || []).push({
                date: r.acquisition_date,
                qty: Number(r.original_quantity),
                cost: Number(r.cost_per_share)
            });
        });
        console.log(`✅ Loaded lots for ${Object.keys(lots).length} tickers from Supabase`);
        return lots;
    } catch (error) {
        console.error('❌ Error loading holding_lots:', error);
        return {};
    }
}

    // Save holdings to Supabase
    async function saveHoldingsToSupabase(portfolioData) {
        try {
            // Delete existing US holdings
            const { error: deleteError } = await supabase
                .from('holdings')
                .delete()
                .not('id', 'is', null);
            
            if (deleteError) throw deleteError;
            
            // Insert updated holdings
            const holdingsToInsert = portfolioData.map(stock => ({
                name: stock.name,
                ticker: stock.ticker,
                quantity: stock.quantity,
                avg_cost: stock.avgCost,
                sector: stock.sector
            }));
            
            const { error: insertError } = await supabase
                .from('holdings')
                .insert(holdingsToInsert);
            
            if (insertError) throw insertError;
            
            console.log(`✅ Saved ${portfolioData.length} holdings to Supabase`);
            return true;
        } catch (error) {
            console.error('❌ Error saving holdings to Supabase:', error);
            return false;
        }
    }

        function getESTTime() {
            const now = new Date();
            return new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function isWeekday(date) {
            const day = date.getDay();
            return day >= 1 && day <= 5;
        }

        function checkAndTakeSnapshot() {
            const estTime = getESTTime();
            const hours = estTime.getHours();
            const minutes = estTime.getMinutes();
            const today = formatDate(estTime);
            
            if (hours === 16 && minutes === 10 && isWeekday(estTime)) {
                const snapshots = getSnapshots();
                if (!snapshots[today]) {
                    const metrics = calculateMetrics();
                    saveSnapshot(today, metrics.totalCurrentValue);
                }
            }
        }

        setInterval(checkAndTakeSnapshot, 60000);

        function getLastDayOfPreviousMonth() {
            const estTime = getESTTime();
            const firstDayOfCurrentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
            const lastDayOfPrevMonth = new Date(firstDayOfCurrentMonth - 1);
            return formatDate(lastDayOfPrevMonth);
        }

        function getPeriodStartValue() {
            const snapshots = getSnapshots();
            const lastMonthEnd = getLastDayOfPreviousMonth();
            if (snapshots[lastMonthEnd]) return snapshots[lastMonthEnd];
            for (let i = 1; i <= 5; i++) {

        // FIFO cost basis of a holding (sum of open-lot cost); falls back to
        // the blended avg_cost if a ticker has no lots.
        function fifoCostOf(stock) {
            const lots = FIFO.lotsByTicker[stock.ticker] || [];

        function getSortedPortfolio() {
            if (!sortColumn) return portfolio;
            return [...portfolio].sort((a, b) => {
                let aVal, bVal;
                const currentPriceA = prices[a.ticker]?.price || 0;
                const currentPriceB = prices[b.ticker]?.price || 0;
                switch(sortColumn) {
                    case 'name': aVal = a.name; bVal = b.name; break;
                    case 'quantity': aVal = a.quantity; bVal = b.quantity; break;
                    case 'avgCost': aVal = a.avgCost; bVal = b.avgCost; break;
                    case 'costValue': aVal = fifoCostOf(a); bVal = fifoCostOf(b); break;
                    case 'currentPrice': aVal = currentPriceA; bVal = currentPriceB; break;
                    case 'priceChange': aVal = prices[a.ticker]?.change || 0; bVal = prices[b.ticker]?.change || 0; break;
                    case 'dayChange': 
                        aVal = dayChangeAmounts[a.ticker] || ((prices[a.ticker]?.change || 0) / 100) * (a.quantity * currentPriceA);
                        bVal = dayChangeAmounts[b.ticker] || ((prices[b.ticker]?.change || 0) / 100) * (b.quantity * currentPriceB);
                        break;
                    case 'currentValue': aVal = a.quantity * currentPriceA; bVal = b.quantity * currentPriceB; break;
                    case 'unrealizedPL':
                        aVal = (a.quantity * currentPriceA) - fifoCostOf(a);
                        bVal = (b.quantity * currentPriceB) - fifoCostOf(b);
                        break;
                    case 'unrealizedPLPercent': {
                        const acA = fifoCostOf(a), acB = fifoCostOf(b);
                        aVal = acA > 0 ? ((a.quantity * currentPriceA) - acA) / acA * 100 : 0;
                        bVal = acB > 0 ? ((b.quantity * currentPriceB) - acB) / acB * 100 : 0;
                        break;
                    }
                    default: return 0;
                }
                if (aVal === undefined || aVal === null) return 1;
                if (bVal === undefined || bVal === null) return -1;
                if (typeof aVal === 'string') {
                    return sortDirection === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                }
                return sortDirection === 'asc' ? aVal - bVal : bVal - aVal;
            });
        }

       function calculateXIRR(currentPortfolioValue) {
    const cashFlows = [], dates = [];
    
    // Add historical deposits (negative = money going in)
    HISTORICAL_CASH_FLOWS.forEach(cf => {
        // Deposits are negative, Withdrawals are positive
        const amount = (cf.type === 'Deposit') ? -cf.amount : cf.amount;
        cashFlows.push(amount);
        dates.push(new Date(cf.date));
    });
    
    // Add live transactions
    transactions.forEach(txn => {
        const amount = txn.quantity * txn.price;
        cashFlows.push(txn.type === 'BUY' ? -amount : amount);
        dates.push(new Date(txn.date));
    });
    
    // Terminal value (current portfolio - this is a POSITIVE cash flow, money you'd get back)
    cashFlows.push(currentPortfolioValue);
    dates.push(new Date());
    
    console.log(`XIRR Calculation:`);
    console.log(`- Cash flows: ${cashFlows.length} total`);
    console.log(`- Date range: ${dates[0].toISOString().split('T')[0]} to ${dates[dates.length-1].toISOString().split('T')[0]}`);
    
    const totalDeposits = Math.abs(cashFlows.filter((cf, i) => cf < 0 && i < cashFlows.length - 1).reduce((sum, cf) => sum + cf, 0));
    const totalWithdrawals = cashFlows.filter((cf, i) => cf > 0 && i < cashFlows.length - 1).reduce((sum, cf) => sum + cf, 0);
    console.log(`- Total invested: $${totalDeposits.toFixed(2)}`);
    console.log(`- Total withdrawn: $${totalWithdrawals.toFixed(2)}`);
    console.log(`- Net invested: $${(totalDeposits - totalWithdrawals).toFixed(2)}`);
    console.log(`- Current value: $${currentPortfolioValue.toFixed(2)}`);
    
    // Newton-Raphson method
    let guess = 0.1; // Start with 10% guess
    const maxIterations = 1000;
    const tolerance = 0.000001;
    
    for (let i = 0; i < maxIterations; i++) {
        let npv = 0, dnpv = 0;
        
        for (let j = 0; j < cashFlows.length; j++) {
            const daysDiff = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24);
            const yearFrac = daysDiff / 365.25; // Use more accurate year fraction
            const factor = Math.pow(1 + guess, yearFrac);
            
            npv += cashFlows[j] / factor;
            dnpv += -yearFrac * cashFlows[j] / factor / (1 + guess);
        }
        
        // Check for convergence
        if (Math.abs(npv) < tolerance) {
            console.log(`✅ XIRR converged at iteration ${i}: ${(guess * 100).toFixed(2)}%`);
            return guess * 100;
        }
        
        // Prevent division by zero
        if (Math.abs(dnpv) < 1e-10) {
            console.log('⚠️ Derivative too small, adjusting guess');
            guess = guess * 0.5;
            continue;
        }
        
        // Calculate new guess with damping for stability
        const newGuess = guess - npv / dnpv;
        
        // Prevent wild swings
        const maxChange = 0.5;
        if (Math.abs(newGuess - guess) > maxChange) {
            guess = guess + Math.sign(newGuess - guess) * maxChange;
        } else {
            guess = newGuess;
        }
        
        // Prevent negative or extremely large rates
        if (guess < -0.99) guess = -0.5;
        if (guess > 10) guess = 1;
    }
    
    console.log('❌ XIRR failed to converge after ' + maxIterations + ' iterations');
    return null;
}

    // Newton-Raphson XIRR calculation
    let guess = 0.1;
    const maxIterations = 1000, tolerance = 0.000001;
    
    for (let i = 0; i < maxIterations; i++) {
        let npv = 0, dnpv = 0;

            npv += cashFlows[j] / factor;
            dnpv += -yearFrac * cashFlows[j] / factor / (1 + guess);
        }
        
        if (Math.abs(npv) < tolerance) {

        }
        
        if (Math.abs(dnpv) < 1e-10) {
            guess = guess * 0.5;
            continue;
        }
        
        const newGuess = guess - npv / dnpv;
        if (Math.abs(newGuess - guess) > 0.5) {

        } else {
            guess = newGuess;

        if (guess < -0.99) guess = -0.5;

        // ONE-TIME MIGRATION: Transfer localStorage transactions to Supabase
        // ============ FIFO LOT ENGINE ============
        // Open lots are derived, not stored: start from the frozen holding_lots
        // seed, then replay transactions dated after FIFO_SEED_DATE. Mirrors the
        // India dashboard's client-side FIFO. The inception calculateXIRR is
        // unaffected — it uses cash_flows + transactions, never these lots.
        function isLongTermLot(buyDateStr, sellDate) {
            const b = new Date(buyDateStr);
            const ltDate = new Date(b.getFullYear() + LTCG_YEARS, b.getMonth(), b.getDate());
            return sellDate >= ltDate;
        }

        function computeFIFO() {
            const lotsByTicker = {};
            const realizedByTicker = {};

            Object.entries(seedLots).forEach(([ticker, lots]) => {
                lotsByTicker[ticker] = lots.map(l => ({ date: l.date, qty: l.qty, cost: l.cost }));
            });

            const postSeed = transactions
                .filter(t => t.date > FIFO_SEED_DATE)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            postSeed.forEach(t => {
                const qty = Number(t.quantity), price = Number(t.price);
                lotsByTicker[t.ticker] = lotsByTicker[t.ticker] || [];
                if (t.type === 'BUY') {
                    lotsByTicker[t.ticker].push({ date: t.date, qty, cost: price });
                } else if (t.type === 'SELL') {
                    let remaining = qty;
                    const sellDate = new Date(t.date);
                    const queue = lotsByTicker[t.ticker];
                    while (remaining > 0 && queue.length > 0) {
                        const lot = queue[0];
                        const use = Math.min(lot.qty, remaining);
                        (realizedByTicker[t.ticker] = realizedByTicker[t.ticker] || []).push({
                            sellDate: t.date, buyDate: lot.date, qty: use,
                            cost: lot.cost, sellPrice: price,
                            gain: (price - lot.cost) * use,
                            term: isLongTermLot(lot.date, sellDate) ? 'LT' : 'ST'
                        });
                        lot.qty -= use;
                        remaining -= use;
                        if (lot.qty <= 0) queue.shift();
                    }
                }
            });

            FIFO = { lotsByTicker, realizedByTicker };
            return FIFO;
        }

        // Reusable Newton-Raphson XIRR kernel (ported from the India dashboard).
        function solveXIRR(cashFlows, dates) {
            if (cashFlows.length < 2) return null;
            const daysDiff = (dates[dates.length - 1] - dates[0]) / (1000 * 60 * 60 * 24);
            if (daysDiff < 1) return null;
            let guess = 0.1;
            for (let i = 0; i < 200; i++) {
                let npv = 0, dnpv = 0;
                for (let j = 0; j < cashFlows.length; j++) {
                    const yf = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
                    const factor = Math.pow(1 + guess, yf);
                    npv += cashFlows[j] / factor;
                    dnpv += -yf * cashFlows[j] / factor / (1 + guess);
                }
                if (Math.abs(dnpv) < 1e-10) break;
                const next = guess - npv / dnpv;
                if (Math.abs(next - guess) < 0.000001) return next * 100;
                guess = isFinite(next) ? next : 0.1;
            }
            return null;
        }

        // Per-holding XIRR — open lots only: -cost on each lot's buy date,
        // +current market value as the terminal inflow today.
        function computeHoldingsXIRR(ticker, currentValue) {
            try {
                const lots = (FIFO.lotsByTicker[ticker] || []).filter(l => l.qty > 0 && l.date);
                if (!lots.length || currentValue <= 0) return null;
                const cashFlows = [], dates = [];
                lots.forEach(l => {
                    cashFlows.push(-(l.qty * l.cost));
                    dates.push(new Date(l.date));
                });
                cashFlows.push(currentValue);
                dates.push(new Date());
                return solveXIRR(cashFlows, dates);
            } catch (e) { return null; }
        }

        // ============ CUSTOM PERIOD XIRR ============
        // Range XIRR for any start-month -> end-month (or 'current') range.
        // Ports the India custom-XIRR pattern: snapshot baseline + intervening
        // cash_flows + post-CASH_FLOWS_END_DATE transactions + terminal value.
        // Uses solveXIRR-style Newton-Raphson with multiple starting guesses.
        function monthOptionsForXIRR(selected, allowCurrent) {
            const out = [];
            if (allowCurrent) {
                out.push(`<option value="current" ${selected === 'current' ? 'selected' : ''}>Current</option>`);
            }
            const today = new Date();
            const cy = today.getFullYear(), cm = today.getMonth() + 1;
            const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            for (let y = cy; y >= 2021; y--) {
                const startM = (y === cy) ? cm : 12;
                const endM = (y === 2021) ? 11 : 1;
                for (let m = startM; m >= endM; m--) {
                    const ym = `${y}-${String(m).padStart(2, '0')}`;
                    out.push(`<option value="${ym}" ${selected === ym ? 'selected' : ''}>${M[m-1]} ${y}</option>`);
                }
            }
            return out.join('');
        }

        function calculateCustomXIRR(startYM, endYM, currentPortfolioValue) {
            const snapshots = getSnapshots();
            const startEntry = Object.entries(snapshots)
                .filter(([d]) => d.startsWith(startYM))
                .sort(([a], [b]) => b.localeCompare(a))[0];
            if (!startEntry) return { xirr: null, error: 'No snapshot for start month' };
            const startValue = startEntry[1];
            const startDate = new Date(startEntry[0]);
            const startStr = startEntry[0];

            let endValue, endDate, endStr;
            if (endYM === 'current') {
                endValue = currentPortfolioValue;
                endDate = new Date();
                endStr = new Date().toISOString().split('T')[0];
            } else {
                const endEntry = Object.entries(snapshots)
                    .filter(([d]) => d.startsWith(endYM))
                    .sort(([a], [b]) => b.localeCompare(a))[0];
                if (!endEntry) return { xirr: null, error: 'No snapshot for end month' };
                endValue = endEntry[1];
                endDate = new Date(endEntry[0]);
                endStr = endEntry[0];
            }
            if (endDate <= startDate) return { xirr: null, error: 'End must be after start' };

            const cashFlows = [-startValue];
            const dates = [startDate];

            HISTORICAL_CASH_FLOWS.forEach(cf => {
                if (cf.date > startStr && cf.date <= endStr) {
                    cashFlows.push(cf.type === 'Deposit' ? -cf.amount : cf.amount);
                    dates.push(new Date(cf.date));
                }
            });

            const txnStart = startStr > CASH_FLOWS_END_DATE ? startStr : CASH_FLOWS_END_DATE;
            transactions.filter(t => t.date > txnStart && t.date <= endStr).forEach(t => {
                cashFlows.push(t.type === 'BUY' ? -(t.quantity * t.price) : (t.quantity * t.price));
                dates.push(new Date(t.date));
            });

            cashFlows.push(endValue);
            dates.push(endDate);

            const npvFn = r => cashFlows.reduce((s, cf, j) => {
                const yf = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
                return s + cf / Math.pow(1 + r, yf);
            }, 0);
            const dnpvFn = r => cashFlows.reduce((s, cf, j) => {
                const yf = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
                return s - yf * cf / Math.pow(1 + r, yf) / (1 + r);
            }, 0);

            let xirr = null;
            for (const startGuess of [0.1, -0.1, 0.5, -0.5, 1.0, -0.9]) {
                let guess = startGuess;
                for (let i = 0; i < 200; i++) {
                    const npv = npvFn(guess);
                    const dnpv = dnpvFn(guess);
                    if (dnpv === 0 || !isFinite(dnpv)) break;
                    const ng = guess - npv / dnpv;
                    if (!isFinite(ng) || ng <= -1) break;
                    if (Math.abs(ng - guess) < 0.00001) { xirr = ng * 100; break; }
                    guess = ng;
                }
                if (xirr !== null) break;
            }

            const absoluteGain = endValue - startValue;
            const absoluteGainPct = startValue > 0 ? (absoluteGain / startValue) * 100 : 0;
            return { xirr, absoluteGain, absoluteGainPct };
        }

        // ============ EMA DATA (Stacked EMAs / Above Key EMAs cards) ============
        // Loads the latest daily_stock_snapshots row per held ticker (ema_20/50/200 + close).
        async function loadEmaDataFromSupabase() {
            try {
                const tickers = portfolio.map(s => s.ticker);
                if (!tickers.length) return {};
                const { data, error } = await supabase

                            date: r.snapshot_date
                        };
                    }
                });
                console.log(`✅ Loaded EMA data for ${Object.keys(out).length} tickers`);
                return out;
            } catch (e) {
                console.error('❌ Error loading EMA data:', e);
                return {};
            }
        }

        function calculateEmaStats(portfolio) {
            let bullStack = 0, bearStack = 0, above20 = 0, above50 = 0, above200 = 0;
            portfolio.forEach(s => {
                const e = stockEmaData[s.ticker];
                const px = prices[s.ticker]?.price || (e ? e.close : 0) || 0;
                if (!e || !e.ema_20 || !e.ema_50 || !e.ema_200 || px <= 0) return;
                if (px > e.ema_20 && e.ema_20 > e.ema_50 && e.ema_50 > e.ema_200) bullStack++;
                if (px < e.ema_20 && e.ema_20 < e.ema_50 && e.ema_50 < e.ema_200) bearStack++;
                if (px > e.ema_20) above20++;
                if (px > e.ema_50) above50++;
                if (px > e.ema_200) above200++;
            });
            return { bullStack, bearStack, above20, above50, above200, total: portfolio.length };
        }

        function getLargestHolding() {
            const totalVal = portfolio.reduce((s, p) => s + p.quantity * (prices[p.ticker]?.price || 0), 0);
            let max = { name: '-', value: 0, ticker: null, pct: 0 };
            portfolio.forEach(s => {
                const v = s.quantity * (prices[s.ticker]?.price || 0);
                if (v > max.value) {
                    max = { name: s.name, value: v, ticker: s.ticker, pct: totalVal > 0 ? (v / totalVal) * 100 : 0 };
                }
            });
            return max;
        }

        function getMostProfitable() {
            let best = { name: '-', gain: -Infinity, pct: 0, ticker: null };
            portfolio.forEach(s => {
                const cost = fifoCostOf(s);
                const cur = s.quantity * (prices[s.ticker]?.price || 0);
                const pnl = cur - cost;
                if (pnl > best.gain) best = { name: s.name, gain: pnl, pct: cost > 0 ? (pnl / cost) * 100 : 0, ticker: s.ticker };
            });
            if (best.gain === -Infinity) best = { name: '-', gain: 0, pct: 0, ticker: null };
            return best;
        }

        function getLeastProfitable() {
            let worst = { name: '-', gain: Infinity, pct: 0, ticker: null };
            portfolio.forEach(s => {
                const cost = fifoCostOf(s);
                const cur = s.quantity * (prices[s.ticker]?.price || 0);
                const pnl = cur - cost;
                if (pnl < worst.gain) worst = { name: s.name, gain: pnl, pct: cost > 0 ? (pnl / cost) * 100 : 0, ticker: s.ticker };
            });
            if (worst.gain === Infinity) worst = { name: '-', gain: 0, pct: 0, ticker: null };
            return worst;
        }

        function getWinningLosingMonths(year) {
            const snapshots = getSnapshots();
            const now = new Date();
            const currentYear = now.getFullYear();
            const maxMonth = year === currentYear ? now.getMonth() + 1 : 12;
            let wins = 0, losses = 0;
            for (let m = 1; m <= maxMonth; m++) {
                const startStr = `${year}-${String(m).padStart(2, '0')}-01`;
                const endDateObj = new Date(year, m, 0);
                const endStr = `${year}-${String(m).padStart(2, '0')}-${String(endDateObj.getDate()).padStart(2, '0')}`;
                const prevMonthEndObj = new Date(year, m - 1, 0);
                const prevMonthEnd = m === 1
                    ? `${year - 1}-12-31`
                    : `${year}-${String(m - 1).padStart(2, '0')}-${String(prevMonthEndObj.getDate()).padStart(2, '0')}`;
                const startValue = getClosestSnapshot(snapshots, prevMonthEnd);
                const endValue = getClosestSnapshot(snapshots, endStr);
                if (!startValue || !endValue) continue;
                const monthCF = HISTORICAL_CASH_FLOWS.filter(cf => cf.date >= startStr && cf.date <= endStr);
                const wd = monthCF.filter(cf => cf.type !== 'Deposit').reduce((s, cf) => s + cf.amount, 0);
                const dep = monthCF.filter(cf => cf.type === 'Deposit').reduce((s, cf) => s + cf.amount, 0);
                const monthTxn = transactions.filter(t => t.date >= startStr && t.date <= endStr);
                const sold = monthTxn.filter(t => t.type === 'SELL').reduce((s, t) => s + t.quantity * t.price, 0);
                const bought = monthTxn.filter(t => t.type === 'BUY').reduce((s, t) => s + t.quantity * t.price, 0);
                const monthGain = endValue + wd + sold - dep - bought - startValue;
                if (monthGain > 0) wins++;
                else if (monthGain < 0) losses++;
            }
            return { wins, losses, total: wins + losses };
        }

        async function migrateLocalTransactionsToSupabase() {
            try {
                console.log('🔄 Starting migration of localStorage transactions to Supabase...');
                
                // Get transactions from localStorage
                const localTransactions = JSON.parse(localStorage.getItem('us_transactions') || '[]');
                
                if (localTransactions.length === 0) {
                    console.log('⚠️ No transactions found in localStorage');
                    return;
                }
                
                console.log(`📊 Found ${localTransactions.length} transactions in localStorage`);
                
                // Get existing transactions from Supabase to avoid duplicates
                const { data: existingTxns, error: fetchError } = await supabase
                    .from('transactions')
                    .select('date, ticker, quantity, price, type');
                
                if (fetchError) throw fetchError;
                
                console.log(`📊 Found ${existingTxns.length} transactions already in Supabase`);
                
                // Filter out duplicates (match by date, ticker, quantity, price, type)
                const newTransactions = localTransactions.filter(local => {
                    return !existingTxns.some(existing => 
                        existing.date === local.date &&
                        existing.ticker === local.ticker &&
                        existing.quantity === local.quantity &&
                        existing.price === local.price &&
                        existing.type === local.type
                    );
                });
                
                console.log(`📤 ${newTransactions.length} new transactions to migrate`);
                
                if (newTransactions.length === 0) {
                    console.log('✅ All transactions already in Supabase - no migration needed');
                    return;
                }
                
                // Insert new transactions
                let successCount = 0;
                for (const txn of newTransactions) {
                    const txnData = {
                        date: txn.date,
                        type: txn.type,
                        stock: txn.stock,
                        ticker: txn.ticker,
                        quantity: txn.quantity,
                        price: txn.price,
                        sector: txn.sector || null
                    };
                    
                    const { error } = await supabase
                        .from('transactions')
                        .insert(txnData);
                    
                    if (error) {
                        console.error(`❌ Failed to migrate transaction:`, txn, error);
                    } else {
                        successCount++;
                        console.log(`✅ Migrated: ${txn.date} ${txn.type} ${txn.quantity} ${txn.ticker} @ $${txn.price}`);
                    }
                }
                
                console.log(`🎉 Migration complete! ${successCount}/${newTransactions.length} transactions migrated`);
                alert(`✅ Migration complete!\n${successCount} transactions saved to Supabase`);
                
            } catch (error) {
                console.error('❌ Migration failed:', error);
                alert('❌ Migration failed - check console for details');
            }
        }

        async function addTransaction(txn) {
            transactions.push(txn);
            localStorage.setItem('us_transactions', JSON.stringify(transactions));
            
            // Save transaction to Supabase
            await saveTransactionToSupabase(txn);
            
            const existingStock = portfolio.find(s => s.ticker === txn.ticker);
            if (txn.type === 'BUY') {
                if (existingStock) {
                    const totalCost = (existingStock.quantity * existingStock.avgCost) + (txn.quantity * txn.price);
                    const totalQty = existingStock.quantity + txn.quantity;
                    existingStock.avgCost = totalCost / totalQty;
                    existingStock.quantity = totalQty;
                } else {
                    portfolio.push({
                        name: txn.stock, ticker: txn.ticker, quantity: txn.quantity,
                        avgCost: txn.price, sector: txn.sector || 'Other'
                    });
                }
            } else if (txn.type === 'SELL') {
                if (existingStock) {
                    existingStock.quantity -= txn.quantity;
                    if (existingStock.quantity <= 0) {
                        portfolio = portfolio.filter(s => s.ticker !== txn.ticker);
                    }
                }
            }
            
            // Save updated holdings to Supabase
            await saveHoldingsToSupabase(portfolio);
            
            localStorage.setItem('us_portfolio', JSON.stringify(portfolio));
            showTransactionForm = false;
            render();
            fetchPrices();
        }

        function createChart(metrics) {
            const canvas = document.getElementById('portfolioChart');
            if (!canvas) return;
            
            if (portfolioChart) {
                portfolioChart.destroy();
            }
            
            const snapshots = getSnapshots();
            const textColor = darkMode ? '#94a3b8' : '#64748b';
            const gridColor = darkMode ? '#334155' : '#e2e8f0';
            
            if (selectedChartType === 'cumulative') {
                // Cumulative gains from Nov 2021 (portfolio inception - matches ATH card)
                const startDate = new Date('2021-11-01');
                const endDate = new Date();
                const currentMonth = endDate.getMonth() + 1;
                const currentYear = endDate.getFullYear();
                const months = [];
                const cumulativeGains = [];
                let runningTotal = 0;
                
                for (let d = new Date(startDate); d <= endDate; d.setMonth(d.getMonth() + 1)) {
                    const year = d.getFullYear();
                    const month = d.getMonth() + 1;
                    const monthStr = String(month).padStart(2, '0');
                    const monthStart = `${year}-${monthStr}-01`;
                    const monthEnd = `${year}-${monthStr}-${new Date(year, month, 0).getDate()}`;
                    
                    months.push(d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }));
                    
                    // Get month start and end values (use getClosestSnapshot to handle weekends/holidays)
                    const prevMonthEndDate = month === 1 
                        ? `${year-1}-12-31` 
                        : `${year}-${String(month-1).padStart(2, '0')}-${new Date(year, month-1, 0).getDate()}`;
                    const prevMonthEnd = getClosestSnapshot(snapshots, prevMonthEndDate);
                    
                    // For current month, use periodGains from metrics; otherwise use snapshot
                    let monthGain;
                    if (year === currentYear && month === currentMonth && selectedPeriodMonth === currentMonth) {
                        monthGain = metrics.periodGains;
                    } else {
                        const monthEndValue = getClosestSnapshot(snapshots, monthEnd);
                        
                        if (prevMonthEnd && monthEndValue) {
                            const monthCashFlows = HISTORICAL_CASH_FLOWS.filter(cf => cf.date >= monthStart && cf.date <= monthEnd);
                            const withdrawals = monthCashFlows.filter(cf => cf.type === 'Withdrawl' || cf.type === 'Withdrawal').reduce((sum, cf) => sum + cf.amount, 0);
                            const deposits = monthCashFlows.filter(cf => cf.type === 'Deposit').reduce((sum, cf) => sum + cf.amount, 0);
                            
                            const monthTransactions = transactions.filter(t => t.date >= monthStart && t.date <= monthEnd);
                            const soldValue = monthTransactions.filter(t => t.type === 'SELL').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                            const purchasedValue = monthTransactions.filter(t => t.type === 'BUY').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                            
                            monthGain = monthEndValue + withdrawals + soldValue - deposits - purchasedValue - prevMonthEnd;
                        } else {
                            monthGain = 0;
                        }
                    }
                    
                    runningTotal += monthGain;
                    cumulativeGains.push(runningTotal);
                }
                
                portfolioChart = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Cumulative Gains',
                            data: cumulativeGains,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 2,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#667eea',
                            pointHoverBackgroundColor: '#667eea',
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                backgroundColor: darkMode ? '#1e293b' : '#ffffff',
                                titleColor: textColor,
                                bodyColor: textColor,
                                borderColor: gridColor,
                                borderWidth: 1,
                                padding: 12,
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y;
                                        const sign = value >= 0 ? '+' : '';
                                        return sign + '$' + new Intl.NumberFormat('en-US').format(value);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: gridColor, display: false },
                                ticks: { 
                                    color: textColor,
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            },
                            y: {
                                grid: { color: gridColor },
                                ticks: {
                                    color: textColor,
                                    callback: function(value) {
                                        return '$' + (value / 1000).toFixed(0) + 'K';
                                    }
                                }
                            }
                        }
                    }
                });
            } else {
                // Monthly gains bar chart (existing code)
                const year = selectedChartYear;
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const monthlyGains = [];
                const currentMonth = new Date().getMonth() + 1; // 1-12
                const currentYear = new Date().getFullYear();
                
                for (let month = 1; month <= 12; month++) {
                    const monthStr = String(month).padStart(2, '0');
                    const monthStart = `${year}-${monthStr}-01`;
                    const monthEnd = `${year}-${monthStr}-${new Date(year, month, 0).getDate()}`;
                    
                    // Find most recent snapshot before period start (handles weekends/holidays)
                    const prevMonthEndDate = month === 1 
                        ? `${year-1}-12-31`
                        : `${year}-${String(month-1).padStart(2, '0')}-${new Date(year, month-1, 0).getDate()}`;
                    const prevMonthEnd = getClosestSnapshot(snapshots, prevMonthEndDate);
                    
                    // For current month in current year, use Period Gains value directly
                    if (year === currentYear && month === currentMonth && selectedPeriodMonth === currentMonth) {
                        monthlyGains.push(metrics.periodGains);
                        continue;
                    }
                    
                    const monthEndValue = getClosestSnapshot(snapshots, monthEnd);
                    
                    if (!prevMonthEnd || !monthEndValue) {
                        monthlyGains.push(null);
                        continue;
                    }
                    
                    const monthCashFlows = HISTORICAL_CASH_FLOWS.filter(cf => cf.date >= monthStart && cf.date <= monthEnd);
                    const withdrawals = monthCashFlows.filter(cf => cf.type === 'Withdrawl' || cf.type === 'Withdrawal').reduce((sum, cf) => sum + cf.amount, 0);
                    const deposits = monthCashFlows.filter(cf => cf.type === 'Deposit').reduce((sum, cf) => sum + cf.amount, 0);
                    
                    const monthTransactions = transactions.filter(t => t.date >= monthStart && t.date <= monthEnd);
                    const soldValue = monthTransactions.filter(t => t.type === 'SELL').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                    const purchasedValue = monthTransactions.filter(t => t.type === 'BUY').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                    
                    const gain = monthEndValue + withdrawals + soldValue - deposits - purchasedValue - prevMonthEnd;
                    monthlyGains.push(gain);
                }
                
                portfolioChart = new Chart(canvas, {
                    type: 'bar',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Monthly Gain/Loss',
                            data: monthlyGains,
                            backgroundColor: monthlyGains.map(val => {
                                if (val === null) return 'rgba(100, 116, 139, 0.2)';
                                return val >= 0 ? 'rgba(16, 185, 129, 0.8)' : 'rgba(239, 68, 68, 0.8)';
                            }),
                            borderColor: monthlyGains.map(val => {
                                if (val === null) return 'rgba(100, 116, 139, 0.5)';
                                return val >= 0 ? 'rgba(16, 185, 129, 1)' : 'rgba(239, 68, 68, 1)';
                            }),
                            borderWidth: 2,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                backgroundColor: darkMode ? '#1e293b' : '#ffffff',
                                titleColor: textColor,
                                bodyColor: textColor,
                                borderColor: gridColor,
                                borderWidth: 1,
                                padding: 12,
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y;
                                        if (value === null) return 'No data';
                                        const sign = value >= 0 ? '+' : '';
                                        return sign + '$' + new Intl.NumberFormat('en-US').format(value);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: gridColor, display: false },
                                ticks: { color: textColor }
                            },
                            y: {
                                grid: { color: gridColor },
                                ticks: {
                                    color: textColor,
                                    callback: function(value) {
                                        return '$' + (value / 100000).toFixed(1) + 'L';
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

        window.handleTransactionSubmit = function(e) {
            e.preventDefault();
            let txn;
            if (isNewStock) {
                txn = {
                    date: document.getElementById('date').value,
                    type: document.getElementById('type').value,
                    stock: document.getElementById('stockName').value,
                    ticker: document.getElementById('ticker').value.toUpperCase(),
                    quantity: parseFloat(document.getElementById('quantity').value),
                    price: parseFloat(document.getElementById('price').value),
                    sector: document.getElementById('sector').value || 'Other'
                };
            } else {
                const ticker = document.getElementById('stockSelect').value;
                const stock = portfolio.find(s => s.ticker === ticker);
                txn = {
                    date: document.getElementById('date').value,
                    type: document.getElementById('type').value,
                    stock: stock.name,
                    ticker: ticker,
                    quantity: parseFloat(document.getElementById('quantity').value),
                    price: parseFloat(document.getElementById('price').value)
                };
            }
            addTransaction(txn);
        };

        setInterval(() => {
            const estTime = getESTTime();
            const hour = estTime.getHours();
            const minute = estTime.getMinutes();
            const day = estTime.getDay();
            const isWeekday = day >= 1 && day <= 5;
            const isMarketHours = (hour === 9 && minute >= 30) || (hour > 9 && hour < 16) || (hour === 16 && minute === 0);
            if (isWeekday && isMarketHours) {
                fetchPrices();
            }
        }, 300000);

// Report Generator Function for US Portfolio
async function generateReport() {
    const startDate = document.getElementById('report-start-date').value;
    const endDate = document.getElementById('report-end-date').value;
    const statusDiv = document.getElementById('report-status');
    const statusText = statusDiv.querySelector('span');
    
    if (!startDate || !endDate) {
        alert('Please select both start and end dates');
        return;
    }
    
    if (new Date(startDate) > new Date(endDate)) {
        alert('Start date must be before end date');
        return;
    }
    
    // Show loading status
    statusDiv.style.display = 'block';
    statusText.textContent = '⏳ Generating report...';
    statusText.style.color = '#667eea';
    
    try {
        // Call the Python server
        const response = await fetch('http://localhost:5000/generate-report', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                portfolio: 'US',  // US Portfolio
                start_date: startDate,
                end_date: endDate
            })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to generate report');
        }
        
        // Download the PDF
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Portfolio_Report_US_${startDate}_to_${endDate}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        statusText.textContent = '✅ Report downloaded!';
        statusText.style.color = '#27ae60';
        
        // Hide status after 3 seconds
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 3000);
        
    } catch (error) {
        console.error('Report generation error:', error);
        
        // Check if server is running
        if (error.message.includes('fetch')) {
            statusText.textContent = '❌ Server not running';
            statusText.style.color = '#c0392b';
            
            // Show instructions to start server
            const instructions = `The report server is not running. To start it:

1. Open a new terminal window

2. Navigate to your Downloads folder:
   cd Downloads

3. Run this command:
   python report_server.py

4. Keep the terminal open and try again!

The server will show: "🚀 Report Server starting on http://localhost:5000"`;
            
            alert(instructions);
        } else {
            statusText.textContent = '❌ Error: ' + error.message;
            statusText.style.color = '#c0392b';
        }
        
        // Hide status after 8 seconds
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 8000);
    }
}
