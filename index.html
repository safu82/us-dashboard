    // Load portfolio holdings from Supabase
    async function loadPortfolioFromSupabase() {
        try {
            const { data, error } = await supabase
                .from('holdings')
                .select('*');
            
            if (error) throw error;
            
            // Convert Supabase format to dashboard format
            const portfolioData = data.map(stock => ({
                name: stock.name,
                ticker: stock.ticker,
                quantity: stock.quantity,
                avgCost: stock.avg_cost,
                sector: stock.sector
            }));
            
            console.log(`✅ Loaded ${portfolioData.length} holdings from Supabase`);
            return portfolioData;
        } catch (error) {
            console.error('❌ Error loading from Supabase:', error);
            return null;
        }
    }
    
    // Load transactions from Supabase
    async function loadTransactionsFromSupabase() {
        try {
            const { data, error } = await supabase
                .from('transactions')
                .select('*')
                .order('date', { ascending: true });
            
            if (error) throw error;
            
            console.log(`✅ Loaded ${data.length} transactions from Supabase`);
            return data;
        } catch (error) {
            console.error('❌ Error loading transactions from Supabase:', error);
            return null;
        }
    }

// Load cash flows from Supabase (for XIRR calculation)
async function loadCashFlowsFromSupabase() {
    try {
        const { data, error } = await supabase
            .from('cash_flows')
            .select('*')
            .order('date', { ascending: true });
        
        if (error) throw error;
        
        // Convert Supabase format to dashboard format
        const cashFlows = data.map(cf => ({
            date: cf.date,
            type: cf.description, // 'Deposit' or 'Withdrawal'
            amount: Math.abs(cf.amount) // Convert back to positive
        }));
        
        console.log(`✅ Loaded ${cashFlows.length} cash flows from Supabase`);
        return cashFlows;
    } catch (error) {
        console.error('❌ Error loading cash flows from Supabase:', error);
        return null;
    }
}
    
    // Load snapshots from Supabase
    async function loadSnapshotsFromSupabase() {
        try {
            const { data, error } = await supabase
                .from('portfolio_snapshots')
                .select('*')
                .order('snapshot_date', { ascending: true });
            
            if (error) throw error;
            
            // Convert array to object format: { 'date': value }
            const snapshotsObj = {};
            data.forEach(snap => {
                snapshotsObj[snap.snapshot_date] = snap.total_value;
            });
            
            console.log(`✅ Loaded ${data.length} snapshots from Supabase`);
            return snapshotsObj;
        } catch (error) {
            console.error('❌ Error loading snapshots from Supabase:', error);
            return null;
        }
    }

// Load the FIFO lot ledger (frozen seed) from Supabase
async function loadLotsFromSupabase() {
    try {
        const { data, error } = await supabase
            .from('holding_lots')
            .select('ticker, acquisition_date, original_quantity, cost_per_share')
            .order('acquisition_date', { ascending: true });
        if (error) throw error;
        const lots = {};
        data.forEach(r => {
            (lots[r.ticker] = lots[r.ticker] || []).push({
                date: r.acquisition_date,
                qty: Number(r.original_quantity),
                cost: Number(r.cost_per_share)
            });
        });
        console.log(`✅ Loaded lots for ${Object.keys(lots).length} tickers from Supabase`);
        return lots;
    } catch (error) {
        console.error('❌ Error loading holding_lots:', error);
        return {};
    }
}

    // Save holdings to Supabase
    async function saveHoldingsToSupabase(portfolioData) {
        try {
            // Delete existing US holdings
            const { error: deleteError } = await supabase
                .from('holdings')
                .delete()
                .not('id', 'is', null);
            
            if (deleteError) throw deleteError;
            
            // Insert updated holdings
            const holdingsToInsert = portfolioData.map(stock => ({
                name: stock.name,
                ticker: stock.ticker,
                quantity: stock.quantity,
                avg_cost: stock.avgCost,
                sector: stock.sector
            }));
            
            const { error: insertError } = await supabase
                .from('holdings')
                .insert(holdingsToInsert);
            
            if (insertError) throw insertError;
            
            console.log(`✅ Saved ${portfolioData.length} holdings to Supabase`);
            return true;
        } catch (error) {
            console.error('❌ Error saving holdings to Supabase:', error);
            return false;
        }
    }
    
    // Save transaction to Supabase
    async function saveTransactionToSupabase(transaction) {
        try {
            const txnData = {
                date: transaction.date,
                type: transaction.type,
                stock: transaction.stock,
                ticker: transaction.ticker,
                quantity: transaction.quantity,
                price: transaction.price,
                sector: transaction.sector || null
            };

            const { data, error } = await supabase
                .from('transactions')
                .insert(txnData)
                .select('id')
                .single();

            if (error) throw error;

            console.log(`✅ Saved transaction to Supabase (id=${data.id})`);
            return data.id;
        } catch (error) {
            console.error('❌ Error saving transaction to Supabase:', error);
            return null;
        }
    }

                .from('portfolio_snapshots')

                .maybeSingle();

                .from('portfolio_snapshots')
                .insert({

            return false;
        }
    }

        // FIFO cost basis of a holding (sum of open-lot cost); falls back to
        // the blended avg_cost if a ticker has no lots.
        function fifoCostOf(stock) {
            const lots = FIFO.lotsByTicker[stock.ticker] || [];
            return lots.length
                ? lots.reduce((s, l) => s + l.qty * l.cost, 0)
                : stock.quantity * stock.avgCost;

        function totalRealizedGains() {

                const currentPriceB = prices[b.ticker]?.price || 0;
                switch(sortColumn) {
                    case 'name': aVal = a.name; bVal = b.name; break;
                    case 'quantity': aVal = a.quantity; bVal = b.quantity; break;
                    case 'avgCost': aVal = a.avgCost; bVal = b.avgCost; break;
                    case 'costValue': aVal = fifoCostOf(a); bVal = fifoCostOf(b); break;
                    case 'currentPrice': aVal = currentPriceA; bVal = currentPriceB; break;
                    case 'priceChange': aVal = prices[a.ticker]?.change || 0; bVal = prices[b.ticker]?.change || 0; break;
                    case 'dayChange': 
                        aVal = dayChangeAmounts[a.ticker] || ((prices[a.ticker]?.change || 0) / 100) * (a.quantity * currentPriceA);
                        bVal = dayChangeAmounts[b.ticker] || ((prices[b.ticker]?.change || 0) / 100) * (b.quantity * currentPriceB);
                        break;
                    case 'currentValue': aVal = a.quantity * currentPriceA; bVal = b.quantity * currentPriceB; break;
                    case 'unrealizedPL':
                        aVal = (a.quantity * currentPriceA) - fifoCostOf(a);
                        bVal = (b.quantity * currentPriceB) - fifoCostOf(b);
                        break;
                    case 'unrealizedPLPercent': {
                        const acA = fifoCostOf(a), acB = fifoCostOf(b);
                        aVal = acA > 0 ? ((a.quantity * currentPriceA) - acA) / acA * 100 : 0;
                        bVal = acB > 0 ? ((b.quantity * currentPriceB) - acB) / acB * 100 : 0;
                        break;
                    }
                    default: return 0;
                }
                if (aVal === undefined || aVal === null) return 1;
                if (bVal === undefined || bVal === null) return -1;
                if (typeof aVal === 'string') {
                    return sortDirection === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);

       function calculateXIRR(currentPortfolioValue) {
    const cashFlows = [], dates = [];
    
    // Add historical deposits (negative = money going in)
    HISTORICAL_CASH_FLOWS.forEach(cf => {
        // Deposits are negative, Withdrawals are positive
        const amount = (cf.type === 'Deposit') ? -cf.amount : cf.amount;
        cashFlows.push(amount);
        dates.push(new Date(cf.date));
    });
    
    // Add live transactions
    transactions.forEach(txn => {
        const amount = txn.quantity * txn.price;
        cashFlows.push(txn.type === 'BUY' ? -amount : amount);
        dates.push(new Date(txn.date));
    });
    
    // Terminal value (current portfolio - this is a POSITIVE cash flow, money you'd get back)
    cashFlows.push(currentPortfolioValue);
    dates.push(new Date());
    
    console.log(`XIRR Calculation:`);
    console.log(`- Cash flows: ${cashFlows.length} total`);
    console.log(`- Date range: ${dates[0].toISOString().split('T')[0]} to ${dates[dates.length-1].toISOString().split('T')[0]}`);
    
    const totalDeposits = Math.abs(cashFlows.filter((cf, i) => cf < 0 && i < cashFlows.length - 1).reduce((sum, cf) => sum + cf, 0));
    const totalWithdrawals = cashFlows.filter((cf, i) => cf > 0 && i < cashFlows.length - 1).reduce((sum, cf) => sum + cf, 0);
    console.log(`- Total invested: $${totalDeposits.toFixed(2)}`);
    console.log(`- Total withdrawn: $${totalWithdrawals.toFixed(2)}`);
    console.log(`- Net invested: $${(totalDeposits - totalWithdrawals).toFixed(2)}`);
    console.log(`- Current value: $${currentPortfolioValue.toFixed(2)}`);
    
    // Newton-Raphson method
    let guess = 0.1; // Start with 10% guess
    const maxIterations = 1000;
    const tolerance = 0.000001;
    
    for (let i = 0; i < maxIterations; i++) {
        let npv = 0, dnpv = 0;
        
        for (let j = 0; j < cashFlows.length; j++) {
            const daysDiff = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24);
            const yearFrac = daysDiff / 365.25; // Use more accurate year fraction
            const factor = Math.pow(1 + guess, yearFrac);
            
            npv += cashFlows[j] / factor;
            dnpv += -yearFrac * cashFlows[j] / factor / (1 + guess);
        }
        
        // Check for convergence
        if (Math.abs(npv) < tolerance) {
            console.log(`✅ XIRR converged at iteration ${i}: ${(guess * 100).toFixed(2)}%`);
            return guess * 100;
        }
        
        // Prevent division by zero
        if (Math.abs(dnpv) < 1e-10) {
            console.log('⚠️ Derivative too small, adjusting guess');
            guess = guess * 0.5;
            continue;
        }
        
        // Calculate new guess with damping for stability
        const newGuess = guess - npv / dnpv;
        
        // Prevent wild swings
        const maxChange = 0.5;
        if (Math.abs(newGuess - guess) > maxChange) {
            guess = guess + Math.sign(newGuess - guess) * maxChange;
        } else {
            guess = newGuess;
        }
        
        // Prevent negative or extremely large rates
        if (guess < -0.99) guess = -0.5;
        if (guess > 10) guess = 1;
    }
    
    console.log('❌ XIRR failed to converge after ' + maxIterations + ' iterations');
    return null;
}

// Calculate YTD XIRR (Year-to-Date return for current year)
function calculateYTDXIRR(currentPortfolioValue, year = null) {
    const estTime = getESTTime();
    const currentYear = year || new Date().getFullYear();
    const yearStartDate = `${currentYear}-01-01`;
    const yearEndDate = `${currentYear}-12-31`;
    
    const cashFlows = [], dates = [];
    
    const snapshots = getSnapshots();
    const yearStartValue = snapshots[yearStartDate] || snapshots[`${currentYear - 1}-12-31`];
    
    if (!yearStartValue) {
        console.log(`⚠️ No start value for ${currentYear}`);
        return null;
    }
    
    // Start value (negative = investment)
    cashFlows.push(-yearStartValue);
    dates.push(new Date(yearStartDate));
    
    // Add cash flows for the year
    HISTORICAL_CASH_FLOWS.forEach(cf => {
        if (cf.date >= yearStartDate && cf.date <= yearEndDate) {
            const amount = (cf.type === 'Deposit') ? -cf.amount : (cf.type === 'Withdrawl' || cf.type === 'Withdrawal') ? cf.amount : 0;
            cashFlows.push(amount);
            dates.push(new Date(cf.date));
        }
    });
    
    // Add transactions for the year
    const yearTransactions = transactions.filter(t => t.date >= yearStartDate && t.date <= yearEndDate);
    yearTransactions.forEach(txn => {
        const amount = txn.quantity * txn.price;
        cashFlows.push(txn.type === 'BUY' ? -amount : amount);
        dates.push(new Date(txn.date));
    });
    
    // End value (positive = return)
    const endValue = year && year < new Date().getFullYear() ? snapshots[yearEndDate] : currentPortfolioValue;
    if (!endValue) {
        console.log(`⚠️ No end value for ${currentYear}`);
        return null;
    }
    
    cashFlows.push(endValue);
    dates.push(new Date(year && year < new Date().getFullYear() ? yearEndDate : Date.now()));
    
    // Newton-Raphson XIRR calculation
    let guess = 0.1;
    const maxIterations = 1000, tolerance = 0.000001;
    
    for (let i = 0; i < maxIterations; i++) {
        let npv = 0, dnpv = 0;
        
        for (let j = 0; j < cashFlows.length; j++) {
            const daysDiff = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24);
            const yearFrac = daysDiff / 365.25;
            const factor = Math.pow(1 + guess, yearFrac);
            
            npv += cashFlows[j] / factor;
            dnpv += -yearFrac * cashFlows[j] / factor / (1 + guess);
        }
        
        if (Math.abs(npv) < tolerance) {
            return guess * 100;
        }
        
        if (Math.abs(dnpv) < 1e-10) {
            guess = guess * 0.5;
            continue;
        }
        
        const newGuess = guess - npv / dnpv;
        if (Math.abs(newGuess - guess) > 0.5) {
            guess = guess + Math.sign(newGuess - guess) * 0.5;
        } else {
            guess = newGuess;
        }
        
        if (guess < -0.99) guess = -0.5;
        if (guess > 10) guess = 1;
    }
    
    return null;
}

        // ONE-TIME MIGRATION: Transfer localStorage transactions to Supabase
        // ============ FIFO LOT ENGINE ============
        // Open lots are derived, not stored: start from the frozen holding_lots
        // seed, then replay transactions dated after FIFO_SEED_DATE. Mirrors the
        // India dashboard's client-side FIFO. The inception calculateXIRR is
        // unaffected — it uses cash_flows + transactions, never these lots.
        function isLongTermLot(buyDateStr, sellDate) {
            const b = new Date(buyDateStr);
            const ltDate = new Date(b.getFullYear() + LTCG_YEARS, b.getMonth(), b.getDate());
            return sellDate >= ltDate;
        }

        function computeFIFO() {
            const lotsByTicker = {};
            const realizedByTicker = {};

            // Seed currently-held positions from the frozen lot snapshot.
            Object.entries(seedLots).forEach(([ticker, lots]) => {
                lotsByTicker[ticker] = lots.map(l => ({ date: l.date, qty: l.qty, cost: l.cost }));
            });

            // Seed fully-exited tickers (hand-kept historical lots not in DB).
            Object.entries(EXITED_LOTS).forEach(([ticker, lots]) => {
                lotsByTicker[ticker] = (lotsByTicker[ticker] || []).concat(
                    lots.map(l => ({ date: l.date, qty: l.qty, cost: l.cost }))
                );
            });

            // Held tickers: only post-seed transactions need replay (seed already bakes
            // in pre-seed state). Exited tickers: replay every transaction — their
            // buy/sell chain may start before the seed date.
            const replay = transactions
                .filter(t => EXITED_LOTS[t.ticker] ? true : t.date > FIFO_SEED_DATE)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            replay.forEach(t => {
                const qty = Number(t.quantity), price = Number(t.price);
                lotsByTicker[t.ticker] = lotsByTicker[t.ticker] || [];
                if (t.type === 'BUY') {
                    lotsByTicker[t.ticker].push({ date: t.date, qty, cost: price });
                } else if (t.type === 'SELL') {
                    let remaining = qty;
                    const sellDate = new Date(t.date);
                    const queue = lotsByTicker[t.ticker];
                    while (remaining > 0 && queue.length > 0) {
                        const lot = queue[0];
                        const use = Math.min(lot.qty, remaining);
                        (realizedByTicker[t.ticker] = realizedByTicker[t.ticker] || []).push({
                            sellDate: t.date, buyDate: lot.date, qty: use,
                            cost: lot.cost, sellPrice: price,
                            gain: (price - lot.cost) * use,
                            term: isLongTermLot(lot.date, sellDate) ? 'LT' : 'ST'
                        });
                        lot.qty -= use;
                        remaining -= use;
                        if (lot.qty <= 0) queue.shift();
                    }
                }
            });

            // Merge hand-computed pre-seed realized P&L (sells on held tickers that
            // pre-date FIFO_SEED_DATE — their consumed lots are no longer in the seed).
            Object.entries(PRE_SEED_REALIZED).forEach(([ticker, entries]) => {
                realizedByTicker[ticker] = (realizedByTicker[ticker] || []).concat(entries);
            });

            FIFO = { lotsByTicker, realizedByTicker };
            return FIFO;
        }

        // Realized gain attributable to a single SELL row, summed across the lots
        // it consumed. `term` is 'LT' / 'ST' / 'MIX' if the sell straddled both.
        function realizedForSell(txn) {
            const lots = (FIFO.realizedByTicker[txn.ticker] || [])
                .filter(r => r.sellDate === txn.date && r.sellPrice === Number(txn.price));
            if (!lots.length) return null;
            const gain = lots.reduce((s, l) => s + l.gain, 0);
            const terms = new Set(lots.map(l => l.term));
            const term = terms.size === 1 ? [...terms][0] : 'MIX';
            return { gain, term, lots };
        }

        // Returns DB transactions + virtual BUY rows for fully-exited tickers,
        // so the Transactions tab UI surfaces the historical buy lots that aren't
        // in the DB but are needed to explain a SELL's realized P&L.
        function displayTransactions() {
            const virtual = Object.entries(EXITED_LOTS).flatMap(([ticker, lots]) =>
                lots.map(l => ({
                    date: l.date, type: 'BUY', ticker, stock: ticker,
                    quantity: l.qty, price: l.cost, _historical: true,
                }))
            );
            return [...transactions, ...virtual];
        }

        // Aggregate realized gains over an Indian FY window (Apr 1 -> Mar 31).
        function realizedForFY(fyStart, fyEnd) {
            let stcg = 0, ltcg = 0;
            const rows = [];
            Object.entries(FIFO.realizedByTicker || {}).forEach(([ticker, rs]) => {
                rs.forEach(r => {
                    if (r.sellDate >= fyStart && r.sellDate <= fyEnd) {
                        if (r.term === 'ST') stcg += r.gain; else ltcg += r.gain;
                        rows.push({ ticker, ...r });
                    }
                });
            });
            return { stcg, ltcg, rows };
        }

        // Reusable Newton-Raphson XIRR kernel (ported from the India dashboard).
        function solveXIRR(cashFlows, dates) {
            if (cashFlows.length < 2) return null;
            const daysDiff = (dates[dates.length - 1] - dates[0]) / (1000 * 60 * 60 * 24);
            if (daysDiff < 1) return null;
            let guess = 0.1;
            for (let i = 0; i < 200; i++) {
                let npv = 0, dnpv = 0;
                for (let j = 0; j < cashFlows.length; j++) {
                    const yf = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
                    const factor = Math.pow(1 + guess, yf);
                    npv += cashFlows[j] / factor;
                    dnpv += -yf * cashFlows[j] / factor / (1 + guess);
                }
                if (Math.abs(dnpv) < 1e-10) break;
                const next = guess - npv / dnpv;
                if (Math.abs(next - guess) < 0.000001) return next * 100;
                guess = isFinite(next) ? next : 0.1;
            }
            return null;
        }

        // Per-holding XIRR — open lots only: -cost on each lot's buy date,
        // +current market value as the terminal inflow today.
        function computeHoldingsXIRR(ticker, currentValue) {
            try {
                const lots = (FIFO.lotsByTicker[ticker] || []).filter(l => l.qty > 0 && l.date);
                if (!lots.length || currentValue <= 0) return null;
                const cashFlows = [], dates = [];
                lots.forEach(l => {
                    cashFlows.push(-(l.qty * l.cost));
                    dates.push(new Date(l.date));
                });
                cashFlows.push(currentValue);
                dates.push(new Date());
                return solveXIRR(cashFlows, dates);
            } catch (e) { return null; }
        }

        // ============ CUSTOM PERIOD XIRR ============
        // Range XIRR for any start-month -> end-month (or 'current') range.
        // Ports the India custom-XIRR pattern: snapshot baseline + intervening
        // cash_flows + post-CASH_FLOWS_END_DATE transactions + terminal value.
        // Uses solveXIRR-style Newton-Raphson with multiple starting guesses.
        function monthOptionsForXIRR(selected, allowCurrent) {
            const out = [];
            if (allowCurrent) {
                out.push(`<option value="current" ${selected === 'current' ? 'selected' : ''}>Current</option>`);
            }
            const today = new Date();
            const cy = today.getFullYear(), cm = today.getMonth() + 1;
            const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            for (let y = cy; y >= 2021; y--) {
                const startM = (y === cy) ? cm : 12;
                const endM = (y === 2021) ? 11 : 1;
                for (let m = startM; m >= endM; m--) {
                    const ym = `${y}-${String(m).padStart(2, '0')}`;
                    out.push(`<option value="${ym}" ${selected === ym ? 'selected' : ''}>${M[m-1]} ${y}</option>`);
                }
            }
            return out.join('');
        }

        function calculateCustomXIRR(startYM, endYM, currentPortfolioValue) {
            const snapshots = getSnapshots();
            const startEntry = Object.entries(snapshots)
                .filter(([d]) => d.startsWith(startYM))
                .sort(([a], [b]) => b.localeCompare(a))[0];
            if (!startEntry) return { xirr: null, error: 'No snapshot for start month' };
            const startValue = startEntry[1];
            const startDate = new Date(startEntry[0]);
            const startStr = startEntry[0];

            let endValue, endDate, endStr;
            if (endYM === 'current') {
                endValue = currentPortfolioValue;
                endDate = new Date();
                endStr = new Date().toISOString().split('T')[0];
            } else {
                const endEntry = Object.entries(snapshots)
                    .filter(([d]) => d.startsWith(endYM))
                    .sort(([a], [b]) => b.localeCompare(a))[0];
                if (!endEntry) return { xirr: null, error: 'No snapshot for end month' };
                endValue = endEntry[1];
                endDate = new Date(endEntry[0]);
                endStr = endEntry[0];
            }
            if (endDate <= startDate) return { xirr: null, error: 'End must be after start' };

            const cashFlows = [-startValue];
            const dates = [startDate];

            HISTORICAL_CASH_FLOWS.forEach(cf => {
                if (cf.date > startStr && cf.date <= endStr) {
                    cashFlows.push(cf.type === 'Deposit' ? -cf.amount : cf.amount);
                    dates.push(new Date(cf.date));
                }
            });

            const txnStart = startStr > CASH_FLOWS_END_DATE ? startStr : CASH_FLOWS_END_DATE;
            transactions.filter(t => t.date > txnStart && t.date <= endStr).forEach(t => {
                cashFlows.push(t.type === 'BUY' ? -(t.quantity * t.price) : (t.quantity * t.price));
                dates.push(new Date(t.date));
            });

            cashFlows.push(endValue);
            dates.push(endDate);

            const npvFn = r => cashFlows.reduce((s, cf, j) => {
                const yf = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
                return s + cf / Math.pow(1 + r, yf);
            }, 0);
            const dnpvFn = r => cashFlows.reduce((s, cf, j) => {
                const yf = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
                return s - yf * cf / Math.pow(1 + r, yf) / (1 + r);
            }, 0);

            let xirr = null;
            for (const startGuess of [0.1, -0.1, 0.5, -0.5, 1.0, -0.9]) {
                let guess = startGuess;
                for (let i = 0; i < 200; i++) {
                    const npv = npvFn(guess);
                    const dnpv = dnpvFn(guess);
                    if (dnpv === 0 || !isFinite(dnpv)) break;
                    const ng = guess - npv / dnpv;
                    if (!isFinite(ng) || ng <= -1) break;
                    if (Math.abs(ng - guess) < 0.00001) { xirr = ng * 100; break; }
                    guess = ng;
                }
                if (xirr !== null) break;
            }

            // Capital-aware gain (mirrors Period Gains / Annual Gains formula):
            //   gain = endValue + withdrawals + sold - deposits - bought - startValue
            // The naive endValue - startValue was wrong — buying $80k of stock raises
            // endValue without it being a gain (it's capital, not P&L).
            const periodCF = HISTORICAL_CASH_FLOWS.filter(cf => cf.date > startStr && cf.date <= endStr);
            const cfWd = periodCF.filter(cf => cf.type !== 'Deposit').reduce((s, cf) => s + cf.amount, 0);
            const cfDep = periodCF.filter(cf => cf.type === 'Deposit').reduce((s, cf) => s + cf.amount, 0);
            const txnGainStart = startStr > CASH_FLOWS_END_DATE ? startStr : CASH_FLOWS_END_DATE;
            const txInRange = transactions.filter(t => t.date > txnGainStart && t.date <= endStr);
            const txSold = txInRange.filter(t => t.type === 'SELL').reduce((s, t) => s + t.quantity * t.price, 0);
            const txBought = txInRange.filter(t => t.type === 'BUY').reduce((s, t) => s + t.quantity * t.price, 0);
            const absoluteGain = endValue + cfWd + txSold - cfDep - txBought - startValue;
            const absoluteGainPct = startValue > 0 ? (absoluteGain / startValue) * 100 : 0;
            return { xirr, absoluteGain, absoluteGainPct };
        }

        // ============ QQQ BENCHMARK HISTORY ============
        // Builds a date → close map for QQQ from two sources, so the Custom
        // Period card can find a close for any user-selected month:
        //   1. benchmark_history  — the frozen archive (Nov 2021 → backfill date)
        //   2. daily_stock_snapshots — fetch_ohlc.py's rolling 90-day window
        // Union keeps the lookup fresh going forward without re-running the backfill.
        async function loadQqqHistoryFromSupabase() {
            try {
                const out = {};
                // 1) Archive (paginated; Supabase caps a single response at 1000 rows)
                let from = 0, page = 1000, archiveCount = 0;
                while (true) {
                    const { data, error } = await supabase
                        .from('benchmark_history')
                        .select('snapshot_date, close')
                        .eq('ticker', 'QQQ')
                        .order('snapshot_date', { ascending: true })
                        .range(from, from + page - 1);
                    if (error) throw error;
                    if (!data || !data.length) break;
                    data.forEach(r => { out[r.snapshot_date] = Number(r.close); });
                    archiveCount += data.length;
                    if (data.length < page) break;
                    from += page;
                }
                // 2) Rolling 90-day window (overwrites the tail of the archive with fresh values)
                const { data: recent, error: recentErr } = await supabase
                    .from('daily_stock_snapshots')
                    .select('snapshot_date, close')
                    .eq('ticker', 'QQQ')
                    .order('snapshot_date', { ascending: true });
                if (recentErr) throw recentErr;
                (recent || []).forEach(r => { out[r.snapshot_date] = Number(r.close); });
                console.log(`✅ Loaded QQQ: ${archiveCount} archive + ${recent?.length || 0} rolling rows`);
                return out;
            } catch (e) {
                console.error('❌ Error loading QQQ history:', e);
                return {};
            }
        }

        // Closest QQQ close on or before the given date string (YYYY-MM-DD).
        function qqqCloseOnOrBefore(dateStr) {
            const keys = Object.keys(qqqHistory).filter(d => d <= dateStr).sort();
            return keys.length ? qqqHistory[keys[keys.length - 1]] : null;
        }

        // CAGR (annualized return) for QQQ over the same window as the
        // portfolio's Custom Period XIRR. Single buy / single sell, so CAGR =
        // ((endPrice / startPrice) ^ (1/years) - 1) * 100.
        function calculateQqqReturnForRange(startYM, endYM) {
            // Start = last QQQ close in start month
            const startMonthEnd = new Date(Number(startYM.slice(0, 4)), Number(startYM.slice(5, 7)), 0)
                .toISOString().split('T')[0];
            const startPrice = qqqCloseOnOrBefore(startMonthEnd);
            if (!startPrice) return { xirr: null, gainPct: null };

            let endDateStr, endPrice;
            if (endYM === 'current') {
                endDateStr = new Date().toISOString().split('T')[0];
                endPrice = prices['QQQ']?.price || qqqCloseOnOrBefore(endDateStr);
            } else {
                endDateStr = new Date(Number(endYM.slice(0, 4)), Number(endYM.slice(5, 7)), 0)
                    .toISOString().split('T')[0];
                endPrice = qqqCloseOnOrBefore(endDateStr);
            }
            if (!endPrice) return { xirr: null, gainPct: null };

            const startDate = new Date(startMonthEnd);
            const endDate = new Date(endDateStr);
            const years = (endDate - startDate) / (1000 * 60 * 60 * 24 * 365.25);
            if (years <= 0) return { xirr: null, gainPct: null };

            const gainPct = (endPrice / startPrice - 1) * 100;
            const xirr = (Math.pow(endPrice / startPrice, 1 / years) - 1) * 100;
            return { xirr, gainPct };
        }

        // ============ TECHNICAL ALERTS LOADERS (Phase 3) ============

        // RRG quadrant -> chip styling. Used on each signal card.
        const RRG_STYLE = {

        // Returns inline-HTML for the industry + RRG context line under a card's ticker.

        function renderPeerContext(ticker, fallbackSector) {
            const cls = tickerClassifications[ticker] || {};
            const industry = cls.industry;
            const peerGroup = cls.peer_group || cls.sector || fallbackSector;
            const sector = cls.sector || fallbackSector;
            const rank = peerGroupRankings[peerGroup];

            const parts = [];
            // First line: industry (granular) — falls back to sector when industry is the same as peer_group rollup
            if (industry && industry !== peerGroup) {
                parts.push(`<span style="font-size:11px;color:var(--text-secondary);">${industry}</span>`);
            } else if (industry) {
                parts.push(`<span style="font-size:11px;color:var(--text-secondary);font-weight:600;">${industry}</span>`);
            } else if (sector) {
                parts.push(`<span style="font-size:11px;color:var(--text-secondary);">${sector}</span>`);
            }
            // RRG chip (only when we have a peer_group ranking)
            if (rank && rank.rrg_quadrant) {
                const st = RRG_STYLE[rank.rrg_quadrant] || RRG_STYLE['Lagging'];
                const rankN = rank.composite_rank;
                parts.push(`<span title="Peer group: ${peerGroup} (${rank.n_tickers || '?'} tickers) — ${rank.rrg_quadrant}; composite rank #${rankN}" style="display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;background:${st.bg};color:${st.color};border:1px solid ${st.border};">${st.emoji} ${rank.rrg_quadrant}${rankN ? ' #' + rankN : ''}</span>`);

        function calculateEmaStats(portfolio) {
            let bullStack = 0, bearStack = 0, above20 = 0, above50 = 0, above200 = 0;
            portfolio.forEach(s => {
                const e = stockEmaData[s.ticker];
                const px = prices[s.ticker]?.price || (e ? e.close : 0) || 0;
                if (!e || !e.ema_20 || !e.ema_50 || !e.ema_200 || px <= 0) return;
                if (px > e.ema_20 && e.ema_20 > e.ema_50 && e.ema_50 > e.ema_200) bullStack++;
                if (px < e.ema_20 && e.ema_20 < e.ema_50 && e.ema_50 < e.ema_200) bearStack++;
                if (px > e.ema_20) above20++;
                if (px > e.ema_50) above50++;
                if (px > e.ema_200) above200++;
            });
            return { bullStack, bearStack, above20, above50, above200, total: portfolio.length };
        }

        function getLargestHolding() {
            const totalVal = portfolio.reduce((s, p) => s + p.quantity * (prices[p.ticker]?.price || 0), 0);
            let max = { name: '-', value: 0, ticker: null, pct: 0 };
            portfolio.forEach(s => {
                const v = s.quantity * (prices[s.ticker]?.price || 0);
                if (v > max.value) {
                    max = { name: s.name, value: v, ticker: s.ticker, pct: totalVal > 0 ? (v / totalVal) * 100 : 0 };
                }
            });
            return max;
        }

        function getMostProfitable() {
            let best = { name: '-', gain: -Infinity, pct: 0, ticker: null };
            portfolio.forEach(s => {
                const cost = fifoCostOf(s);
                const cur = s.quantity * (prices[s.ticker]?.price || 0);
                const pnl = cur - cost;
                if (pnl > best.gain) best = { name: s.name, gain: pnl, pct: cost > 0 ? (pnl / cost) * 100 : 0, ticker: s.ticker };
            });
            if (best.gain === -Infinity) best = { name: '-', gain: 0, pct: 0, ticker: null };
            return best;
        }

        function getLeastProfitable() {
            let worst = { name: '-', gain: Infinity, pct: 0, ticker: null };
            portfolio.forEach(s => {
                const cost = fifoCostOf(s);
                const cur = s.quantity * (prices[s.ticker]?.price || 0);
                const pnl = cur - cost;
                if (pnl < worst.gain) worst = { name: s.name, gain: pnl, pct: cost > 0 ? (pnl / cost) * 100 : 0, ticker: s.ticker };
            });
            if (worst.gain === Infinity) worst = { name: '-', gain: 0, pct: 0, ticker: null };
            return worst;
        }

        function getWinningLosingMonths(year) {
            const snapshots = getSnapshots();
            const now = new Date();
            const currentYear = now.getFullYear();
            const maxMonth = year === currentYear ? now.getMonth() + 1 : 12;
            let wins = 0, losses = 0;
            for (let m = 1; m <= maxMonth; m++) {
                const startStr = `${year}-${String(m).padStart(2, '0')}-01`;
                const endDateObj = new Date(year, m, 0);
                const endStr = `${year}-${String(m).padStart(2, '0')}-${String(endDateObj.getDate()).padStart(2, '0')}`;
                const prevMonthEndObj = new Date(year, m - 1, 0);
                const prevMonthEnd = m === 1
                    ? `${year - 1}-12-31`
                    : `${year}-${String(m - 1).padStart(2, '0')}-${String(prevMonthEndObj.getDate()).padStart(2, '0')}`;
                const startValue = getClosestSnapshot(snapshots, prevMonthEnd);
                const endValue = getClosestSnapshot(snapshots, endStr);
                if (!startValue || !endValue) continue;
                const monthCF = HISTORICAL_CASH_FLOWS.filter(cf => cf.date >= startStr && cf.date <= endStr);
                const wd = monthCF.filter(cf => cf.type !== 'Deposit').reduce((s, cf) => s + cf.amount, 0);
                const dep = monthCF.filter(cf => cf.type === 'Deposit').reduce((s, cf) => s + cf.amount, 0);
                const monthTxn = transactions.filter(t => t.date >= startStr && t.date <= endStr);
                const sold = monthTxn.filter(t => t.type === 'SELL').reduce((s, t) => s + t.quantity * t.price, 0);
                const bought = monthTxn.filter(t => t.type === 'BUY').reduce((s, t) => s + t.quantity * t.price, 0);
                const monthGain = endValue + wd + sold - dep - bought - startValue;
                if (monthGain > 0) wins++;
                else if (monthGain < 0) losses++;
            }
            return { wins, losses, total: wins + losses };
        }

        function monthlyGainsForYear(year) {
            const snapshots = getSnapshots();
            const now = new Date();
            const currentYear = now.getFullYear();
            const maxMonth = year === currentYear ? now.getMonth() + 1 : 12;
            const out = [];
            for (let m = 1; m <= 12; m++) {
                if (m > maxMonth) { out.push({ month: m, gain: null }); continue; }
                const startStr = `${year}-${String(m).padStart(2, '0')}-01`;
                const endDateObj = new Date(year, m, 0);
                const endStr = `${year}-${String(m).padStart(2, '0')}-${String(endDateObj.getDate()).padStart(2, '0')}`;
                const prevMonthEndObj = new Date(year, m - 1, 0);
                const prevMonthEnd = m === 1
                    ? `${year - 1}-12-31`
                    : `${year}-${String(m - 1).padStart(2, '0')}-${String(prevMonthEndObj.getDate()).padStart(2, '0')}`;
                const startValue = getClosestSnapshot(snapshots, prevMonthEnd);
                const endValue = getClosestSnapshot(snapshots, endStr);
                if (!startValue || !endValue) { out.push({ month: m, gain: null }); continue; }
                const monthCF = HISTORICAL_CASH_FLOWS.filter(cf => cf.date >= startStr && cf.date <= endStr);
                const wd = monthCF.filter(cf => cf.type !== 'Deposit').reduce((s, cf) => s + cf.amount, 0);
                const dep = monthCF.filter(cf => cf.type === 'Deposit').reduce((s, cf) => s + cf.amount, 0);
                const monthTxn = transactions.filter(t => t.date >= startStr && t.date <= endStr);
                const sold = monthTxn.filter(t => t.type === 'SELL').reduce((s, t) => s + t.quantity * t.price, 0);
                const bought = monthTxn.filter(t => t.type === 'BUY').reduce((s, t) => s + t.quantity * t.price, 0);
                out.push({ month: m, gain: endValue + wd + sold - dep - bought - startValue });
            }
            return out;
        }

        function sectorAggregation() {
            const out = {};
            portfolio.forEach(s => {
                const sec = (stockMeta[s.ticker] && stockMeta[s.ticker].sector) || s.sector || 'Unknown';
                const price = prices[s.ticker]?.price || 0;
                const val = s.quantity * price;
                const cost = fifoCostOf(s);
                if (!out[sec]) out[sec] = { value: 0, gain: 0 };
                out[sec].value += val;
                out[sec].gain += (val - cost);
            });
            return out;
        }

        function mcapAggregation() {
            const buckets = {
                'Mega ($200B+)': { value: 0, gain: 0 },
                'Large ($10B-$200B)': { value: 0, gain: 0 },
                'Mid ($2B-$10B)': { value: 0, gain: 0 },
                'Small (<$2B)': { value: 0, gain: 0 },
                'Unknown': { value: 0, gain: 0 }
            };
            portfolio.forEach(s => {
                const mcap = (stockMeta[s.ticker] && stockMeta[s.ticker].marketCap) || 0;
                const price = prices[s.ticker]?.price || 0;
                const val = s.quantity * price;
                const cost = fifoCostOf(s);
                let b;
                if (mcap >= 200e9) b = 'Mega ($200B+)';
                else if (mcap >= 10e9) b = 'Large ($10B-$200B)';
                else if (mcap >= 2e9) b = 'Mid ($2B-$10B)';
                else if (mcap > 0) b = 'Small (<$2B)';
                else b = 'Unknown';
                buckets[b].value += val;
                buckets[b].gain += (val - cost);
            });
            return Object.fromEntries(Object.entries(buckets).filter(([_, v]) => v.value > 0));
        }

        // ============ ANALYTICS TAB ============
        // Color ramp 0..100 → red→yellow→green, used for composite heatmap tiles.
        function compositeColor(pct) {
            if (pct == null || isNaN(pct)) return { bg: 'var(--bg-secondary)', text: 'var(--text-secondary)' };
            const stops = [
                [0,   [239, 68, 68]],    // #ef4444 red
                [40,  [245, 158, 11]],   // #f59e0b amber
                [60,  [250, 204, 21]],   // #facc15 yellow
                [80,  [34, 197, 94]],    // #22c55e green
                [100, [16, 185, 129]],   // #10b981 emerald
            ];
            let lo = stops[0], hi = stops[stops.length - 1];
            for (let i = 0; i < stops.length - 1; i++) {
                if (pct >= stops[i][0] && pct <= stops[i+1][0]) { lo = stops[i]; hi = stops[i+1]; break; }
            }
            const t = (pct - lo[0]) / Math.max(1, (hi[0] - lo[0]));
            const r = Math.round(lo[1][0] + (hi[1][0] - lo[1][0]) * t);
            const g = Math.round(lo[1][1] + (hi[1][1] - lo[1][1]) * t);
            const b = Math.round(lo[1][2] + (hi[1][2] - lo[1][2]) * t);
            return { bg: `rgba(${r},${g},${b},0.18)`, border: `rgba(${r},${g},${b},0.40)`, text: `rgb(${r},${g},${b})` };
        }

                                <th style="text-align:right;padding:8px 6px;">Breadth</th>
                                <th style="text-align:right;padding:8px 6px;">Avg RS</th>
                                <th style="text-align:right;padding:8px 6px;">5d Slope</th>
                                <th style="text-align:right;padding:8px 6px;">n</th>
                                <th style="text-align:center;padding:8px 6px;">RRG</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sortedRows.map(g => {
                                const st = RRG_STYLE[g.rrg_quadrant] || { color: '#94a3b8', bg: '#94a3b820', border: '#94a3b840', emoji: '—' };
                                const cc = compositeColor(g.composite);
                                const isRollup = g.peer_group_type === 'sector';
                                const slope = g.rs_slope;
                                const slopeColor = slope == null ? 'var(--text-secondary)' : slope >= 0 ? '#10b981' : '#ef4444';

                                return `<tr style="border-bottom:1px solid var(--border-color);cursor:pointer;" onclick="openSectorDrawer('${safe}')" onmouseover="this.style.background='var(--bg-secondary)'" onmouseout="this.style.background='transparent'">

                                    <td style="padding:7px 6px;color:var(--text-secondary);">${g.parent_sector || '—'}</td>
                                    <td style="padding:7px 6px;text-align:right;font-weight:600;background:${cc.bg};color:${cc.text};">${g.composite?.toFixed?.(1) ?? '—'}</td>
                                    <td style="padding:7px 6px;text-align:right;">${g.breadth?.toFixed?.(0) ?? '—'}%</td>
                                    <td style="padding:7px 6px;text-align:right;">${g.avg_alkalyme_rs?.toFixed?.(1) ?? '—'}</td>
                                    <td style="padding:7px 6px;text-align:right;color:${slopeColor};font-weight:600;">${slope == null ? '—' : (slope >= 0 ? '+' : '') + slope.toFixed(2)}</td>

                                    <td style="padding:7px 6px;text-align:center;">
                                        <span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:${st.bg};color:${st.color};border:1px solid ${st.border};">${st.emoji} ${g.rrg_quadrant || '—'}</span>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                    </div>
                </div>`;

            // ── Sector heatmap (industries grouped under their parent sector) ──
            const bySector = {};
            groups.filter(g => g.peer_group_type === 'industry').forEach(g => {
                (bySector[g.parent_sector] = bySector[g.parent_sector] || []).push(g);
            });
            const heatmapCols = Object.entries(bySector)
                .sort((a, b) => {
                    const aAvg = a[1].reduce((s, x) => s + (x.composite || 0), 0) / a[1].length;
                    const bAvg = b[1].reduce((s, x) => s + (x.composite || 0), 0) / b[1].length;
                    return bAvg - aAvg;
                })
                .map(([sector, inds]) => {
                    const sortedInds = [...inds].sort((a, b) => (b.composite || 0) - (a.composite || 0));
                    const tiles = sortedInds.map(g => {
                        const cc = compositeColor(g.composite);
                        const st = RRG_STYLE[g.rrg_quadrant] || { emoji: '—', color: '#94a3b8' };
                        const safe = g.peer_group.replace(/'/g, "\\'");
                        return `<div onclick="openSectorDrawer('${safe}')" style="padding:8px 10px;border-radius:6px;background:${cc.bg};border:1px solid ${cc.border};display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:pointer;transition:transform 0.1s ease;" onmouseover="this.style.transform='translateX(2px)'" onmouseout="this.style.transform='translateX(0)'">
                            <span style="font-size:12px;font-weight:600;">${g.peer_group}</span>
                            <span style="font-size:11px;color:${cc.text};font-weight:700;">${st.emoji} ${g.composite?.toFixed?.(0) ?? '—'}</span>
                        </div>`;
                    }).join('');
                    return `<div class="card p-3" style="display:flex;flex-direction:column;gap:6px;">
                        <div style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;padding-bottom:4px;border-bottom:1px solid var(--border-color);">${sector}</div>
                        ${tiles}
                    </div>`;
                }).join('');

            const heatmapCard = `
                <div style="margin-bottom:4px;">
                    <h3 style="font-size:15px;font-weight:700;margin-bottom:10px;">🗺️ Industry Heatmap (grouped by GICS sector)</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
                    ${heatmapCols}
                </div>`;

            return `
                <div class="card p-6 mb-4">
                    <h2 class="text-xl font-bold mb-1">Analytics — Sector Intelligence</h2>
                    <p style="color: var(--text-secondary); font-size: 13px;">Market regime, peer-group RRG, and industry composite rankings. Drives entry-signal filters and (later) the Algo tab.</p>
                </div>
                ${regimeRow}
                ${rrgCard}
                ${leaderboardCard}
                ${heatmapCard}
            `;
        }

        function setAnalyticsQuadrantFilter(q) {
            analyticsQuadrantFilter = q;
            render();
            setTimeout(drawAnalyticsRrgChart, 50);
        }

        function drawAnalyticsRrgChart() {
            const canvas = document.getElementById('analyticsRrgChart');
            if (!canvas) return;
            if (analyticsCharts.rrg) { analyticsCharts.rrg.destroy(); analyticsCharts.rrg = null; }

            const groups = Object.entries(peerGroupRankings)
                .map(([pg, r]) => ({ peer_group: pg, ...r }))
                .filter(g => g.avg_alkalyme_rs != null && g.rs_slope != null);
            if (!groups.length) return;

            // Build per-quadrant point sets so legend colors them correctly
            const buckets = { Leading: [], Improving: [], Weakening: [], Lagging: [] };
            groups.forEach(g => {
                const pt = {
                    x: Number(g.avg_alkalyme_rs),
                    y: Number(g.rs_slope),
                    label: g.peer_group,
                    n: g.n_tickers,
                    rank: g.composite_rank,
                    composite: g.composite,
                };
                (buckets[g.rrg_quadrant] || buckets['Lagging']).push(pt);
            });

            const dataset = (name, color) => ({
                label: name,
                data: buckets[name],
                backgroundColor: color + 'cc',
                borderColor: color,
                borderWidth: 1,
                pointRadius: ctx => Math.min(14, 4 + Math.sqrt(ctx.raw.n || 1)),
                pointHoverRadius: 16,
            });

            const datasets = [
                dataset('Leading',   '#10b981'),
                dataset('Improving', '#3b82f6'),
                dataset('Weakening', '#f59e0b'),
                dataset('Lagging',   '#ef4444'),
            ];

            const xs = groups.map(g => g.avg_alkalyme_rs);
            const ys = groups.map(g => g.rs_slope);
            const xMin = Math.min(...xs) - 5, xMax = Math.max(...xs) + 5;
            const yMin = Math.min(...ys, -0.5) - 0.5, yMax = Math.max(...ys, 0.5) + 0.5;
            const xMid = xs.slice().sort((a,b)=>a-b)[Math.floor(xs.length/2)];  // median

            // Quadrant background plugin (paints 4 colored boxes under the points)
            const quadrantBg = {
                id: 'quadrantBg',
                beforeDraw(chart) {
                    const { ctx, chartArea, scales } = chart;
                    if (!chartArea) return;
                    const xMidPx = scales.x.getPixelForValue(xMid);
                    const yMidPx = scales.y.getPixelForValue(0);
                    const paint = (x1, y1, x2, y2, color) => {
                        ctx.fillStyle = color;
                        ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
                    };
                    paint(xMidPx, chartArea.top, chartArea.right, yMidPx, '#10b98112');  // Leading (top-right)
                    paint(chartArea.left, chartArea.top, xMidPx, yMidPx, '#3b82f612');   // Improving (top-left)
                    paint(xMidPx, yMidPx, chartArea.right, chartArea.bottom, '#f59e0b12'); // Weakening (bottom-right)
                    paint(chartArea.left, yMidPx, xMidPx, chartArea.bottom, '#ef444412');  // Lagging (bottom-left)
                    // dividers
                    ctx.strokeStyle = 'rgba(148,163,184,0.4)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.moveTo(xMidPx, chartArea.top); ctx.lineTo(xMidPx, chartArea.bottom); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(chartArea.left, yMidPx); ctx.lineTo(chartArea.right, yMidPx); ctx.stroke();
                    ctx.setLineDash([]);
                },
            };

            analyticsCharts.rrg = new Chart(canvas, {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onHover: (e, elements) => { e.native.target.style.cursor = elements.length ? 'pointer' : 'default'; },
                    onClick: (e, elements) => {
                        if (!elements.length) return;
                        const el = elements[0];
                        const pt = analyticsCharts.rrg.data.datasets[el.datasetIndex].data[el.index];
                        if (pt && pt.label) openSectorDrawer(pt.label);
                    },
                    plugins: {
                        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
                        tooltip: {
                            callbacks: {
                                label: ctx => {
                                    const r = ctx.raw;
                                    return `${r.label} · #${r.rank} · composite ${r.composite?.toFixed?.(0) ?? '—'} · n=${r.n}`;
                                },
                            },
                        },
                    },
                    scales: {
                        x: { title: { display: true, text: 'Relative Strength (avg alkalyme_rs)' }, min: xMin, max: xMax },
                        y: { title: { display: true, text: '5d RS Momentum (rs_slope)' }, min: yMin, max: yMax },
                    },
                },
                plugins: [quadrantBg],
            });
        }

        // ============ SECTOR DETAIL DRAWER ============
        // Slides in from the right when a leaderboard row / heatmap tile / RRG chart point is clicked.
        // Shows snapshot stats, 60d RS trend, today's movers, active signals, holdings, and the
        // peer-group's stock list ranked by alkalyme_rs. India-parity feature.

        function ensureSectorDrawer() {
            if (document.getElementById('sectorDrawer')) return;

            const backdrop = document.createElement('div');
            backdrop.id = 'sectorDrawerBackdrop';
            backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9998;display:none;opacity:0;transition:opacity 0.2s';
            backdrop.onclick = closeSectorDrawer;

            const drawer = document.createElement('div');
            drawer.id = 'sectorDrawer';
            drawer.style.cssText = `
                position:fixed;top:0;right:0;height:100vh;width:min(760px,92vw);
                background:var(--bg-card);border-left:1px solid var(--border-color);
                z-index:9999;overflow-y:auto;
                transform:translateX(100%);transition:transform 0.25s ease-out;
                box-shadow:-8px 0 32px rgba(0,0,0,0.4);
            `;
            drawer.innerHTML = '<div id="sectorDrawerContent"></div>';

            document.body.appendChild(backdrop);
            document.body.appendChild(drawer);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && sectorDrawerOpen) closeSectorDrawer();
            });
        }

        async function openSectorDrawer(peerGroup) {
            if (!peerGroup) return;
            ensureSectorDrawer();
            sectorDrawerOpen = true;
            sectorDrawerPeerGroup = peerGroup;

            const backdrop = document.getElementById('sectorDrawerBackdrop');
            const drawer   = document.getElementById('sectorDrawer');
            backdrop.style.display = 'block';
            requestAnimationFrame(() => {
                backdrop.style.opacity = '1';
                drawer.style.transform = 'translateX(0)';
            });

            // Render skeleton with whatever data we have, then lazy-fetch and re-render
            renderSectorDrawerContent();
            const tasks = [];
            if (!sectorDrillCache[peerGroup])     tasks.push(fetchPeerGroupDrillData(peerGroup));
            if (!peerGroupRsHistory[peerGroup])   tasks.push(fetchPeerGroupRsHistory(peerGroup));
            if (tasks.length) {
                await Promise.all(tasks);
                renderSectorDrawerContent();
            }
        }

        function closeSectorDrawer() {
            sectorDrawerOpen = false;
            const backdrop = document.getElementById('sectorDrawerBackdrop');
            const drawer   = document.getElementById('sectorDrawer');
            if (drawer)   drawer.style.transform = 'translateX(100%)';
            if (backdrop) {
                backdrop.style.opacity = '0';
                setTimeout(() => { if (backdrop) backdrop.style.display = 'none'; }, 220);
            }
        }

        function toggleSectorDrawerShowAll() {
            if (!sectorDrawerPeerGroup) return;
            sectorDrawerShowAll[sectorDrawerPeerGroup] = !sectorDrawerShowAll[sectorDrawerPeerGroup];
            renderSectorDrawerContent();
        }

        // Resolve tickers belonging to a peer_group + pull the latest 2 snapshot rows for each
        // so we can compute "today's" % change as (close - prev_close) / prev_close.
        async function fetchPeerGroupDrillData(peerGroup) {
            try {
                const tickers = Object.entries(tickerClassifications)
                    .filter(([, c]) => c.peer_group === peerGroup)
                    .map(([t]) => t);
                if (!tickers.length) { sectorDrillCache[peerGroup] = { rows: [], latestDate: null }; return; }

                // Get the 2 most recent distinct snapshot_dates that actually exist
                const distinctDates = await supabase.from('daily_stock_snapshots')
                    .select('snapshot_date').in('ticker', tickers.slice(0, 3))
                    .order('snapshot_date', { ascending: false }).limit(10);
                const dates = [...new Set((distinctDates.data || []).map(r => r.snapshot_date))].slice(0, 2);
                const latestDate = dates[0];
                const prevDate   = dates[1];
                if (!latestDate) { sectorDrillCache[peerGroup] = { rows: [], latestDate: null }; return; }

                // Pull latest + prev day snapshots in one call
                const { data: snaps } = await supabase.from('daily_stock_snapshots')
                    .select('ticker, snapshot_date, close, open, ema_20, ema_50, ema_200, alkalyme_rs, rs_rank, high_52w, sector_percentile, peer_percentile')
                    .in('ticker', tickers)
                    .in('snapshot_date', dates);
                const latestMap = {}, prevMap = {};
                (snaps || []).forEach(s => {
                    if (s.snapshot_date === latestDate) latestMap[s.ticker] = s;
                    else if (s.snapshot_date === prevDate) prevMap[s.ticker] = s;
                });

                // Get company names from us_stock_sectors
                const { data: names } = await supabase.from('us_stock_sectors')
                    .select('ticker, company_name').in('ticker', tickers);
                const nameMap = {};
                (names || []).forEach(n => { nameMap[n.ticker] = n.company_name; });

                const rows = tickers
                    .map(t => {
                        const cur = latestMap[t];
                        if (!cur) return null;
                        const prev = prevMap[t];
                        return {
                            ticker: t,
                            name: nameMap[t],
                            ...cur,
                            prev_close: prev?.close ?? null,
                        };
                    })
                    .filter(r => r && r.alkalyme_rs != null)
                    .sort((a, b) => (a.rs_rank || 9999) - (b.rs_rank || 9999));
                sectorDrillCache[peerGroup] = { rows, latestDate, prevDate };
            } catch (e) {
                console.error('fetchPeerGroupDrillData error', e);
                sectorDrillCache[peerGroup] = { rows: [], latestDate: null };
            }
        }

        // Pull last 60 sector_rankings rows for this peer_group to drive the RS trend chart.
        async function fetchPeerGroupRsHistory(peerGroup) {
            try {
                const { data } = await supabase.from('sector_rankings')
                    .select('snapshot_date, avg_alkalyme_rs')
                    .eq('peer_group', peerGroup)
                    .order('snapshot_date', { ascending: false }).limit(60);
                const hist = (data || []).map(r => ({ date: r.snapshot_date, value: Number(r.avg_alkalyme_rs) })).reverse();
                peerGroupRsHistory[peerGroup] = hist;
            } catch (e) {
                console.error('fetchPeerGroupRsHistory error', e);
                peerGroupRsHistory[peerGroup] = [];
            }
        }

        function renderSectorDrawerContent() {
            const peerGroup = sectorDrawerPeerGroup;
            const el = document.getElementById('sectorDrawerContent');
            if (!peerGroup || !el) return;

            const rank      = peerGroupRankings[peerGroup] || {};
            const drill     = sectorDrillCache[peerGroup];
            const rsHist    = peerGroupRsHistory[peerGroup] || [];

            // ── Snapshot row stats (advancing/declining, 52WH/L, RS rank, composite) ─
            let adv = 0, dec = 0, nh = 0, nl = 0;
            (drill?.rows || []).forEach(r => {
                if (r.close != null && r.open != null) {
                    if (r.close > r.open) adv++;
                    else if (r.close < r.open) dec++;
                }
                if (r.close != null && r.high_52w != null) {
                    // 52WH = within 1% of 52w high; 52WL = within 1% of (a derived low; we don't have low_52w so use close/high_52w distance)
                    if (r.close >= r.high_52w * 0.99) nh++;
                    else if (r.high_52w > 0 && r.close <= r.high_52w * 0.55) nl++; // deep drawdown
                }
            });

            // Determine if the user holds any stock in this peer group
            const portfolioSet = new Set(portfolio.map(p => tickerClassifications[p.ticker]?.peer_group).filter(Boolean));
            const isPortfolio = portfolioSet.has(peerGroup);

            const composite = rank.composite != null ? Math.round(rank.composite) : '—';
            const compColor = composite >= 70 ? '#10b981' : composite >= 50 ? '#3b82f6' : composite >= 35 ? '#e3b341' : '#ef4444';
            const rrg = rank.rrg_quadrant;
            const rrgSt = RRG_STYLE[rrg] || null;
            const isIndustry = rank.peer_group_type === 'industry';

            // ── Header ───────────────────────────────────────────────────────
            let html = `
            <div style="position:sticky;top:0;background:var(--bg-card);border-bottom:1px solid var(--border-color);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;z-index:1">
                <div>
                    <div style="font-size:22px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                        ${peerGroup}
                        ${isPortfolio ? '<span style="font-size:14px;color:#f59e0b">★ portfolio</span>' : ''}
                        ${rrgSt ? `<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${rrgSt.bg};color:${rrgSt.color};border:1px solid ${rrgSt.border};font-weight:600;">${rrgSt.emoji} ${rrg}</span>` : ''}
                    </div>
                    <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">
                        ${rank.composite_rank ? 'Rank #' + rank.composite_rank : ''}${rank.n_tickers ? ' · ' + rank.n_tickers + ' tickers' : ''}${isIndustry && rank.parent_sector ? ' · under ' + rank.parent_sector : ''}
                    </div>
                </div>
                <button onclick="closeSectorDrawer()" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);font-size:24px;padding:4px 12px;border-radius:6px" title="Close (Esc)" onmouseover="this.style.background='var(--bg-secondary)'" onmouseout="this.style.background='none'">×</button>
            </div>
            <div style="padding:20px 24px">
            `;

            // ── 1. Snapshot row ────────────────────────────────────────────
            html += `
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px">
                <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center">
                    <div style="font-size:10px;color:var(--text-secondary);font-weight:600;letter-spacing:0.5px">TODAY</div>
                    <div style="font-size:14px;font-weight:600;margin-top:4px">
                        <span style="color:#10b981">↑${adv}</span> <span style="color:#ef4444">↓${dec}</span>
                    </div>
                </div>
                <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center">
                    <div style="font-size:10px;color:var(--text-secondary);font-weight:600;letter-spacing:0.5px">52W H · DEEP DD</div>
                    <div style="font-size:14px;font-weight:600;margin-top:4px">
                        <span style="color:#10b981">🚀${nh}</span> <span style="color:#ef4444">🐻${nl}</span>
                    </div>
                </div>
                <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center">
                    <div style="font-size:10px;color:var(--text-secondary);font-weight:600;letter-spacing:0.5px">COMPOSITE RANK</div>
                    <div style="font-size:18px;font-weight:700;margin-top:2px;color:var(--text-primary)">#${rank.composite_rank || '—'}</div>
                </div>
                <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center">
                    <div style="font-size:10px;color:var(--text-secondary);font-weight:600;letter-spacing:0.5px">COMPOSITE</div>
                    <div style="font-size:18px;font-weight:700;margin-top:2px;color:${compColor}">${composite}</div>
                </div>
                <div style="background:var(--bg-secondary);padding:12px;border-radius:8px;text-align:center">
                    <div style="font-size:10px;color:var(--text-secondary);font-weight:600;letter-spacing:0.5px">BREADTH</div>
                    <div style="font-size:18px;font-weight:700;margin-top:2px;color:var(--text-primary)">${rank.breadth != null ? rank.breadth.toFixed(0) + '%' : '—'}</div>
                </div>
            </div>`;

            // ── 2. RS trend chart ───────────────────────────────────────────
            html += `<div style="font-weight:600;font-size:13px;margin-bottom:8px;color:var(--text-secondary)">PEER-GROUP RS TREND (last ${rsHist.length} days)</div>`;
            html += `<div style="background:var(--bg-secondary);padding:14px;border-radius:8px;margin-bottom:24px">
                <div style="position:relative;height:160px"><canvas id="drawerRsChart"></canvas></div>
            </div>`;

            // ── 3. Top movers — day-over-day % change (close vs prev close) ─
            if (drill && drill.rows && drill.rows.length > 0) {
                const movers = drill.rows.map(r => {
                    if (r.close == null || r.prev_close == null || r.prev_close === 0) return null;
                    const ret = (r.close - r.prev_close) / r.prev_close * 100;
                    return { ticker: r.ticker, name: r.name, close: r.close, prev_close: r.prev_close, ret };
                }).filter(x => x);
                movers.sort((a, b) => b.ret - a.ret);
                const gainers = movers.slice(0, 3);
                const losers  = movers.slice(-3).reverse();
                const moverChip = (m, color) => `
                    <a href="https://www.tradingview.com/chart/?symbol=${m.ticker}" target="_blank"
                        style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg-card);border:1px solid ${color}40;border-radius:6px;text-decoration:none;color:var(--text-primary);font-size:12px"
                        title="${m.name || ''} · prev close ${m.prev_close.toFixed(2)} → close ${m.close.toFixed(2)}">
                        <span style="font-weight:600">${m.ticker}</span>
                        <span style="color:${color};font-weight:600">${m.ret >= 0 ? '+' : ''}${m.ret.toFixed(2)}%</span>
                    </a>`;
                const sessionLabel = drill.latestDate
                    ? new Date(drill.latestDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
                    : 'latest session';
                html += `<div style="font-weight:600;font-size:13px;margin-bottom:8px;color:var(--text-secondary)">SESSION MOVERS · ${sessionLabel} &nbsp;<span style="font-weight:400;font-size:11px">(close vs prev close)</span></div>`;
                html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px">

                        <div style="font-size:10px;color:#10b981;font-weight:700;margin-bottom:6px;letter-spacing:0.5px">↑ GAINERS</div>

                    </div>
                    <div>
                        <div style="font-size:10px;color:#ef4444;font-weight:700;margin-bottom:6px;letter-spacing:0.5px">↓ LOSERS</div>
                        <div style="display:flex;flex-direction:column;gap:6px">${losers.map(l => moverChip(l, '#ef4444')).join('') || '<div style="color:var(--text-secondary);font-size:12px">—</div>'}</div>
                    </div>

            }

            // ── 4. Active entry signals in this peer group ─────────────────
            const peerSignals = (entrySignalsData || []).filter(s => tickerClassifications[s.ticker]?.peer_group === peerGroup);
            html += `<div style="font-weight:600;font-size:13px;margin-bottom:8px;color:var(--text-secondary)">ACTIVE SIGNALS (${peerSignals.length})</div>`;
            if (peerSignals.length === 0) {
                html += `<div style="background:var(--bg-secondary);padding:14px;border-radius:8px;color:var(--text-secondary);font-size:12px;margin-bottom:24px;text-align:center">No active entry signals in this peer group today</div>`;
            } else {
                html += `<div style="background:var(--bg-secondary);padding:12px;border-radius:8px;margin-bottom:24px;display:flex;flex-direction:column;gap:6px">`;
