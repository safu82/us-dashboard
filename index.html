        async function migrateLocalTransactionsToSupabase() {
            try {
                console.log('🔄 Starting migration of localStorage transactions to Supabase...');
                
                // Get transactions from localStorage
                const localTransactions = JSON.parse(localStorage.getItem('us_transactions') || '[]');
                
                if (localTransactions.length === 0) {
                    console.log('⚠️ No transactions found in localStorage');
                    return;
                }
                
                console.log(`📊 Found ${localTransactions.length} transactions in localStorage`);
                
                // Get existing transactions from Supabase to avoid duplicates
                const { data: existingTxns, error: fetchError } = await supabase
                    .from('transactions')
                    .select('date, ticker, quantity, price, type');
                
                if (fetchError) throw fetchError;
                
                console.log(`📊 Found ${existingTxns.length} transactions already in Supabase`);
                
                // Filter out duplicates (match by date, ticker, quantity, price, type)
                const newTransactions = localTransactions.filter(local => {
                    return !existingTxns.some(existing => 
                        existing.date === local.date &&
                        existing.ticker === local.ticker &&
                        existing.quantity === local.quantity &&
                        existing.price === local.price &&
                        existing.type === local.type
                    );
                });
                
                console.log(`📤 ${newTransactions.length} new transactions to migrate`);
                
                if (newTransactions.length === 0) {
                    console.log('✅ All transactions already in Supabase - no migration needed');
                    return;
                }
                
                // Insert new transactions
                let successCount = 0;
                for (const txn of newTransactions) {
                    const txnData = {
                        date: txn.date,
                        type: txn.type,
                        stock: txn.stock,
                        ticker: txn.ticker,
                        quantity: txn.quantity,
                        price: txn.price,
                        sector: txn.sector || null
                    };
                    
                    const { error } = await supabase
                        .from('transactions')
                        .insert(txnData);
                    
                    if (error) {
                        console.error(`❌ Failed to migrate transaction:`, txn, error);
                    } else {
                        successCount++;
                        console.log(`✅ Migrated: ${txn.date} ${txn.type} ${txn.quantity} ${txn.ticker} @ $${txn.price}`);
                    }
                }
                
                console.log(`🎉 Migration complete! ${successCount}/${newTransactions.length} transactions migrated`);
                alert(`✅ Migration complete!\n${successCount} transactions saved to Supabase`);
                
            } catch (error) {
                console.error('❌ Migration failed:', error);
                alert('❌ Migration failed - check console for details');
            }
        }
        
        // Add migration button to console
        window.migrateTransactions = migrateLocalTransactionsToSupabase;
        console.log('💡 To migrate localStorage transactions to Supabase, run: migrateTransactions()');

        async function addTransaction(txn) {
            transactions.push(txn);
            localStorage.setItem('us_transactions', JSON.stringify(transactions));

            // Save transaction to Supabase, then patch the local row with the DB id
            // so the new row supports edit/delete without a page reload.
            const newId = await saveTransactionToSupabase(txn);
            if (newId) txn.id = newId;
            
            const existingStock = portfolio.find(s => s.ticker === txn.ticker);
            if (txn.type === 'BUY') {
                if (existingStock) {
                    const totalCost = (existingStock.quantity * existingStock.avgCost) + (txn.quantity * txn.price);
                    const totalQty = existingStock.quantity + txn.quantity;
                    existingStock.avgCost = totalCost / totalQty;
                    existingStock.quantity = totalQty;
                } else {
                    portfolio.push({
                        name: txn.stock, ticker: txn.ticker, quantity: txn.quantity,
                        avgCost: txn.price, sector: txn.sector || 'Other'
                    });
                }
            } else if (txn.type === 'SELL') {
                if (existingStock) {
                    existingStock.quantity -= txn.quantity;
                    if (existingStock.quantity <= 0) {
                        portfolio = portfolio.filter(s => s.ticker !== txn.ticker);
                    }
                }
            }
            
            // Save updated holdings to Supabase
            await saveHoldingsToSupabase(portfolio);

            localStorage.setItem('us_portfolio', JSON.stringify(portfolio));
            // Refresh FIFO lot ledger so realized P&L / open lots reflect the new txn.
            computeFIFO();
            showTransactionForm = false;
            render();
            fetchPrices();
        }

        function createChart(metrics) {
            const canvas = document.getElementById('portfolioChart');
            if (!canvas) return;
            
            if (portfolioChart) {
                portfolioChart.destroy();
            }
            
            const snapshots = getSnapshots();
            const textColor = darkMode ? '#94a3b8' : '#64748b';
            const gridColor = darkMode ? '#334155' : '#e2e8f0';
            
            if (selectedChartType === 'cumulative') {
                // Cumulative gains from Nov 2021 (portfolio inception - matches ATH card)

                const endDate = new Date();
                const currentMonth = endDate.getMonth() + 1;
                const currentYear = endDate.getFullYear();
                const months = [];
                const cumulativeGains = [];
                let runningTotal = 0;
                
                for (let d = new Date(startDate); d <= endDate; d.setMonth(d.getMonth() + 1)) {
                    const year = d.getFullYear();
                    const month = d.getMonth() + 1;
                    const monthStr = String(month).padStart(2, '0');
                    const monthStart = `${year}-${monthStr}-01`;
                    const monthEnd = `${year}-${monthStr}-${new Date(year, month, 0).getDate()}`;
                    
                    months.push(d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }));
                    
                    // Get month start and end values (use getClosestSnapshot to handle weekends/holidays)
                    const prevMonthEndDate = month === 1 
                        ? `${year-1}-12-31` 
                        : `${year}-${String(month-1).padStart(2, '0')}-${new Date(year, month-1, 0).getDate()}`;
                    const prevMonthEnd = getClosestSnapshot(snapshots, prevMonthEndDate);
                    
                    // For current month, use periodGains from metrics; otherwise use snapshot
                    let monthGain;
                    if (year === currentYear && month === currentMonth && selectedPeriodMonth === currentMonth) {
                        monthGain = metrics.periodGains;
                    } else {
                        const monthEndValue = getClosestSnapshot(snapshots, monthEnd);
                        
                        if (prevMonthEnd && monthEndValue) {
                            const monthCashFlows = HISTORICAL_CASH_FLOWS.filter(cf => cf.date >= monthStart && cf.date <= monthEnd);
                            const withdrawals = monthCashFlows.filter(cf => cf.type === 'Withdrawl' || cf.type === 'Withdrawal').reduce((sum, cf) => sum + cf.amount, 0);
                            const deposits = monthCashFlows.filter(cf => cf.type === 'Deposit').reduce((sum, cf) => sum + cf.amount, 0);
                            
                            const monthTransactions = transactions.filter(t => t.date >= monthStart && t.date <= monthEnd);
                            const soldValue = monthTransactions.filter(t => t.type === 'SELL').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                            const purchasedValue = monthTransactions.filter(t => t.type === 'BUY').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                            
                            monthGain = monthEndValue + withdrawals + soldValue - deposits - purchasedValue - prevMonthEnd;
                        } else {
                            monthGain = 0;
                        }
                    }
                    
                    runningTotal += monthGain;
                    cumulativeGains.push(runningTotal);
                }
                
                portfolioChart = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Cumulative Gains',
                            data: cumulativeGains,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,

                                borderWidth: 1,
                                padding: 12,
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y;
                                        const sign = value >= 0 ? '+' : '';
                                        return sign + '$' + new Intl.NumberFormat('en-US').format(value);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: gridColor, display: false },
                                ticks: { 
                                    color: textColor,
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            },
                            y: {
                                grid: { color: gridColor },
                                ticks: {
                                    color: textColor,
                                    callback: function(value) {
                                        return '$' + (value / 1000).toFixed(0) + 'K';
                                    }
                                }
                            }
                        }
                    }
                });
            } else {
                // Monthly gains bar chart (existing code)
                const year = selectedChartYear;
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const monthlyGains = [];
                const currentMonth = new Date().getMonth() + 1; // 1-12
                const currentYear = new Date().getFullYear();
                
                for (let month = 1; month <= 12; month++) {
                    const monthStr = String(month).padStart(2, '0');
                    const monthStart = `${year}-${monthStr}-01`;
                    const monthEnd = `${year}-${monthStr}-${new Date(year, month, 0).getDate()}`;
                    
                    // Find most recent snapshot before period start (handles weekends/holidays)
                    const prevMonthEndDate = month === 1 
                        ? `${year-1}-12-31`
                        : `${year}-${String(month-1).padStart(2, '0')}-${new Date(year, month-1, 0).getDate()}`;
                    const prevMonthEnd = getClosestSnapshot(snapshots, prevMonthEndDate);
                    
                    // For current month in current year, use Period Gains value directly
                    if (year === currentYear && month === currentMonth && selectedPeriodMonth === currentMonth) {
                        monthlyGains.push(metrics.periodGains);
                        continue;
                    }
                    
                    const monthEndValue = getClosestSnapshot(snapshots, monthEnd);
                    
                    if (!prevMonthEnd || !monthEndValue) {
                        monthlyGains.push(null);
                        continue;
                    }
                    
                    const monthCashFlows = HISTORICAL_CASH_FLOWS.filter(cf => cf.date >= monthStart && cf.date <= monthEnd);
                    const withdrawals = monthCashFlows.filter(cf => cf.type === 'Withdrawl' || cf.type === 'Withdrawal').reduce((sum, cf) => sum + cf.amount, 0);
                    const deposits = monthCashFlows.filter(cf => cf.type === 'Deposit').reduce((sum, cf) => sum + cf.amount, 0);
                    
                    const monthTransactions = transactions.filter(t => t.date >= monthStart && t.date <= monthEnd);
                    const soldValue = monthTransactions.filter(t => t.type === 'SELL').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                    const purchasedValue = monthTransactions.filter(t => t.type === 'BUY').reduce((sum, t) => sum + (t.quantity * t.price), 0);
                    
                    const gain = monthEndValue + withdrawals + soldValue - deposits - purchasedValue - prevMonthEnd;
                    monthlyGains.push(gain);
                }
                
                portfolioChart = new Chart(canvas, {
                    type: 'bar',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Monthly Gain/Loss',
                            data: monthlyGains,
                            backgroundColor: monthlyGains.map(val => {
                                if (val === null) return 'rgba(100, 116, 139, 0.2)';
                                return val >= 0 ? 'rgba(16, 185, 129, 0.8)' : 'rgba(239, 68, 68, 0.8)';
                            }),
                            borderColor: monthlyGains.map(val => {
                                if (val === null) return 'rgba(100, 116, 139, 0.5)';
                                return val >= 0 ? 'rgba(16, 185, 129, 1)' : 'rgba(239, 68, 68, 1)';
                            }),
                            borderWidth: 2,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                backgroundColor: darkMode ? '#1e293b' : '#ffffff',
                                titleColor: textColor,
                                bodyColor: textColor,
                                borderColor: gridColor,
                                borderWidth: 1,
                                padding: 12,
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y;
                                        if (value === null) return 'No data';
                                        const sign = value >= 0 ? '+' : '';
                                        return sign + '$' + new Intl.NumberFormat('en-US').format(value);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: gridColor, display: false },
                                ticks: { color: textColor }
                            },
                            y: {
                                grid: { color: gridColor },
                                ticks: {
                                    color: textColor,
                                    callback: function(value) {
                                        return '$' + (value / 100000).toFixed(1) + 'L';
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

        window.handleTransactionSubmit = function(e) {
            e.preventDefault();
            let txn;
            if (isNewStock && !editingTxnId) {
                txn = {
                    date: document.getElementById('date').value,
                    type: document.getElementById('type').value,
                    stock: document.getElementById('stockName').value,
                    ticker: document.getElementById('ticker').value.toUpperCase(),
                    quantity: parseFloat(document.getElementById('quantity').value),
                    price: parseFloat(document.getElementById('price').value),
                    sector: document.getElementById('sector').value || 'Other'
                };
            } else {
                const ticker = document.getElementById('stockSelect').value;
                const stock = portfolio.find(s => s.ticker === ticker)
                    || (editingTxnOriginal && editingTxnOriginal.ticker === ticker ? { name: editingTxnOriginal.stock } : null);
                txn = {
                    date: document.getElementById('date').value,
                    type: document.getElementById('type').value,
                    stock: stock ? stock.name : ticker,
                    ticker: ticker,
                    quantity: parseFloat(document.getElementById('quantity').value),
                    price: parseFloat(document.getElementById('price').value)
                };
            }
            if (editingTxnId) {
                updateTransactionRow(editingTxnId, txn);
            } else {
                addTransaction(txn);
            }
        };

        // Cancel: reset any edit-mode state and close the form.
        window.cancelTransactionForm = function() {
            editingTxnId = null;
            editingTxnOriginal = null;
            showTransactionForm = false;
            isNewStock = false;
            render();
        };

        // Open the form pre-filled with this transaction's values.
        window.editTransactionRow = function(id) {
            const txn = transactions.find(t => String(t.id) === String(id));
            if (!txn) return;
            editingTxnId = txn.id;
            editingTxnOriginal = { ...txn };
            showTransactionForm = true;
            isNewStock = false;
            render();
        };

        // Reverse a transaction's effect on the in-memory portfolio.
        // BUY: subtract qty + reverse the weighted-average cost.
        // SELL: add qty back.
        function reverseTxnOnPortfolio(txn) {
            const stock = portfolio.find(s => s.ticker === txn.ticker);
            if (txn.type === 'BUY') {
                if (!stock) return;
                const newQty = stock.quantity - txn.quantity;
                if (newQty <= 0) {
                    portfolio = portfolio.filter(s => s.ticker !== txn.ticker);
                } else {
                    // Reverse weighted-avg: avg_new * qty_new = avg_old * qty_old - txnQty * txnPrice
                    stock.avgCost = (stock.avgCost * stock.quantity - txn.quantity * txn.price) / newQty;
                    stock.quantity = newQty;
                }
            } else if (txn.type === 'SELL') {
                if (stock) {
                    stock.quantity += txn.quantity;
                } else {
                    // Position had been fully exited by this sell — re-create at cost = sell price (best-effort).
                    portfolio.push({
                        name: txn.stock || txn.ticker, ticker: txn.ticker,
                        quantity: txn.quantity, avgCost: txn.price,
                        sector: txn.sector || 'Other',
                    });
                }
            }
        }

        // Apply a transaction's effect on the in-memory portfolio (mirrors addTransaction).
        function applyTxnOnPortfolio(txn) {
            const existing = portfolio.find(s => s.ticker === txn.ticker);
            if (txn.type === 'BUY') {
                if (existing) {
                    const totalCost = existing.quantity * existing.avgCost + txn.quantity * txn.price;
                    const totalQty = existing.quantity + txn.quantity;
                    existing.avgCost = totalCost / totalQty;
                    existing.quantity = totalQty;
                } else {
                    portfolio.push({
                        name: txn.stock, ticker: txn.ticker, quantity: txn.quantity,
                        avgCost: txn.price, sector: txn.sector || 'Other',
                    });
                }
            } else if (txn.type === 'SELL') {
                if (existing) {
                    existing.quantity -= txn.quantity;
                    if (existing.quantity <= 0) {
                        portfolio = portfolio.filter(s => s.ticker !== txn.ticker);
                    }
                }
            }
        }

        // Confirm + delete a transaction; reverse its portfolio effect; persist; refresh.
        window.deleteTransactionRow = async function(id) {
            const txn = transactions.find(t => String(t.id) === String(id));
            if (!txn) return;
            if (!confirm(`Delete ${txn.type} ${txn.quantity} ${txn.ticker} on ${txn.date}?`)) return;
            const { error } = await supabase.from('transactions').delete().eq('id', id);
            if (error) { alert('Delete failed: ' + error.message); return; }
            reverseTxnOnPortfolio(txn);
            transactions = transactions.filter(t => String(t.id) !== String(id));
            localStorage.setItem('us_transactions', JSON.stringify(transactions));
            await saveHoldingsToSupabase(portfolio);
            localStorage.setItem('us_portfolio', JSON.stringify(portfolio));
            computeFIFO();
            render();
        };

        // Update an existing transaction: reverse the old row, apply the new values, persist.
        async function updateTransactionRow(id, newTxn) {
            const old = editingTxnOriginal;
            if (!old) return;
            const { error } = await supabase.from('transactions').update({
                date: newTxn.date, type: newTxn.type, stock: newTxn.stock,
                ticker: newTxn.ticker, quantity: newTxn.quantity, price: newTxn.price,
            }).eq('id', id);
            if (error) { alert('Update failed: ' + error.message); return; }
            // Reverse old → apply new on portfolio (BUY/SELL math)
            reverseTxnOnPortfolio(old);
            applyTxnOnPortfolio(newTxn);
            // Update local transactions array
            const idx = transactions.findIndex(t => String(t.id) === String(id));
            if (idx !== -1) transactions[idx] = { ...old, ...newTxn, id: old.id };
            localStorage.setItem('us_transactions', JSON.stringify(transactions));
            await saveHoldingsToSupabase(portfolio);
            localStorage.setItem('us_portfolio', JSON.stringify(portfolio));
            editingTxnId = null;
            editingTxnOriginal = null;
            showTransactionForm = false;
            computeFIFO();
            render();
        }

        setInterval(() => {
            const estTime = getESTTime();
            const hour = estTime.getHours();
            const minute = estTime.getMinutes();
            const day = estTime.getDay();
            const isWeekday = day >= 1 && day <= 5;
            const isMarketHours = (hour === 9 && minute >= 30) || (hour > 9 && hour < 16) || (hour === 16 && minute === 0);
            if (isWeekday && isMarketHours) {
                fetchPrices();
            }
        }, 300000);

// Report Generator Function for US Portfolio
async function generateReport() {
    const startDate = document.getElementById('report-start-date').value;
    const endDate = document.getElementById('report-end-date').value;
    const statusDiv = document.getElementById('report-status');
    const statusText = statusDiv.querySelector('span');
    
    if (!startDate || !endDate) {
        alert('Please select both start and end dates');
        return;
    }
    
    if (new Date(startDate) > new Date(endDate)) {
        alert('Start date must be before end date');
        return;
    }
    
    // Show loading status
    statusDiv.style.display = 'block';
    statusText.textContent = '⏳ Generating report...';
    statusText.style.color = '#667eea';
    
    try {
        // Call the Python server
        const response = await fetch('http://localhost:5000/generate-report', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                portfolio: 'US',  // US Portfolio
                start_date: startDate,
                end_date: endDate
            })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to generate report');
        }
        
        // Download the PDF
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Portfolio_Report_US_${startDate}_to_${endDate}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        statusText.textContent = '✅ Report downloaded!';
        statusText.style.color = '#27ae60';
        
        // Hide status after 3 seconds
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 3000);
        
    } catch (error) {
        console.error('Report generation error:', error);
        
        // Check if server is running
        if (error.message.includes('fetch')) {
            statusText.textContent = '❌ Server not running';
            statusText.style.color = '#c0392b';
            
            // Show instructions to start server
            const instructions = `The report server is not running. To start it:

1. Open a new terminal window

2. Navigate to your Downloads folder:
   cd Downloads

3. Run this command:
   python report_server.py

4. Keep the terminal open and try again!

The server will show: "🚀 Report Server starting on http://localhost:5000"`;
            
            alert(instructions);
        } else {
            statusText.textContent = '❌ Error: ' + error.message;
            statusText.style.color = '#c0392b';
        }
        
        // Hide status after 8 seconds
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 8000);
    }
}
