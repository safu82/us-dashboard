# Netlify configuration for the PUBLIC portal (Market Compass).
#
# The site's Netlify subdomain is still us-sector-compass.netlify.app. Renaming
# it would break every link already shared, and the name people see is the one
# in the page, so the URL is deliberately left alone. A custom domain is the
# right fix if this ever gets promoted properly.
#
# The private dashboard (index.html, combined-dashboard.html, deep_dive.html)
# is NOT deployed from here — it stays a manual upload to its own site, and
# nothing in this file touches it.
#
# `publish = "portal"` means Netlify serves only that folder. The repo root,
# including every page that carries a Supabase key, is never published by this
# site. There is no build step: the page and its data are already static, and
# the nightly scan commits a fresh portal/data, which is what triggers a deploy.

[build]
  # base matters more than it looks. Netlify runs its "Install dependencies"
  # stage inside the base directory and decides what to install from the
  # manifests it finds there. Left at the repo root it found runtime.txt
  # (python-3.11.7) and requirements.txt, concluded this was a Python project,
  # and failed trying to install the scanner's packages — which the site does
  # not use and which have no business running on a deploy.
  #
  # portal/ holds index.html and data/ and nothing else, so there is nothing to
  # detect and the stage passes straight through.
  base = "portal"

  # Relative to base, so this is portal/ itself.
  publish = "."

  # No build: the page and its data are already static.
  command = ""

# The data bundle is rewritten every weeknight, so it must not be served from
# cache after a deploy. The page itself is small and changes rarely, but the
# same rule keeps a stale shell from pairing with fresh data.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Nothing here collects input or embeds anything, so the browser can be told to
# allow very little. Scripts and styles are inline in the page, hence the
# 'unsafe-inline' allowances; there are no external resources of any kind.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
