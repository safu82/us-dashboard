name: Fetch TipRanks data (US)

# Daily at 06:30 UTC — runs right after the yfinance ratings refresh (06:23).
# Batched get_assets_data MCP calls (100 tickers/call) cover the full ~1,900-name
# scan universe for smart score, consensus, insider/hedge-fund/blogger sentiment,
# news sentiment, and earnings dates. That's ~20 calls, spaced 15s apart to stay
# under the free tier's 5 req/min, and ~6-7 min of wall time. It uses ~20 of the
# 25 free-tier calls/day, so AVOID stacking manual re-runs on the same day or the
# daily quota will be exhausted (later batches then fail).
#
# REQUIRES GitHub secret: TIPRANKS_API_KEY
# Get one at https://www.tipranks.com/developer-portal (Free plan is enough).
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch TipRanks data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase python-dotenv
      - name: Run fetch_tipranks_data.py
        run: python fetch_tipranks_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TIPRANKS_API_KEY: ${{ secrets.TIPRANKS_API_KEY }}
