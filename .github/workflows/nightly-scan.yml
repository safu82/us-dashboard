name: Nightly scan (US)

# Primary at 22:07 UTC Mon-Fri, then three catch-up attempts overnight.
#
# US regular session closes 16:00 ET = 20:00 UTC (EDT) / 21:00 UTC (EST), but
# Yahoo does not finalize daily bars at the close: it serves a placeholder row
# (NaN OHLC carrying only a volume) and fills in the real bar per symbol over
# the following hours. Observed spread on when a session became usable ranged
# from ~4h after the close (2026-09-18) to >12h (2026-09-22), so a single slot
# is a bet. fetch_ohlc exits 75 when the session simply is not published yet;
# that is not a failure, so the run skips the rest of the chain quietly and the
# next attempt picks it up. Only the last attempt of the day raises an alarm.
#
# GitHub delays these crons by roughly 2h in practice, so the effective times
# are about 00:20, 03:20, 06:20 and 09:20 UTC — all ahead of compute-conviction,
# which is chained off this workflow succeeding.
#
# The chain shares state via daily_stock_snapshots so steps must run in order:
#   fetch_ohlc -> compute_cross_sectional -> compute_sector_rankings
#                                         -> entry_signals_scanner
#                                         -> score_presignals
#   fetch_ohlc -> portfolio_alerts_scanner
on:
  schedule:
    - cron: '7 22 * * 1-5'   # primary, after the US close
    - cron: '7 1 * * 2-6'    # catch-up 1
    - cron: '7 4 * * 2-6'    # catch-up 2
    - cron: '7 7 * * 2-6'    # final attempt — alerts if still unpublished
  workflow_dispatch:

jobs:
  scan:
    name: OHLC + cross-sectional + sector rankings + alerts
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commits the regenerated portal/data JSON
    timeout-minutes: 45
    outputs:
      published: ${{ steps.ohlc.outputs.published }}
      needed: ${{ steps.precheck.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy supabase python-dotenv requests lxml

      # 0. Is there anything to do? Skip when the most recent weekday is already
      #    scored, so a successful primary run does not make the catch-ups refetch
      #    ~1,900 tickers three more times (needless load on a rate-limited Yahoo).
      #    Holidays make this say "run", which costs ~1 min of fail-fast — the safe
      #    direction to be wrong in.
      - name: 0/16 skip if already current
        id: precheck
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta
          from supabase import create_client
          sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])
          r = (sb.table('daily_stock_snapshots').select('snapshot_date')
               .not_.is_('momentum_score', 'null')
               .order('snapshot_date', desc=True).limit(1).execute().data)
          scored = date.fromisoformat(r[0]['snapshot_date']) if r else None
          prev = date.today() - timedelta(days=1)
          while prev.weekday() > 4:           # back up over the weekend
              prev -= timedelta(days=1)
          need = scored is None or scored < prev
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'needed={"true" if need else "false"}\n')
          print(f'latest scored={scored} previous weekday={prev} '
                f'-> {"running" if need else "already current, skipping"}')
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 1. Pull EOD OHLC + indicators for the S&P500 + NASDAQ100 + holdings universe.
      #    Exit 75 means Yahoo has not finalized the session — skip the chain, no alarm.
      - name: 1/16 fetch_ohlc.py
        id: ohlc
        if: steps.precheck.outputs.needed == 'true'
        run: |
          set +e
          python fetch_ohlc.py
          rc=$?
          set -e
          if [ "$rc" -eq 75 ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Session not finalized by Yahoo yet — skipping downstream steps."
            exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 2. Append latest QQQ close to benchmark_history (long-lived; survives 90d prune)
      - name: 2/16 sync_benchmark_history.py
        if: steps.ohlc.outputs.published == 'true'
        run: python sync_benchmark_history.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 3. Cross-sectional metrics: rs_rank, sector_percentile, peer_*, rank_slope
      - name: 3/16 compute_cross_sectional.py
        if: steps.ohlc.outputs.published == 'true'
        run: python compute_cross_sectional.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 4. Aggregate per-peer-group: composite, breadth, RRG quadrant, rs_slope
      - name: 4/16 compute_sector_rankings.py
        if: steps.ohlc.outputs.published == 'true'
        run: python compute_sector_rankings.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 5. Entry-signal patterns (8 detectors -> entry_signals table)
      - name: 5/16 entry_signals_scanner.py
        if: steps.ohlc.outputs.published == 'true'
        run: python entry_signals_scanner.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 6. Pre-signal scoring (6 rules, score >= 70 -> presignal_scores table)
      - name: 6/16 score_presignals.py
        if: steps.ohlc.outputs.published == 'true'
        run: python score_presignals.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 7. Holdings-only alerts (ema_crossover, vol_breakout, blue_zone -> alerts table)
      - name: 7/16 portfolio_alerts_scanner.py
        if: steps.ohlc.outputs.published == 'true'
        run: python portfolio_alerts_scanner.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 8. Market-health rollup: breadth, new-high/low, S&P-vs-200d, VIX -> market_health
      #    (newsletter "Where We Stand"). Depends only on fetch_ohlc output.
      - name: 8/16 compute_market_health.py
        if: steps.ohlc.outputs.published == 'true'
        run: python compute_market_health.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 9. ETF momentum board: sector SPDRs + thematic ETFs ranked in their OWN
      #    cross-section -> etf_snapshots (sector-research ETF board). Self-contained
      #    (fetches its own ETF + benchmark OHLC via yfinance); order-independent.
      - name: 9/16 compute_etf_momentum.py
        if: steps.ohlc.outputs.published == 'true'
        run: python compute_etf_momentum.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 10. Universe attrition. The coverage guard in step 1 catches the whole
      #     market stalling; it cannot catch individual tickers quietly dropping
      #     out while the run stays green -- 32 had leaked out before anyone
      #     looked, including two S&P 500 REITs. Reports every night and only
      #     fails on a sudden cluster, so slow attrition stays visible without
      #     crying wolf.
      - name: 10/16 check_universe_health.py
        if: steps.ohlc.outputs.published == 'true'
        run: python check_universe_health.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 11. Freeze the sector-research data into static JSON for the public
      #     portal and commit it. The public site reads these files from the CDN
      #     and holds no database credential of any kind, so nothing it serves
      #     can reach the portfolio project.
      - name: 11/16 build_public_data.py
        if: steps.ohlc.outputs.published == 'true'
        run: python build_public_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      #     A push race is the one failure worth tolerating here: another job or
      #     a human can land a commit between our pull and our push. That is
      #     retried. Everything else is a real fault - no write permission, a
      #     rebase conflict, a rejection that survives three attempts - and the
      #     step must fail so the job goes red and notify sends the FAILED
      #     alert. This step used to carry a blanket continue-on-error, which
      #     would have hidden a dead publish behind a green run while the
      #     public site served the previous day's data indefinitely.
      # 12-13: what the market press is talking about, and the one-screen read
      #     of it. feed_mentions is only useful joined against the scores, so
      #     it is written here rather than on its own schedule: the note that
      #     follows needs both halves from the same session.
      #
      #     The news step is NOT gated on the session being published. Stories
      #     scroll off an RSS feed within hours, so the catch-up attempts are
      #     worth their own pass even when Yahoo has nothing new; the step is
      #     idempotent on (source, url, entity), so repeats cost nothing.
      - name: 12/16 fetch_news_feeds.py
        run: python fetch_news_feeds.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Who reports next. Nasdaq's public calendar, no key and no login; this
      #     is the only forward-looking data in the chain and the only reason a
      #     name can appear on the board before anything has happened to it.
      #     Ungated like the news step: the calendar moves on its own schedule.
      - name: 13/16 fetch_earnings_calendar.py
        run: python fetch_earnings_calendar.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 14/16 build_digest.py
        if: steps.ohlc.outputs.published == 'true'
        run: python build_digest.py --telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Static pages for the data the previous steps just wrote. Reads only
      # portal/data from disk, so it needs no database and no secrets, and it
      # cannot fail for a reason the scan has not already failed for.
      #
      # Gated like the rest: it writes a dated digest page, and that date must
      # belong to a session that actually published. An ungated run on a day the
      # scan skipped would mint a permanent page for a session that never was.
      - name: 15/16 build_archive.py
        if: steps.ohlc.outputs.published == 'true'
        run: python build_archive.py

      # Candidate posts for @overnightarc, written before anyone is awake to
      # write them. Reads only the files the previous steps just produced, so
      # it needs no database and cannot fail for a new reason.
      #
      # It drafts; it does not publish. Each candidate carries `auto`, true
      # only where the claim is a number from our own data in a fixed sentence.
      # Nothing posts to X from here - that needs the paid API, and turning it
      # on is a decision about the templates, not about this step.
      - name: 16/16 build_posts.py
        if: steps.ohlc.outputs.published == 'true'
        run: python build_posts.py --telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Publish portal data and pages
        if: steps.ohlc.outputs.published == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # portal/ not portal/data: the generated pages, a.css, sitemap.xml and
          # robots.txt all live beside it and all need publishing. Everything
          # under portal/ is either generated or the hand-written index.
          git add portal
          git commit -m "Portal data and pages: $(date -u +%Y-%m-%d)" || { echo "no change to publish"; exit 0; }
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              echo "::error::Rebase onto origin/main failed; portal/data conflicts with an upstream change."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published portal/data on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; assuming a concurrent push and retrying."
            sleep $(( attempt * 10 ))
          done
          echo "::error::Could not push portal/data after 3 attempts. The public site is serving stale data."
          exit 1

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    steps:
      - name: Send Telegram message
        continue-on-error: true   # don't fail the workflow if Telegram secrets aren't set
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_STATUS: ${{ needs.scan.result }}
          PUBLISHED: ${{ needs.scan.outputs.published }}
          NEEDED: ${{ needs.scan.outputs.needed }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi
          # '7 7 * * 2-6' is the last attempt of the day; a manual dispatch sends
          # no schedule at all and should always report.
          IS_FINAL=false
          if [ "$SCHEDULE" = '7 7 * * 2-6' ] || [ -z "$SCHEDULE" ]; then
            IS_FINAL=true
          fi
          if [ "$SCAN_STATUS" != "success" ]; then
            EMOJI="❌"; TITLE="US nightly scan FAILED"
          elif [ "$NEEDED" = "false" ]; then
            echo "Already current before this attempt; nothing to report."
            exit 0
          elif [ "$PUBLISHED" = "true" ]; then
            EMOJI="✅"; TITLE="US nightly scan OK"
          elif [ "$IS_FINAL" = "true" ]; then
            EMOJI="⏳"; TITLE="US nightly scan — Yahoo never published the session"
          else
            echo "Session not published yet on a catch-up attempt; staying quiet."
            exit 0
          fi
          printf -v MSG '%s <b>%s</b>\nscan: %s\n\n<a href="%s">view run</a>' "$EMOJI" "$TITLE" "$SCAN_STATUS" "$RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"
