name: Paper Trader — D0 scan (US)

# 22:35 UTC Mon-Fri — 28 min after nightly-scan.yml starts (~13 min budget after
# its 7-step chain). Reads today's entry_signals + presignal_scores and writes
# PENDING paper_trades rows. paper-fill-pending.yml fills them at D1 open.
on:
  schedule:
    - cron: '35 22 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    name: Paper trader scan + exits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv
      - name: Run paper_trader.py
        run: python paper_trader.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    steps:
      - name: Send Telegram message
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ needs.scan.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            EMOJI="🤖"; TITLE="US paper trader scan OK"
          else
            EMOJI="❌"; TITLE="US paper trader scan FAILED"
          fi
          printf -v MSG '%s <b>%s</b>\nstatus: %s\n\n<a href="%s">view run</a>' "$EMOJI" "$TITLE" "$STATUS" "$RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"
