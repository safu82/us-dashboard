name: Fetch analyst ratings (US)

# Daily at 06:23 UTC. Pulls analyst consensus, price targets, and recent
# upgrades/downgrades from yfinance for the full S&P 500 + NASDAQ 100 universe
# (~518 tickers). Runtime ~4 minutes with the 0.3s per-ticker sleep.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch analyst ratings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas supabase python-dotenv
      - name: Run fetch_analyst_ratings.py
        run: python fetch_analyst_ratings.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
