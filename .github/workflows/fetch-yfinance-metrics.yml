name: Weekly fundamentals refresh (US)

# Saturday 06:09 UTC — well outside US market hours, weekly cadence since
# fundamentals (P/E, ROE, returns, market cap) don't change daily and the
# script takes ~50-60 min to walk the ~1,900-name universe (3 sequential passes).
on:
  schedule:
    - cron: '9 6 * * 6'
  workflow_dispatch:

jobs:
  fetch-metrics:
    name: Fetch US fundamentals/metrics
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy supabase python-dotenv
      - name: Fetch metrics
        run: python fetch_yfinance_metrics.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: fetch-metrics
    if: always()
    steps:
      - name: Send Telegram message
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ needs.fetch-metrics.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"; TITLE="US weekly fundamentals OK"
          else
            EMOJI="❌"; TITLE="US weekly fundamentals FAILED"
          fi
          printf -v MSG '%s <b>%s</b>\nfetch-metrics: %s\n\n<a href="%s">view run</a>' "$EMOJI" "$TITLE" "$STATUS" "$RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"
