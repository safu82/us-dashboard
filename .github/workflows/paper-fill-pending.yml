name: Paper Fill — D1 open (US)

# 13:35 UTC Mon-Fri = ~9:35 AM ET (5 min after US open). Reads pending
# paper_trades, fills at live_prices first tick + 15 bps slippage. Idempotent;
# retries pending rows that have no live_prices yet.
on:
  schedule:
    - cron: '35 13 * * 1-5'
  workflow_dispatch:

jobs:
  fill:
    name: Paper fill pending
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv
      - name: Run paper_fill_pending.py
        run: python paper_fill_pending.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: fill
    if: always()
    steps:
      - name: Send Telegram message
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ needs.fill.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            EMOJI="📥"; TITLE="US paper fill OK"
          else
            EMOJI="❌"; TITLE="US paper fill FAILED"
          fi
          printf -v MSG '%s <b>%s</b>\nstatus: %s\n\n<a href="%s">view run</a>' "$EMOJI" "$TITLE" "$STATUS" "$RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true"
