name: Fetch OHLC

# 22:07 UTC Mon-Fri. US regular session closes 16:00 ET, which is 21:00 UTC
# (EDT) / 22:00 UTC (EST) — a fixed 22:07 UTC run lands after the close
# year-round, so the DST shift is harmless. Minute :07 is off-the-hour
# because GitHub delays on-the-hour scheduled runs worst under load.
on:
  schedule:
    - cron: '7 22 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-ohlc:
    name: Fetch US OHLC + indicators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance pandas numpy supabase python-dotenv
      - name: Fetch OHLC
        run: python fetch_ohlc.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
